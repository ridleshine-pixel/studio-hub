            <div class="flex items-start justify-between gap-2">
              <div class="flex flex-wrap items-center gap-1"><span class="text-[10px] px-2 py-0.5 rounded accent-pill">${tk.type === 'team' ? '🤝 ' + t('typeTeam') : tk.type === 'rest' ? '☕ ' + t('typeRest') : '👤 ' + t('typePersonal')}</span>${tk.onRoadmap ? `<span class="text-[10px] px-1.5 py-0.5 rounded bg-white/10">🗺️ ${t('onRoadmap')}</span>` : ''}${tk.isToday !== false ? `<span class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-300">🕒 ${t('inToday')}</span>` : ''}</div>
              <button data-cycle-status="${tk.id}" class="text-[11px] px-2 py-0.5 rounded-lg border font-medium shrink-0 ${st.cls}">${st.label}</button>
            </div>
            <div><h4 class="font-bold text-sm ${tk.status === 'done' ? 'line-through opacity-75' : ''}">${escapeHtml(tk.title)}</h4>${tk.description ? `<p class="text-xs mt-1 line-clamp-2" style="color: var(--text-muted);">${escapeHtml(tk.description)}</p>` : ''}</div>
          </div>
          <div class="space-y-2.5 pt-2 border-t" style="border-color: var(--border-color);">
            <div class="flex items-center gap-2 text-xs"><span class="shrink-0" style="color: var(--text-muted);">${t('assignQuick')}</span><select data-quick-assign="${tk.id}" class="flex-1 py-1 text-xs"><option value="">${t('unassigned')}</option><option value="__team" ${assignVal === '__team' ? 'selected' : ''}>🤝 ${t('typeTeam')}</option><option value="__rest" ${assignVal === '__rest' ? 'selected' : ''}>☕ ${t('typeRest')}</option>${sortedMembers.map(m => `<option value="${m.id}" ${assignVal === m.id ? 'selected' : ''}>${escapeHtml(m.name)}</option>`).join('')}</select></div>
            <div class="rounded-xl p-2.5 bg-black/25 space-y-1.5">
              <div class="flex items-center justify-between gap-2"><div class="font-mono text-sm font-bold flex items-center gap-1.5 ${tk.running ? 'text-amber-300' : ''}"><i data-lucide="timer" class="w-4 h-4" style="color: var(--accent);"></i><span data-timer-display="${tk.id}">${formatTimer(tk.remainingSec)}</span><span class="text-[10px] font-normal opacity-60">/ ${tk.durationMin} ${t('minUnit')}</span></div><div class="flex items-center gap-1"><button data-timer-toggle="${tk.id}" class="px-2 py-1 rounded-lg text-[11px] font-semibold ${tk.running ? 'bg-amber-500/25 text-amber-200' : 'accent-pill'}">${tk.running ? t('timerPause') : t('timerStart')}</button><button data-timer-reset="${tk.id}" class="p-1 rounded-lg card"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i></button></div></div>
              <div class="h-1.5 rounded-full bg-white/10 overflow-hidden"><div data-timer-bar="${tk.id}" class="h-full transition-all duration-300" style="width:${pct}%; background: var(--accent);"></div></div>
            </div>
            <div class="flex items-center justify-between text-[11px]"><span class="font-mono opacity-75">${tk.timeSlot ? '🕒 ' + escapeHtml(tk.timeSlot) : ''}</span><div class="flex items-center gap-1"><button data-edit-task="${tk.id}" class="px-2.5 py-1 rounded-lg card flex items-center gap-1"><i data-lucide="pencil" class="w-3 h-3"></i> ${t('edit')}</button>${isDir ? `<button data-delete-task="${tk.id}" class="px-2 py-1 rounded-lg card text-red-400 hover:bg-red-500/20"><i data-lucide="trash-2" class="w-3 h-3"></i></button>` : ''}</div></div>
          </div>
        </div>`;
      }).join('')}</div>`;
    }

    function bindTaskInteractions(container, folder) {
      container.querySelectorAll('[data-filter-target]').forEach(el => {
        el.addEventListener('click', () => { state.taskFilterMemberId = el.dataset.filterTarget; renderTasksTab(container, folder); if (window.lucide) lucide.createIcons(); });
        if (el.dataset.dropMember || el.dataset.dropType) {
          el.addEventListener('dragover', (e) => { e.preventDefault(); el.classList.add('drop-target-active'); });
          el.addEventListener('dragleave', () => el.classList.remove('drop-target-active'));
          el.addEventListener('drop', (e) => {
            e.preventDefault(); el.classList.remove('drop-target-active');
            const tid = e.dataTransfer.getData('text/plain') || dragTaskId;
            const tk = folder.tasks.find(x => x.id === tid); if (!tk) return;
            if (el.dataset.dropMember) {
              runWorkloadIntelligenceCheck(folder, el.dataset.dropMember, tk.dayId, tk.title, tk.description, tk.durationMin, tk.id, (finalId) => {
                tk.type = 'personal'; tk.assigneeId = finalId; saveState(); renderAll(); showToast(t('toastSaved'));
              });
              return;
            }
            else if (el.dataset.dropType === 'team') { tk.type = 'team'; tk.assigneeId = ''; }
            else if (el.dataset.dropType === 'rest') { tk.type = 'rest'; tk.assigneeId = ''; }
            saveState(); renderAll(); showToast(t('toastSaved'));
          });
        }
      });
      container.querySelectorAll('[data-drag-task]').forEach(card => card.addEventListener('dragstart', (e) => { dragTaskId = card.dataset.dragTask; e.dataTransfer.setData('text/plain', dragTaskId); }));
      container.querySelectorAll('[data-add-task-ms]').forEach(btn => btn.addEventListener('click', () => openTaskModal(null, btn.dataset.addTaskMs)));
      container.querySelectorAll('[data-cycle-status]').forEach(btn => {
        btn.addEventListener('click', () => {
          if (sessionAccessMode === 'view') return;
          const tk = folder.tasks.find(x => x.id === btn.dataset.cycleStatus); if (!tk) return;
          const order = ['todo', 'in_progress', 'done'];
          const prev = tk.status;
          tk.status = order[(order.indexOf(tk.status) + 1) % order.length];
          if (tk.status === 'done') tk.running = false;
          saveState(); renderAll();
          if (prev !== 'done' && tk.status === 'done') checkAllTasksVictory(folder);
        });
      });
      container.querySelectorAll('[data-quick-assign]').forEach(sel => {
        if (sessionAccessMode !== 'director') sel.disabled = true;
        sel.addEventListener('change', () => {
          if (sessionAccessMode !== 'director') return;
          const tk = folder.tasks.find(x => x.id === sel.dataset.quickAssign); if (!tk) return;
          const val = sel.value;
          if (val === '__team') { tk.type = 'team'; tk.assigneeId = ''; saveState(); renderAll(); }
          else if (val === '__rest') { tk.type = 'rest'; tk.assigneeId = ''; saveState(); renderAll(); }
          else if (!val) { tk.type = 'personal'; tk.assigneeId = ''; saveState(); renderAll(); }
          else {
            runWorkloadIntelligenceCheck(folder, val, tk.dayId, tk.title, tk.description, tk.durationMin, tk.id, (finalId) => {
              tk.type = 'personal'; tk.assigneeId = finalId; saveState(); renderAll();
            });
          }
        });
      });
      container.querySelectorAll('[data-timer-toggle]').forEach(btn => {
        if (sessionAccessMode === 'view') btn.classList.add('hidden');
        btn.addEventListener('click', () => {
          if (sessionAccessMode === 'view') return;
          const tk = folder.tasks.find(x => x.id === btn.dataset.timerToggle); if (!tk) return;
          if (!tk.running && tk.remainingSec <= 0) tk.remainingSec = (tk.durationMin || 30) * 60;
          tk.running = !tk.running; tk.runningSince = tk.running ? Date.now() : null; if (tk.running && tk.status === 'todo') tk.status = 'in_progress';
          saveState(); renderTasksTab(container, folder); if (window.lucide) lucide.createIcons();
        });
      });
      container.querySelectorAll('[data-timer-reset]').forEach(btn => {
        if (sessionAccessMode === 'view') btn.classList.add('hidden');
        btn.addEventListener('click', () => {
          if (sessionAccessMode === 'view') return;
          const tk = folder.tasks.find(x => x.id === btn.dataset.timerReset); if (!tk) return;
          tk.running = false; tk.runningSince = null; tk.remainingSec = (tk.durationMin || 30) * 60;
          saveState(); renderTasksTab(container, folder); if (window.lucide) lucide.createIcons();
        });
      });
      container.querySelectorAll('[data-edit-task]').forEach(btn => {
        if (sessionAccessMode !== 'director') { btn.classList.add('hidden'); return; }
        btn.addEventListener('click', () => openTaskModal(btn.dataset.editTask, null));
      });
      container.querySelectorAll('[data-delete-task]').forEach(btn => {
        btn.addEventListener('click', () => {
          const tk = folder.tasks.find(x => x.id === btn.dataset.deleteTask); if (!tk) return;
          confirmDelete(`Удалить задачу «${tk.title}»?`, () => { folder.tasks = folder.tasks.filter(x => x.id !== tk.id); saveState(); renderAll(); });
        });
      });
    }

    const LEVEL_DAILY_CAP_MIN = { intern: 180, junior: 240, middle: 320, senior: 390, lead: 420 };
    const LEVEL_TASK_COUNT_CAP = { intern: 2, junior: 3, middle: 4, senior: 5, lead: 6 };

    function estimateTaskDifficulty(title, desc) {
      const txt = ((title || '') + ' ' + (desc || '')).toLowerCase();
      if (/архитектур|движок|мультиплеер|сеть|шейдер|оптимиз|ии|ai|риггинг|rigging|блокаут|blockout|левел|level|c\+\+|shader|boss|босс/.test(txt)) {
        return { level: 'high', score: 3, labelRu: 'Высокая (техническая / комплексная)', labelEn: 'High (technical / complex)' };
      }
      if (/модел|анимац|текстур|интерфейс|ui|звук|механик|скрипт|прототип|концепт|model|anim|texture|sound|script|prototype/.test(txt)) {
        return { level: 'medium', score: 2, labelRu: 'Средняя (профильная разработка)', labelEn: 'Medium (core production)' };
      }
      return { level: 'low', score: 1, labelRu: 'Базовая', labelEn: 'Standard' };
    }

    function getMemberDayStats(folder, memberId, dayId, excludeTaskId) {
      const tasks = folder.tasks.filter(tk => tk.assigneeId === memberId && tk.dayId === dayId && tk.status !== 'done' && tk.type === 'personal' && tk.id !== excludeTaskId);
      const totalMin = tasks.reduce((sum, tk) => sum + (Number(tk.durationMin) || 30), 0);
      return { count: tasks.length, totalMin, tasks };
    }

    function findBestAlternativeMember(folder, dayId, excludeMemberId, taskTitle, excludeTaskId) {
      const candidates = folder.members.filter(m => m.id !== excludeMemberId).map(m => {
        const st = getMemberDayStats(folder, m.id, dayId, excludeTaskId);
        const cap = LEVEL_DAILY_CAP_MIN[m.level] || 300;
        const loadRatio = st.totalMin / cap;
        return { member: m, stats: st, loadRatio };
      }).sort((a, b) => a.loadRatio - b.loadRatio);
      return candidates[0] || null;
    }

    async function runWorkloadIntelligenceCheck(folder, memberId, dayId, taskTitle, taskDesc, durationMin, excludeTaskId, onConfirmAssign) {
      const member = folder.members.find(m => m.id === memberId);
      if (!member) { onConfirmAssign(memberId); return; }

      const stats = getMemberDayStats(folder, memberId, dayId, excludeTaskId);
      const dayObj = folder.days.find(d => d.id === dayId);
      const dayTitle = dayObj ? dayObj.title : 'День';
      const capMin = LEVEL_DAILY_CAP_MIN[member.level] || 300;
      const capCount = LEVEL_TASK_COUNT_CAP[member.level] || 4;
      const projectedMin = stats.totalMin + (Number(durationMin) || 30);
      const projectedCount = stats.count + 1;
      const diff = estimateTaskDifficulty(taskTitle, taskDesc);
      const levelRank = { intern: 1, junior: 2, middle: 3, senior: 4, lead: 5 }[member.level] || 3;

      const isOverloaded = projectedMin > capMin || projectedCount > capCount;
      const isSkillStretch = diff.score >= 3 && levelRank <= 2;

      if (!isOverloaded && !isSkillStretch) {
        onConfirmAssign(memberId);
        return;
      }

      const bestAlt = findBestAlternativeMember(folder, dayId, memberId, taskTitle, excludeTaskId);
      const lvObj = SKILL_LEVELS.find(x => x.id === member.level) || SKILL_LEVELS[2];

      let reasons = [];
      if (projectedCount > capCount) reasons.push(`На «${dayTitle}» у участника станет ${projectedCount} активн. задач (рекомендуемый лимит для ${lvObj.ru}: до ${capCount}).`);
      if (projectedMin > capMin) reasons.push(`Суммарное время на «${dayTitle}» составит ${projectedMin} мин (~${(projectedMin/60).toFixed(1)} ч) при норме ${capMin} мин.`);
      if (isSkillStretch) reasons.push(`Задача «${taskTitle}» оценена как сложная (${diff.labelRu}), а текущий уровень участника — ${lvObj.ru}.`);

      // Render Smart Warning Modal immediately (and optionally enrich with Live Gemini AI!)
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center gap-2 text-amber-400">
            <i data-lucide="brain-circuit" class="w-5 h-5"></i>
            <h3 class="font-bold text-base">${t('aiCheckTitle')}</h3>
          </div>

          <div class="card rounded-xl p-3.5 space-y-2 border-amber-500/40">
            <div class="text-xs font-bold text-amber-300">⚠️ ${t('aiOverloadWarn')}</div>
            <div class="text-xs"><b>${escapeHtml(member.name)}</b> (${escapeHtml(lvObj.ru)} · ${(member.roles || []).join(', ')})</div>
            <ul class="text-xs space-y-1 list-disc pl-4" style="color: var(--text-muted);">
              ${reasons.map(r => `<li>${escapeHtml(r)}</li>`).join('')}
            </ul>
          </div>

          <div id="aiLiveAdviceBox" class="${state.geminiApiKey ? '' : 'hidden'} card rounded-xl p-3 text-xs space-y-1.5">
            <div class="font-semibold flex items-center gap-1.5" style="color: var(--accent-2);">🧠 Gemini AI анализирует задачу и команду...</div>
            <div class="ai-thinking-bar"></div>
          </div>

          <div class="flex flex-col sm:flex-row flex-wrap justify-end gap-2 pt-2 border-t" style="border-color: var(--border-color);">
            <button type="button" id="aiCancelBtn" class="px-3.5 py-2 rounded-xl card text-xs">${t('aiCancelAssign')}</button>
            ${bestAlt ? `<button type="button" id="aiAltAssignBtn" class="px-3.5 py-2 rounded-xl card accent-pill text-xs font-semibold">✨ ${t('aiReassignBtn')} ${escapeHtml(bestAlt.member.name)} (${bestAlt.stats.totalMin}м)</button>` : ''}
            <button type="button" id="aiForceAssignBtn" class="btn-accent px-4 py-2 rounded-xl text-xs font-semibold">${t('aiAssignAnyway')}</button>
          </div>
        </div>
      `);

      document.getElementById('aiCancelBtn').addEventListener('click', closeModal);
      document.getElementById('aiForceAssignBtn').addEventListener('click', () => { closeModal(); onConfirmAssign(memberId); });
      const altBtn = document.getElementById('aiAltAssignBtn');
      if (altBtn && bestAlt) {
        altBtn.addEventListener('click', () => { closeModal(); onConfirmAssign(bestAlt.member.id); });
      }

      // If Live Gemini API key is configured, fetch live expert advice on this exact task!
      if (state.geminiApiKey) {
        try {
          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(state.geminiApiKey.trim())}`;
          const prompt = `Ты — опытный продюсер игровой/креативной студии. Коротко (2-3 предложения на русском) оцени задачу "${taskTitle}" (${taskDesc || 'без описания'}, ${durationMin} мин) для участника "${member.name}" (уровень: ${lvObj.ru}, опыт: ${member.expText || 'не указан'}, роли: ${(member.roles||[]).join(', ')}). На ${dayTitle} у него уже ${stats.count} задач на ${stats.totalMin} мин. Дай чёткую рекомендацию: потянет ли он или лучше разгрузить/передать ${bestAlt ? bestAlt.member.name : 'другому'}.`;
          const resp = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
          });
          if (resp.ok) {
            const data = await resp.json();
            const txt = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
            const box = document.getElementById('aiLiveAdviceBox');
            if (box && txt) {
              box.innerHTML = `<div class="font-semibold" style="color: var(--accent-2);">🧠 Рекомендация Gemini AI:</div><div class="leading-relaxed">${escapeHtml(txt)}</div>`;
            }
          }
        } catch (e) {
          const box = document.getElementById('aiLiveAdviceBox');
          if (box) box.classList.add('hidden');
        }
      }
    }

    function openTaskModal(taskId, presetMilestoneId, presetDayId) {
      const folder = getActiveFolder();
      ensureFolderDays(folder);
      const existing = taskId ? folder.tasks.find(x => x.id === taskId) : null;
      const sortedMembers = [...folder.members].sort((a, b) => a.order - b.order);
      const activeMsId = existing ? existing.milestoneId : (presetMilestoneId || '');
      const fallbackDay = folder.activeDayId === 'all' ? folder.days[folder.days.length - 1].id : folder.activeDayId;
      const activeDayId = existing ? (existing.dayId || fallbackDay) : (presetDayId || fallbackDay);
      openModal(`
        <form id="taskForm" class="space-y-3.5">
          <h3 class="font-bold text-base">${existing ? t('taskModalTitleEdit') : t('taskModalTitleAdd')}</h3>
          <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('taskTitleLabel')} *</label><input id="tkTitle" required class="w-full" value="${escapeHtml(existing ? existing.title : '')}" /></div>
          <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('taskDescLabel')}</label><textarea id="tkDesc" rows="3" class="w-full">${escapeHtml(existing ? existing.description : '')}</textarea></div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('taskTypeLabel')}</label><select id="tkType" class="w-full"><option value="personal" ${(existing ? existing.type : 'personal') === 'personal' ? 'selected' : ''}>👤 ${t('typePersonal')}</option><option value="team" ${existing && existing.type === 'team' ? 'selected' : ''}>🤝 ${t('typeTeam')}</option><option value="rest" ${existing && existing.type === 'rest' ? 'selected' : ''}>☕ ${t('typeRest')}</option></select></div>
            <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('taskAssigneeLabel')}</label><select id="tkAssignee" class="w-full"><option value="">${t('unassigned')}</option>${sortedMembers.map(m => `<option value="${m.id}" ${existing && existing.assigneeId === m.id ? 'selected' : ''}>${escapeHtml(m.name)}</option>`).join('')}</select></div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('taskStatusLabel')}</label><select id="tkStatus" class="w-full"><option value="todo" ${(existing ? existing.status : 'todo') === 'todo' ? 'selected' : ''}>${t('statusTodo')}</option><option value="in_progress" ${existing && existing.status === 'in_progress' ? 'selected' : ''}>${t('statusProgress')}</option><option value="done" ${existing && existing.status === 'done' ? 'selected' : ''}>${t('statusDone')}</option></select></div>
            <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('taskDurationLabel')}</label><input id="tkDuration" type="number" min="1" max="1440" class="w-full" value="${existing ? existing.durationMin : 45}" /></div>
            <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('taskTimeSlotLabel')}</label><input id="tkSlot" class="w-full" value="${escapeHtml(existing ? existing.timeSlot : '')}" placeholder="10:00 - 11:00" /></div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('taskDayLabel')}</label><select id="tkDay" class="w-full">${folder.days.map(d => `<option value="${d.id}" ${activeDayId === d.id ? 'selected' : ''}>📅 ${escapeHtml(d.title)}</option>`).join('')}</select></div>
            <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('taskMilestoneLabel')}</label><select id="tkMilestone" class="w-full"><option value="">${t('noMilestone')}</option>${folder.milestones.map(ms => `<option value="${ms.id}" ${activeMsId === ms.id ? 'selected' : ''}>🚩 ${escapeHtml(ms.title)}</option>`).join('')}</select></div>
          </div>
          <div class="space-y-1.5 pt-1">
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input id="tkInToday" type="checkbox" ${(existing ? existing.isToday !== false : true) ? 'checked' : ''} /><span>${t('taskInTodayLabel')}</span></label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input id="tkOnRoadmap" type="checkbox" ${(existing ? existing.onRoadmap : true) ? 'checked' : ''} /><span>${t('taskShowRoadmapLabel')}</span></label>
          </div>
          <div class="flex justify-end gap-2 pt-3 border-t" style="border-color: var(--border-color);"><button type="button" id="cancelTaskBtn" class="px-4 py-2 rounded-lg card text-xs">${t('cancelBtn')}</button><button type="submit" class="btn-accent px-4 py-2 rounded-lg text-xs font-semibold">${t('saveBtn')}</button></div>
        </form>
      `);
      document.getElementById('cancelTaskBtn').addEventListener('click', closeModal);
      document.getElementById('taskForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const dur = Math.max(1, Number(document.getElementById('tkDuration').value) || 30);
        const type = document.getElementById('tkType').value;
        const newStatus = document.getElementById('tkStatus').value;
        const wasDone = existing && existing.status === 'done';
        const data = { id: existing ? existing.id : uid('t'), title: document.getElementById('tkTitle').value.trim(), description: document.getElementById('tkDesc').value.trim(), type, assigneeId: type === 'personal' ? document.getElementById('tkAssignee').value : '', status: newStatus, durationMin: dur, remainingSec: existing && existing.durationMin === dur ? existing.remainingSec : dur * 60, running: existing ? existing.running : false, timeSlot: document.getElementById('tkSlot').value.trim(), dayId: document.getElementById('tkDay').value, milestoneId: document.getElementById('tkMilestone').value, onRoadmap: document.getElementById('tkOnRoadmap').checked, isToday: document.getElementById('tkInToday').checked };
        const commitTask = (finalAssigneeId) => {
          data.assigneeId = data.type === 'personal' ? finalAssigneeId : '';
          if (existing) Object.assign(existing, data); else folder.tasks.push(data);
          saveState(); renderAll(); showToast(t('toastSaved'));
          if (!wasDone && newStatus === 'done') checkAllTasksVictory(folder);
        };
        closeModal();
        if (data.type === 'personal' && data.assigneeId && data.status !== 'done') {
          runWorkloadIntelligenceCheck(folder, data.assigneeId, data.dayId, data.title, data.description, data.durationMin, existing ? existing.id : null, commitTask);
        } else {
          commitTask(data.assigneeId);
        }
      });
    }

    /* =========================================================================
       12. TAB 3: DESIGNER THEMED ROADMAP
    ========================================================================= */
    function renderRoadmapTab(container, folder) {
      ensureFolderDays(folder);
      const theme = folder.theme;
      const isDir = state.roleMode === 'director';
      const rmMode = state.roadmapMode || 'milestones';
      const roadmapTasks = folder.tasks.filter(tk => tk.onRoadmap);
      const completedMs = folder.milestones.filter(m => m.completed).length;
      const totalMs = folder.milestones.length;
      const msPct = totalMs ? Math.round((completedMs / totalMs) * 100) : 0;
      const fallbackMsId = (folder.milestones.find(m => !m.completed) || folder.milestones[0] || {}).id || '';
      const spineClass = theme.spineStyle === 'hazard' ? 'spine-hazard' : theme.spineStyle === 'stone' ? 'spine-stone' : theme.spineStyle === 'circuit' ? 'spine-circuit' : '';

      const dayNodesHTML = folder.days.map((d, idx) => {
        const dTasks = folder.tasks.filter(tk => tk.dayId === d.id);
        const dDone = dTasks.filter(tk => tk.status === 'done').length;
        const dAllDone = dTasks.length > 0 && dDone === dTasks.length;
        const linkedMsIds = Array.from(new Set(dTasks.map(tk => tk.milestoneId).filter(Boolean)));
        const linkedMsNames = linkedMsIds.map(id => (folder.milestones.find(m => m.id === id) || {}).title).filter(Boolean);
        const topTasks = dTasks.filter((_, i) => i % 2 === 0);
        const bottomTasks = dTasks.filter((_, i) => i % 2 === 1);
        return `
          <div class="roadmap-node-col" style="min-width: ${Math.max(275, Math.max(topTasks.length, bottomTasks.length) * 174)}px;">
            ${topTasks.length ? `<div class="roadmap-branch-top">${topTasks.map(tk => renderBranchChip(tk, folder)).join('')}</div>` : ''}
            <div class="flex flex-col items-center">
              <div class="milestone-orb w-16 h-16 rounded-2xl flex flex-col items-center justify-center border-2 relative cursor-pointer" data-inspect-day="${d.id}"
                style="background: ${dAllDone ? 'linear-gradient(135deg, var(--accent), var(--accent-2))' : 'var(--bg-card)'}; border-color: var(--accent); box-shadow: 0 0 24px var(--glow);">
                <span class="text-[10px] uppercase opacity-80">${t('dayLabel')}</span>
                <span class="text-xl font-black leading-none">${d.num || idx + 1}</span>
                <span class="absolute -top-2.5 -right-2.5 px-1.5 h-5 rounded-full text-[10px] font-bold flex items-center justify-center bg-black border" style="border-color: var(--accent);">${dDone}/${dTasks.length}</span>
              </div>
              <div class="mt-2.5 text-center max-w-[225px] card px-3 py-1.5 rounded-xl cursor-pointer" data-inspect-day="${d.id}">
                <div class="text-xs font-bold leading-tight display-font">📅 ${escapeHtml(d.title)}</div>
                ${linkedMsNames.length ? `<div class="text-[10px] mt-0.5 truncate" style="color: var(--accent-2);">🚩 ${escapeHtml(linkedMsNames.join(', '))}</div>` : ''}
                <button type="button" data-quick-day-task="${d.id}" class="mt-1 text-[10px] px-2 py-0.5 rounded-md accent-pill">${t('addTaskToDay')}</button>
              </div>
            </div>
            ${bottomTasks.length ? `<div class="roadmap-branch-bottom">${bottomTasks.map(tk => renderBranchChip(tk, folder)).join('')}</div>` : ''}
          </div>
        `;
      }).join('');

      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div><h2 class="font-bold text-base sm:text-lg display-font">${t('roadmapTitle')}</h2><p class="text-xs" style="color: var(--text-muted);">${t('clickHint')}</p></div>
            <div class="flex flex-wrap items-center gap-2">
              <div class="flex items-center gap-1 panel p-1 rounded-xl">
                <button id="rmModeMsBtn" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${rmMode === 'milestones' ? 'accent-pill' : ''}">${t('roadmapByMilestones')}</button>
                <button id="rmModeDaysBtn" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${rmMode === 'days' ? 'accent-pill' : ''}">${t('roadmapByDays')}</button>
              </div>
              <div class="flex items-center gap-2 panel px-3 py-1.5 rounded-xl text-xs"><span style="color: var(--text-muted);">${t('zoomLabel')}:</span><input id="roadmapZoomRange" type="range" min="0.75" max="1.35" step="0.05" value="${state.roadmapZoom}" class="w-24 p-0 border-0" /><span class="font-mono w-10">${Math.round(state.roadmapZoom * 100)}%</span></div>
              ${sessionAccessMode === 'director' ? `<button id="addTaskFromMapBtn" class="px-3.5 py-2 rounded-xl card text-xs font-semibold flex items-center gap-1.5"><i data-lucide="plus-circle" class="w-4 h-4" style="color: var(--accent);"></i><span>${t('addTaskOnMap')}</span></button>
              <button id="addMilestoneBtn" class="btn-accent px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold flex items-center gap-1.5"><i data-lucide="flag" class="w-4 h-4"></i><span>${t('addMilestone')}</span></button>` : ''}
            </div>
          </div>

          <div class="panel rounded-2xl p-3.5 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3 flex-1 min-w-[220px]">
              <span class="text-xs font-semibold whitespace-nowrap">🚩 ${completedMs} / ${totalMs} (${msPct}%)</span>
              <div class="flex-1 h-2.5 rounded-full bg-white/10 overflow-hidden"><div class="h-full rounded-full transition-all duration-300" style="width:${msPct}%; background: linear-gradient(90deg, var(--accent), var(--accent-2));"></div></div>
            </div>
            <span class="text-xs" style="color: var(--text-muted);">🗺️ ${roadmapTasks.length} ${t('tasksShort')}</span>
          </div>

          <div class="panel rounded-2xl roadmap-viewport relative overflow-hidden">
            <div class="absolute inset-0 opacity-20 pointer-events-none">${composeScenicSVG(theme)}</div>
            <div class="roadmap-track relative z-10" style="transform: scale(${state.roadmapZoom});">
              <div class="roadmap-spine ${spineClass}"></div>
              <div class="roadmap-node-col" style="min-width: 145px;">
                <div class="milestone-orb w-14 h-14 rounded-2xl flex items-center justify-center border-2 shadow-xl" style="background: var(--bg-card); border-color: var(--accent); box-shadow: 0 0 24px var(--glow);">${getThemeFlagSVG(theme.flagIcon, theme.palette.accent, 26)}</div>
                <div class="mt-2 text-xs font-black tracking-widest uppercase display-font">${t('startFlag')}</div>
              </div>

              ${rmMode === 'days' ? dayNodesHTML : folder.milestones.map((ms, idx) => {
                const linkedTasks = roadmapTasks.filter(tk => (tk.milestoneId || fallbackMsId) === ms.id);
                const doneLinked = linkedTasks.filter(tk => tk.status === 'done').length;
                const topTasks = linkedTasks.filter((_, i) => i % 2 === 0);
                const bottomTasks = linkedTasks.filter((_, i) => i % 2 === 1);
                return `
                  <div class="roadmap-node-col" style="min-width: ${Math.max(270, Math.max(topTasks.length, bottomTasks.length) * 174)}px;">
                    ${topTasks.length ? `<div class="roadmap-branch-top">${topTasks.map(tk => renderBranchChip(tk, folder)).join('')}</div>` : ''}
                    <div class="flex flex-col items-center">
                      <div class="milestone-orb w-16 h-16 rounded-2xl flex items-center justify-center border-2 relative cursor-pointer" data-inspect-milestone="${ms.id}"
                        style="background: ${ms.completed ? 'linear-gradient(135deg, var(--accent), var(--accent-2))' : 'var(--bg-card)'}; border-color: var(--accent); box-shadow: 0 0 24px var(--glow);">
                        ${getThemeFlagSVG(theme.flagIcon, ms.completed ? '#ffffff' : theme.palette.accent, 28)}
                        <span class="absolute -top-2.5 -right-2.5 w-6 h-6 rounded-full text-[11px] font-bold flex items-center justify-center bg-black border" style="border-color: var(--accent);">${ms.completed ? '✓' : idx + 1}</span>
                      </div>
                      <div class="mt-2.5 text-center max-w-[210px] card px-3 py-1.5 rounded-xl">
                        <div class="text-xs font-bold leading-tight cursor-pointer hover:underline display-font" data-inspect-milestone="${ms.id}">${escapeHtml(ms.title)}</div>
                        <div class="text-[10px] font-mono mt-0.5 flex items-center justify-center gap-2" style="color: var(--text-muted);">
                          ${ms.targetDate ? `<span>${escapeHtml(ms.targetDate)}</span>` : ''}
                          <span>✅ ${doneLinked}/${linkedTasks.length}</span>
                        </div>
                        <button type="button" data-quick-ms-task="${ms.id}" class="mt-1 text-[10px] px-2 py-0.5 rounded-md accent-pill">${t('addTaskToStage')}</button>
                      </div>
                    </div>
                    ${bottomTasks.length ? `<div class="roadmap-branch-bottom">${bottomTasks.map(tk => renderBranchChip(tk, folder)).join('')}</div>` : ''}
                  </div>
                `;
              }).join('')}

              <div class="roadmap-node-col" style="min-width: 145px;">
                <div class="milestone-orb w-14 h-14 rounded-2xl flex items-center justify-center border-2 shadow-xl" style="background: var(--bg-card); border-color: var(--accent-2); box-shadow: 0 0 22px var(--glow);"><i data-lucide="trophy" class="w-7 h-7" style="color: var(--accent-2);"></i></div>
                <div class="mt-2 text-xs font-black tracking-widest uppercase display-font">${t('finishFlag')}</div>
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById('rmModeMsBtn').addEventListener('click', () => { state.roadmapMode = 'milestones'; saveState(); renderRoadmapTab(container, folder); if (window.lucide) lucide.createIcons(); });
      document.getElementById('rmModeDaysBtn').addEventListener('click', () => { state.roadmapMode = 'days'; saveState(); renderRoadmapTab(container, folder); if (window.lucide) lucide.createIcons(); });
      container.querySelectorAll('[data-quick-day-task]').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); openTaskModal(null, null, btn.dataset.quickDayTask); }));
      container.querySelectorAll('[data-inspect-day]').forEach(node => node.addEventListener('click', () => openDayInspectModal(node.dataset.inspectDay)));
      document.getElementById('roadmapZoomRange').addEventListener('input', (e) => { state.roadmapZoom = Number(e.target.value); renderRoadmapTab(container, folder); if (window.lucide) lucide.createIcons(); });
      const amsBtn = document.getElementById('addMilestoneBtn'); if (amsBtn) amsBtn.addEventListener('click', () => openMilestoneModal(null));
      const atmBtn = document.getElementById('addTaskFromMapBtn'); if (atmBtn) atmBtn.addEventListener('click', () => openTaskModal(null, fallbackMsId));
      container.querySelectorAll('[data-quick-ms-task]').forEach(btn => { if (sessionAccessMode !== 'director') btn.classList.add('hidden'); else btn.addEventListener('click', () => openTaskModal(null, btn.dataset.quickMsTask)); });
      container.querySelectorAll('[data-quick-day-task]').forEach(btn => { if (sessionAccessMode !== 'director') btn.classList.add('hidden'); });
      container.querySelectorAll('[data-inspect-task]').forEach(chip => chip.addEventListener('click', () => openTaskZoomModal(chip.dataset.inspectTask)));
      container.querySelectorAll('[data-inspect-milestone]').forEach(node => node.addEventListener('click', () => openMilestoneInspectModal(node.dataset.inspectMilestone, isDir)));
    }

    function renderBranchChip(tk, folder) {
      const mem = folder.members.find(m => m.id === tk.assigneeId);
      const dot = tk.status === 'done' ? '#10b981' : tk.status === 'in_progress' ? '#f59e0b' : '#94a3b8';
      return `<button type="button" class="branch-chip" data-inspect-task="${tk.id}"><div class="flex items-center gap-1 mb-0.5"><span class="w-2 h-2 rounded-full shrink-0" style="background:${dot}"></span><span class="font-semibold truncate">${escapeHtml(tk.title)}</span></div><div class="text-[10px] truncate" style="color: var(--text-muted);">${tk.type === 'team' ? `🤝 ${t('typeTeam')}` : (mem ? mem.name : t('unassigned'))}</div></button>`;
    }

    function openTaskZoomModal(taskId) {
      const folder = getActiveFolder();
      const tk = folder.tasks.find(x => x.id === taskId); if (!tk) return;
      const mem = folder.members.find(m => m.id === tk.assigneeId);
      const ms = folder.milestones.find(m => m.id === tk.milestoneId);
      openModal(`
        <div class="space-y-4">
          <div class="flex items-start justify-between gap-3">
            <div><span class="text-[11px] uppercase tracking-wider px-2 py-0.5 rounded accent-pill">${tk.type === 'team' ? t('typeTeam') : tk.type === 'rest' ? t('typeRest') : t('typePersonal')}</span><h3 class="font-bold text-lg mt-2">${escapeHtml(tk.title)}</h3></div>
            <button id="zoomEditTaskBtn" class="px-3 py-1.5 rounded-lg card text-xs flex items-center gap-1"><i data-lucide="pencil" class="w-3.5 h-3.5"></i> ${t('edit')}</button>
          </div>
          <p class="text-sm leading-relaxed p-3 rounded-xl bg-black/25">${escapeHtml(tk.description || '—')}</p>
          <div class="grid grid-cols-2 gap-2.5 text-xs">
            <div class="card p-2.5 rounded-xl"><div style="color: var(--text-muted);">${t('taskAssigneeLabel')}</div><div class="font-semibold mt-0.5">${mem ? escapeHtml(mem.name) : (tk.type === 'team' ? t('typeTeam') : t('unassigned'))}</div></div>
            <div class="card p-2.5 rounded-xl"><div style="color: var(--text-muted);">${t('taskMilestoneLabel')}</div><div class="font-semibold mt-0.5">${ms ? '🚩 ' + escapeHtml(ms.title) : '—'}</div></div>
          </div>
          <div class="flex items-center justify-between gap-2 pt-2 border-t" style="border-color: var(--border-color);">
            <button id="zoomToggleDoneBtn" class="btn-accent px-4 py-2 rounded-xl text-xs font-semibold">${tk.status === 'done' ? '↩ ' + t('statusProgress') : '✓ ' + t('statusDone')}</button>
            <button id="zoomCloseBtn" class="px-4 py-2 rounded-xl card text-xs">${t('closeBtn')}</button>
          </div>
        </div>
      `);
      document.getElementById('zoomCloseBtn').addEventListener('click', closeModal);
      document.getElementById('zoomEditTaskBtn').addEventListener('click', () => openTaskModal(tk.id, null));
      document.getElementById('zoomToggleDoneBtn').addEventListener('click', () => {
        const prev = tk.status;
        tk.status = tk.status === 'done' ? 'in_progress' : 'done';
        if (tk.status === 'done') tk.running = false;
        saveState(); closeModal(); renderAll();
        if (prev !== 'done' && tk.status === 'done') checkAllTasksVictory(folder);
      });
    }

    function openDayInspectModal(dayId) {
      const folder = getActiveFolder();
      const d = folder.days.find(x => x.id === dayId);
      if (!d) return;
      const dTasks = folder.tasks.filter(tk => tk.dayId === d.id);
      const dDone = dTasks.filter(tk => tk.status === 'done').length;
      const pct = dTasks.length ? Math.round((dDone / dTasks.length) * 100) : 0;
      const msIds = Array.from(new Set(dTasks.map(tk => tk.milestoneId).filter(Boolean)));
      const msList = msIds.map(id => folder.milestones.find(m => m.id === id)).filter(Boolean);

      openModal(`
        <div class="space-y-4">
          <div class="flex items-start justify-between gap-3">
            <div>
              <span class="text-[11px] px-2 py-0.5 rounded accent-pill">${t('dayExpandTitle')} · ${dDone}/${dTasks.length} (${pct}%)</span>
              <h3 class="font-bold text-lg mt-2 display-font">📅 ${escapeHtml(d.title)}</h3>
              ${d.date ? `<div class="text-xs font-mono opacity-70">${escapeHtml(d.date)}</div>` : ''}
            </div>
            <button id="addTaskInsideDayBtn" class="btn-accent px-3 py-1.5 rounded-lg text-xs font-semibold">${t('addTaskToDay')}</button>
          </div>
          <div class="h-2 rounded-full bg-white/10 overflow-hidden"><div class="h-full rounded-full" style="width:${pct}%; background: linear-gradient(90deg, var(--accent), var(--accent-2));"></div></div>
          <div class="space-y-1.5">
            <div class="text-xs font-semibold" style="color: var(--text-muted);">${t('dayMilestonesLabel')}</div>
            ${msList.length === 0 ? `<div class="text-xs opacity-60">—</div>` : `<div class="flex flex-wrap gap-1.5">${msList.map(m => `<span class="text-xs px-2.5 py-1 rounded-lg accent-pill">🚩 ${escapeHtml(m.title)}</span>`).join('')}</div>`}
          </div>
          <div class="space-y-1.5 max-h-56 overflow-y-auto">
            ${dTasks.length === 0 ? `<div class="text-xs opacity-60">${t('noTasksYet')}</div>` : dTasks.map(tk => {
              const mem = folder.members.find(m => m.id === tk.assigneeId);
              return `<div class="card px-3 py-2 rounded-xl text-xs flex items-center justify-between gap-2">
                <div class="min-w-0">
                  <div class="font-semibold truncate ${tk.status === 'done' ? 'line-through opacity-70' : ''}">${tk.status === 'done' ? '✅' : tk.status === 'in_progress' ? '⏳' : '⬜'} ${escapeHtml(tk.title)}</div>
                  <div class="text-[10px] opacity-70">${tk.type === 'team' ? t('typeTeam') : tk.type === 'rest' ? t('typeRest') : (mem ? mem.name : t('unassigned'))}${tk.timeSlot ? ' · 🕒 ' + escapeHtml(tk.timeSlot) : ''}</div>
                </div>
                <span class="font-mono text-[10px] shrink-0">${formatTimer(tk.remainingSec)}</span>
              </div>`;
            }).join('')}
          </div>
          <div class="flex items-center justify-between pt-2 border-t" style="border-color: var(--border-color);">
            <button id="jumpToDayTasksBtn" class="px-3.5 py-2 rounded-xl card text-xs font-semibold">📋 Открыть в «Задачи и День»</button>
            <button id="closeDayInspectBtn" class="px-4 py-2 rounded-xl card text-xs">${t('closeBtn')}</button>
          </div>
        </div>
      `);
      document.getElementById('closeDayInspectBtn').addEventListener('click', closeModal);
      document.getElementById('addTaskInsideDayBtn').addEventListener('click', () => openTaskModal(null, null, d.id));
      document.getElementById('jumpToDayTasksBtn').addEventListener('click', () => {
        folder.activeDayId = d.id; state.activeTab = 'tasks'; saveState(); closeModal(); renderAll();
      });
    }

    function openMilestoneInspectModal(msId, isDir) {
      const folder = getActiveFolder();
      const ms = folder.milestones.find(x => x.id === msId); if (!ms) return;
      const linked = folder.tasks.filter(tk => tk.milestoneId === ms.id);
      openModal(`
        <div class="space-y-4">
          <div class="flex items-start justify-between gap-3">
            <div><span class="text-[11px] px-2 py-0.5 rounded ${ms.completed ? 'bg-emerald-500/20 text-emerald-300' : 'accent-pill'}">${ms.completed ? '✅ ' + t('milestoneDoneLabel') : '🚩 В работе'}</span><h3 class="font-bold text-lg mt-2">${escapeHtml(ms.title)}</h3>${ms.targetDate ? `<div class="text-xs font-mono mt-0.5" style="color: var(--text-muted);">${escapeHtml(ms.targetDate)}</div>` : ''}</div>
            <div class="flex gap-1.5"><button id="addMsTaskInsideBtn" class="px-2.5 py-1.5 rounded-lg card text-xs font-semibold">${t('addTaskToStage')}</button><button id="editMsBtn" class="p-2 rounded-lg card"><i data-lucide="pencil" class="w-4 h-4"></i></button>${isDir ? `<button id="delMsBtn" class="p-2 rounded-lg card text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}</div>
          </div>

      });
      document.getElementById('saveAiKeyBtn').addEventListener('click', () => {

        saveState(); showToast(t('toastSaved'));
      });
      document.getElementById('copySnapLinkBtn').addEventListener('click', () => {
        try {
          const clone = JSON.parse(JSON.stringify(state));
          clone.geminiApiKey = ''; // never leak API key in shared snapshot links!
          clone.folders.forEach(f => f.members.forEach(m => { if (m.photo && m.photo.length > 2000) m.photo = ''; }));
          const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(clone))));
          if (encoded.length > 12000) { showToast(t('toastLinkTooLarge')); return; }
          const url = window.location.href.split('#')[0] + '#snap=' + encoded;
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(() => showToast(t('toastLinkCopied'))).catch(() => fallbackCopy(url));
          else fallbackCopy(url);
        } catch (e) { showToast(t('toastLinkTooLarge')); }
      });
      document.getElementById('exportJsonBtn').addEventListener('click', () => {

        clone.geminiApiKey = '';

        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `studio-command-hub-backup-${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(a.href);

      const savePinBtn = document.getElementById('savePinBtn');
      if (savePinBtn) savePinBtn.addEventListener('click', () => { state.directorPin = document.getElementById('pinSetInput').value.trim(); saveState(); showToast(t('toastSaved')); });

    function buildFolderShareUrl(folderId, mode) {
      const f = state.folders.find(x => x.id === folderId) || getActiveFolder();
      if (!f) return null;
      const clone = JSON.parse(JSON.stringify(f));
      clone.members.forEach(m => { if (m.photo && m.photo.length > 2000) m.photo = ''; });
      const payload = { lang: state.lang, folder: clone };
      const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
      if (encoded.length > 16000) return null;
      return window.location.href.split('#')[0] + '#' + mode + '=' + encoded;
    }

          <div class="card rounded-xl p-3.5 space-y-2">
            <div class="font-bold text-xs flex items-center gap-1.5">👁 ${t('viewLinkTitle')}</div>
            <p class="text-[11px]" style="color: var(--text-muted);">${t('viewLinkDesc')}</p>
            <button id="copyFolderViewBtn" class="btn-accent w-full py-2 rounded-lg text-xs font-semibold">${isWorker ? t('copyBackReportBtn') : t('copyViewLinkBtn')}</button>
          </div>

          ${isWorker ? '' : `
          <div class="card rounded-xl p-3.5 space-y-2">
            <div class="font-bold text-xs flex items-center gap-1.5">🛠 ${t('workLinkTitle')}</div>
            <p class="text-[11px]" style="color: var(--text-muted);">${t('workLinkDesc')}</p>
            <button id="copyFolderWorkBtn" class="card w-full py-2 rounded-lg text-xs font-semibold accent-pill">${t('copyWorkLinkBtn')}</button>
          </div>`}

          <div class="flex justify-end"><button id="closeFolderShareBtn" class="px-4 py-1.5 rounded-lg card text-xs">${t('closeBtn')}</button></div>
        </div>
      `);
      document.getElementById('closeFolderShareBtn').addEventListener('click', closeModal);
      document.getElementById('copyFolderViewBtn').addEventListener('click', () => {
        const url = buildFolderShareUrl(f.id, 'view');
        if (!url) { showToast(t('toastLinkTooLarge')); return; }
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(() => showToast(t('viewLinkCopied'))).catch(() => fallbackCopy(url));
        else fallbackCopy(url);
      });
      const wBtn = document.getElementById('copyFolderWorkBtn');
      if (wBtn) {
        wBtn.addEventListener('click', () => {
          const url = buildFolderShareUrl(f.id, 'work');
          if (!url) { showToast(t('toastLinkTooLarge')); return; }
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(() => showToast(t('workLinkCopied'))).catch(() => fallbackCopy(url));
          else fallbackCopy(url);
        });
      }
    }

    function openGuideModal() {
      openModal(`
        <div class="space-y-3 text-xs leading-relaxed">
          <h3 class="font-bold text-base">${t('guideTitle')}</h3>
          <div class="card p-3 rounded-xl space-y-1"><div class="font-bold">1. Безграничный ИИ-дизайн папок</div><p style="color: var(--text-muted);">Нажмите «+» и напишите любую тему своими словами — без шаблонных ограничений. Встроенный ИИ-синтезатор сразу соберёт панораму, стиль дорожной карты, флаги и частицы. А если вставить свой бесплатный ключ в «Сейв / ИИ-ключ», живой Gemini AI сам нарисует уникальную SVG-иллюстрацию и награды.</p></div>
          <div class="card p-3 rounded-xl space-y-1"><div class="font-bold">2. Команда, Задачи дня и Таймеры</div><p style="color: var(--text-muted);">Добавляйте сколько угодно участников с фото, мультиролями, уровнем и телефоном. Во вкладке «Задачи и День» перетаскивайте карточки прямо на имена людей, запускайте таймеры и вставляйте перерывы «+ Отдых 30 мин».</p></div>
          <div class="card p-3 rounded-xl space-y-1"><div class="font-bold">3. Дизайнерская Дорожная карта и Награды</div><p style="color: var(--text-muted);">Карта автоматически меняет стиль линии и флагов под тему папки. Клик по ветке увеличивает задачу, а завершение вехи или всех задач запускает салют, фанфары и открывает трофей в «Пульте и Наградах».</p></div>
          <div class="flex justify-end pt-1"><button id="closeGuideBtn" class="btn-accent px-4 py-1.5 rounded-lg text-xs font-semibold">${t('closeBtn')}</button></div>
        </div>
      `);
      document.getElementById('closeGuideBtn').addEventListener('click', closeModal);
    }

    function fallbackCopy(text) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); showToast(t('toastLinkCopied')); } catch (e) {} ta.remove(); }
    function toggleRoleMode() {
      if (state.roleMode === 'director') { state.roleMode = 'member'; saveState(); renderAll(); return; }
      if (!state.directorPin) { state.roleMode = 'director'; saveState(); renderAll(); return; }
      openModal(`<form id="pinUnlockForm" class="space-y-3.5"><h3 class="font-bold text-base">${t('enterPinPrompt')}</h3><input id="pinUnlockInput" type="password" required class="w-full" placeholder="****" /><div class="flex justify-end gap-2"><button type="button" id="cancelPinBtn" class="px-4 py-2 rounded-lg card text-xs">${t('cancelBtn')}</button><button type="submit" class="btn-accent px-4 py-2 rounded-lg text-xs font-semibold">${t('switchToDirector')}</button></div></form>`);
      document.getElementById('cancelPinBtn').addEventListener('click', closeModal);
      document.getElementById('pinUnlockForm').addEventListener('submit', (e) => {
        e.preventDefault();
        if (document.getElementById('pinUnlockInput').value.trim() === state.directorPin) { state.roleMode = 'director'; saveState(); closeModal(); renderAll(); }
        else showToast(t('wrongPin'));
      });
    }

    /* =========================================================================
       15. BOOTSTRAP
    ========================================================================= */
    async function initApp() {
      await loadStateAsync();
      document.getElementById('backToHomeBtn').addEventListener('click', () => { state.view = 'home'; saveState(); renderAll(); });
      document.getElementById('shareFolderHeaderBtn').addEventListener('click', () => openFolderShareModal(state.activeFolderId));
      document.getElementById('toggleAmbientBtn').addEventListener('click', () => {
        ambientEnabled = !ambientEnabled;
        if (ambientEnabled) { state.muted = false; startAmbientSound(getCurrentSoundProfile()); }
        else { stopAmbientSound(); }
        renderAll();
      });
      document.getElementById('openThemeModalBtn').addEventListener('click', openThemeModal);
      document.getElementById('openShareModalBtn').addEventListener('click', openShareModal);
      document.getElementById('openGuideBtn').addEventListener('click', openGuideModal);
      document.getElementById('toggleRoleLockBtn').addEventListener('click', toggleRoleMode);
      document.getElementById('toggleMuteBtn').addEventListener('click', () => {
        state.muted = !state.muted;
        if (state.muted) stopAmbientSound();
        else if (ambientEnabled) startAmbientSound(getCurrentSoundProfile());
        saveState(); renderAll();
      });
      document.getElementById('toggleLangBtn').addEventListener('click', () => { state.lang = state.lang === 'ru' ? 'en' : 'ru'; saveState(); renderAll(); });
      document.getElementById('fxLevelSelect').addEventListener('change', (e) => { state.fxLevel = e.target.value; saveState(); renderAll(); });
      document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => { state.activeTab = btn.dataset.tab; saveState(); renderAll(); }));

      // Interactive click micro-FX & sound on buttons
      document.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (btn) {
          triggerMicroBurst(e.clientX, e.clientY);
          playClickPop();
        }
      });

      window.addEventListener('mousemove', (e) => {
        const glow = document.getElementById('cursorGlow');
        if (glow && state && state.fxLevel !== 'off') { glow.style.left = e.clientX + 'px'; glow.style.top = e.clientY + 'px'; }
      });
      window.addEventListener('resize', () => {
        const folder = state.view === 'folder' ? getActiveFolder() : null;
        initParticles((folder ? folder.theme : HUB_NEUTRAL_THEME).particleType, state.fxLevel);
      });

      renderAll();
      startGlobalTimer();
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
