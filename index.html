<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio Command Hub — Папки проектов, команда, задачи и дорожная карта</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg-main: #0c0e14;
      --bg-panel: #131620;
      --bg-card: #1a1e2b;
      --bg-card-hover: #222838;
      --border-color: #2b3347;
      --accent: #6366f1;
      --accent-soft: rgba(99, 102, 241, 0.16);
      --accent-2: #06b6d4;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --glow: rgba(99, 102, 241, 0.35);
      --font-display: 'Inter', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      overflow-x: hidden;
      min-height: 100vh;
    }

    h1, h2, h3, .display-font {
      font-family: var(--font-display);
    }

    /* Full-screen Scenic Backdrop + Canvas FX + Atmospheric Filters */
    #scenicBackdrop {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      opacity: 0.45;
      transition: opacity 0.4s ease;
    }

    #fxCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.72;
      transition: opacity 0.3s ease;
    }

    #cursorGlow {
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 999px;
      pointer-events: none;
      z-index: 1;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, var(--accent-soft) 0%, transparent 68%);
      opacity: 0.55;
      transition: opacity 0.3s ease;
    }

    .fx-overlay-vhs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background:
        repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 1px, transparent 1px, transparent 3px),
        radial-gradient(circle at center, transparent 52%, rgba(0,0,0,0.68) 100%);
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    .fx-overlay-vhs.active { opacity: 0.8; }

    .fx-overlay-grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background:
        radial-gradient(circle at 18% 15%, var(--accent-soft), transparent 46%),
        radial-gradient(circle at 82% 85%, rgba(255,255,255,0.03), transparent 48%),
        radial-gradient(circle at center, transparent 48%, rgba(0,0,0,0.68) 100%);
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    .fx-overlay-grain.active { opacity: 0.95; }

    .fx-overlay-grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 36px 36px;
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    .fx-overlay-grid.active { opacity: 1; }

    .app-shell {
      position: relative;
      z-index: 5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .panel {
      background-color: color-mix(in srgb, var(--bg-panel) 90%, transparent);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
    }

    .card {
      background-color: color-mix(in srgb, var(--bg-card) 92%, transparent);
      border: 1px solid var(--border-color);
      transition: border-color 0.2s ease, transform 0.15s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      background-color: var(--bg-card-hover);
      border-color: color-mix(in srgb, var(--accent) 55%, var(--border-color));
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
    }

    .btn-accent {
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent-2) 45%, var(--accent)));
      color: #ffffff;
      box-shadow: 0 0 20px var(--glow);
      transition: filter 0.15s ease, transform 0.1s ease;
    }
    .btn-accent:hover { filter: brightness(1.12); }
    .btn-accent:active { transform: scale(0.98); }

    .tab-btn {
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      transition: color 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
    }
    .tab-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }
    .tab-btn.active {
      color: var(--text-main);
      border-bottom-color: var(--accent);
      background: var(--accent-soft);
    }

    .accent-pill {
      background: var(--accent-soft);
      color: var(--text-main);
      border: 1px solid color-mix(in srgb, var(--accent) 65%, transparent);
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.35); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148,163,184,0.55); }

    /* Roadmap */
    .roadmap-viewport {
      overflow-x: auto;
      overflow-y: visible;
      padding: 24px 16px 32px;
      position: relative;
    }
    .roadmap-track {
      display: inline-flex;
      align-items: center;
      position: relative;
      min-width: 100%;
      padding: 158px 32px;
      transform-origin: left center;
      transition: transform 0.2s ease;
    }
    .roadmap-spine {
      position: absolute;
      left: 32px;
      right: 32px;
      top: 50%;
      height: 5px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent));
      box-shadow: 0 0 18px var(--glow);
      transform: translateY(-50%);
      border-radius: 999px;
      z-index: 1;
    }
    .roadmap-node-col {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 260px;
      flex-shrink: 0;
    }
    .roadmap-branch-top,
    .roadmap-branch-bottom {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 3;
    }
    .roadmap-branch-top { bottom: calc(50% + 44px); align-items: flex-end; }
    .roadmap-branch-bottom { top: calc(50% + 54px); align-items: flex-start; }

    .branch-chip {
      position: relative;
      max-width: 162px;
      font-size: 11px;
      line-height: 1.25;
      padding: 6px 8px;
      border-radius: 9px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
      text-align: left;
    }
    .branch-chip:hover {
      transform: scale(1.09);
      border-color: var(--accent);
      box-shadow: 0 8px 22px rgba(0,0,0,0.5), 0 0 14px var(--glow);
      z-index: 10;
    }
    .branch-chip::after {
      content: '';
      position: absolute;
      left: 50%;
      width: 2px;
      height: 24px;
      background: color-mix(in srgb, var(--accent) 70%, var(--border-color));
      transform: translateX(-50%);
    }
    .roadmap-branch-top .branch-chip::after { top: 100%; }
    .roadmap-branch-bottom .branch-chip::after { bottom: 100%; }

    .drop-target-active {
      outline: 2px dashed var(--accent);
      background: var(--accent-soft) !important;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.76);
      backdrop-filter: blur(6px);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 60;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      background: var(--bg-card);
      border: 1px solid var(--accent);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      animation: fadeSlideUp 0.2s ease;
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    input, select, textarea {
      background-color: rgba(0, 0, 0, 0.34);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }
    select option {
      background-color: #131620;
      color: #f1f5f9;
    }
  </style>
</head>
<body>
  <div id="scenicBackdrop"></div>
  <div id="cursorGlow"></div>
  <canvas id="fxCanvas"></canvas>
  <div id="fxVhsOverlay" class="fx-overlay-vhs"></div>
  <div id="fxGrainOverlay" class="fx-overlay-grain"></div>
  <div id="fxGridOverlay" class="fx-overlay-grid"></div>

  <div class="app-shell">

    <header class="panel sticky top-0 z-30 border-t-0 border-x-0 px-3 sm:px-5 py-2.5 flex flex-wrap items-center justify-between gap-2">

        <button id="backToHomeBtn" class="hidden px-2.5 py-1.5 rounded-lg card text-xs font-semibold flex items-center gap-1.5 shrink-0">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>

        </div>

            <span id="saveStatusBadge" class="hidden sm:inline-flex items-center gap-1 text-[11px] px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
              <span id="saveStatusText">Сохранено</span>
            </span>
          </div>
          <p id="headerSubtitle" class="text-xs truncate" style="color: var(--text-muted);"></p>
        </div>
      </div>

      <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap">
        <button id="openThemeModalBtn" class="hidden px-2.5 py-1.5 rounded-lg text-xs font-medium card flex items-center gap-1.5">
          <i data-lucide="palette" class="w-3.5 h-3.5" style="color: var(--accent);"></i>
          <span class="hidden sm:inline" data-i18n="themeBtn">Тема и FX</span>
        </button>

        <select id="fxLevelSelect" class="py-1.5 px-2 text-xs hidden sm:inline-block" title="Уровень спецэффектов">
          <option value="high">FX: Макс</option>
          <option value="low">FX: Средн</option>
          <option value="off">FX: Выкл</option>
        </select>

        <button id="toggleRoleLockBtn" class="px-2.5 py-1.5 rounded-lg text-xs font-medium card flex items-center gap-1.5">
          <i id="roleLockIcon" data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-400"></i>
          <span id="roleLockText" class="hidden md:inline">Главный</span>
        </button>

        <button id="openShareModalBtn" class="px-2.5 py-1.5 rounded-lg text-xs font-medium card flex items-center gap-1.5">
          <i data-lucide="hard-drive" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline" data-i18n="shareBtn">Сейв / Доступ</span>
        </button>

        <button id="openGuideBtn" class="p-1.5 rounded-lg card" title="Инструкция по сайту">
          <i data-lucide="help-circle" class="w-4 h-4"></i>
        </button>

        <button id="toggleMuteBtn" class="p-1.5 rounded-lg card" title="Звук таймера">
          <i id="muteIcon" data-lucide="volume-2" class="w-4 h-4"></i>
        </button>

        <button id="toggleLangBtn" class="px-2.5 py-1.5 rounded-lg text-xs font-bold accent-pill">RU</button>
      </div>
    </header>

    <!-- Folder Navigation Tabs -->
    <nav id="folderNavBar" class="hidden panel border-t-0 border-x-0 px-3 sm:px-6 flex items-center gap-1 overflow-x-auto">
      <button class="tab-btn px-3 sm:px-4 py-3 text-xs sm:text-sm font-medium flex items-center gap-2 whitespace-nowrap" data-tab="team">
        <i data-lucide="users" class="w-4 h-4"></i>
        <span data-i18n="tabTeam">Команда</span>
        <span id="badgeTeamCount" class="text-[11px] px-1.5 py-0.5 rounded-md bg-white/10">0</span>
      </button>
      <button class="tab-btn px-3 sm:px-4 py-3 text-xs sm:text-sm font-medium flex items-center gap-2 whitespace-nowrap" data-tab="tasks">
        <i data-lucide="list-checks" class="w-4 h-4"></i>
        <span data-i18n="tabTasks">Задачи и День</span>
        <span id="badgeTaskCount" class="text-[11px] px-1.5 py-0.5 rounded-md bg-white/10">0</span>
      </button>
      <button class="tab-btn px-3 sm:px-4 py-3 text-xs sm:text-sm font-medium flex items-center gap-2 whitespace-nowrap" data-tab="roadmap">
        <i data-lucide="map" class="w-4 h-4"></i>
        <span data-i18n="tabRoadmap">Дорожная карта</span>
        <span id="badgeMilestoneCount" class="text-[11px] px-1.5 py-0.5 rounded-md bg-white/10">0</span>
      </button>
      <button class="tab-btn px-3 sm:px-4 py-3 text-xs sm:text-sm font-medium flex items-center gap-2 whitespace-nowrap" data-tab="director">
        <i data-lucide="gauge" class="w-4 h-4"></i>
        <span data-i18n="tabDirector">Пульт главного</span>
      </button>
    </nav>

    <main id="mainContent" class="flex-1 p-3 sm:p-6 max-w-[1550px] w-full mx-auto"></main>
  </div>

  <div id="modalRoot" class="hidden"></div>
  <div id="toastRoot" class="toast-container"></div>

    function hashString(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
      }
      return Math.abs(h);
    }

    /* =========================================================================
       3. DUAL PERSISTENCE: INDEXEDDB + LOCALSTORAGE + OPTIONAL AUTO-FILE
    ========================================================================= */
    const STORAGE_KEY = 'studio_command_hub_v3';
    const IDB_NAME = 'StudioCommandHubDB';
    const IDB_STORE = 'workspace';
    let linkedFileHandle = null;

    function idbOpen() {
      return new Promise((resolve, reject) => {
        try {
          const req = indexedDB.open(IDB_NAME, 1);
          req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        } catch (e) { reject(e); }
      });
    }

    async function idbLoad() {
      try {
        const db = await idbOpen();
        return await new Promise((resolve) => {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const req = tx.objectStore(IDB_STORE).get('state');
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (e) { return null; }
    }

    async function idbSave(data) {
      try {
        const db = await idbOpen();
        await new Promise((resolve) => {
          const tx = db.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).put(data, 'state');
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      } catch (e) {}
    }

    async function writeToLinkedDiskFile(data) {
      if (!linkedFileHandle) return;
      try {
        const writable = await linkedFileHandle.createWritable();
        await writable.write(JSON.stringify(data, null, 2));
        await writable.close();
      } catch (e) {}
    }

    let state = null;

    async function loadStateAsync() {
      // 1. Check URL snapshot
      try {
        if (window.location.hash && window.location.hash.startsWith('#snap=')) {
          const encoded = window.location.hash.slice(6);
          const parsed = JSON.parse(decodeURIComponent(escape(atob(encoded))));
          if (parsed && Array.isArray(parsed.folders)) {
            state = parsed;
            state.roleMode = 'member';
            return;
          }
        }
      } catch (e) {}

      // 2. Check IndexedDB
      const idbData = await idbLoad();
      if (idbData && Array.isArray(idbData.folders)) {
        state = idbData;
        state.folders.forEach(f => (f.tasks || []).forEach(tk => { tk.running = false; }));
        return;
      }

      // 3. Check localStorage (v3 or migrate v2)
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('studio_command_hub_v2');
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.folders)) {
            state = parsed;
            state.folders.forEach(f => (f.tasks || []).forEach(tk => { tk.running = false; }));
            return;
          }
        }
      } catch (e) {}

      state = createDefaultState();
    }

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      idbSave(state);
      writeToLinkedDiskFile(state);
      const stText = document.getElementById('saveStatusText');
      if (stText) stText.textContent = linkedFileHandle ? t('savedDisk') : t('saved');

    /* =========================================================================
       4. AUDIO CHIME & RICH 11-TYPE CANVAS PARTICLE FX ENGINE
    ========================================================================= */
    let audioCtx = null;
    function playChime() {
      if (state.muted) return;
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!audioCtx) audioCtx = new Ctx();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.18);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.56);
      } catch (e) {}
    }

    let fxAnimId = null;
    let fxParticles = [];

    function initParticles(type, level) {
      const canvas = document.getElementById('fxCanvas');
      if (!canvas) return;
      const w = canvas.width = window.innerWidth;
      const h = canvas.height = window.innerHeight;
      fxParticles = [];
      if (level === 'off') return;
      const count = level === 'high' ? 56 : 24;
      for (let i = 0; i < count; i++) {
        fxParticles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          size: 3 + Math.random() * 8,
          vx: type === 'rain' ? -1.8 : (Math.random() - 0.5) * 0.9,
          vy: type === 'rain' ? (8 + Math.random() * 6)
            : (type === 'embers' || type === 'bubbles' || type === 'smoke') ? -(0.35 + Math.random() * 1.1)
            : (0.28 + Math.random() * 1.0),
          rot: Math.random() * Math.PI * 2,
          vrot: (Math.random() - 0.5) * 0.04,
          alpha: 0.2 + Math.random() * 0.55,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function startFxLoop(theme) {
      if (fxAnimId) cancelAnimationFrame(fxAnimId);
      const canvas = document.getElementById('fxCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      initParticles(theme.particleType, state.fxLevel);
      let tick = 0;

      function step() {
        tick += 0.02;
        const w = canvas.width, h = canvas.height;
        ctx.clearRect(0, 0, w, h);
        if (state.fxLevel === 'off') return;

        const c1 = theme.palette.accent;
        const c2 = theme.palette.accent2;
        const pt = theme.particleType;

        for (const p of fxParticles) {
          p.x += p.vx + (pt === 'rain' ? 0 : Math.sin(tick + p.phase) * 0.4);
          p.y += p.vy;
          p.rot += p.vrot;

          if (p.y > h + 25) { p.y = -25; p.x = Math.random() * w; }
          if (p.y < -25) { p.y = h + 25; p.x = Math.random() * w; }
          if (p.x > w + 25) p.x = -25;
          if (p.x < -25) p.x = w + 25;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.globalAlpha = p.alpha;

          if (pt === 'feathers') {
            ctx.fillStyle = '#09090b';
            ctx.strokeStyle = c1;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.ellipse(0, 0, p.size * 1.6, p.size * 0.45, 0, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-p.size * 1.8, 0); ctx.lineTo(p.size * 1.6, 0); ctx.stroke();
          } else if (pt === 'sakura') {
            ctx.fillStyle = p.phase > 3 ? c1 : c2;
            ctx.beginPath();
            ctx.ellipse(0, 0, p.size * 0.85, p.size * 0.48, 0.3, 0, Math.PI * 2);
            ctx.fill();
          } else if (pt === 'rain') {
            ctx.rotate(-p.rot);
            ctx.strokeStyle = c1;
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-4, 18);
            ctx.stroke();
          } else if (pt === 'embers' || pt === 'sparks') {
            ctx.fillStyle = p.phase > 3 ? c1 : c2;
            ctx.shadowColor = c1;
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(0, 0, p.size * 0.32, 0, Math.PI * 2);
            ctx.fill();
          } else if (pt === 'smoke') {
            ctx.fillStyle = theme.palette.textMuted;
            ctx.globalAlpha = p.alpha * 0.28;
            ctx.beginPath();
            ctx.arc(0, 0, p.size * 2.2, 0, Math.PI * 2);
            ctx.fill();
          } else if (pt === 'bubbles') {
            ctx.strokeStyle = c2;
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.arc(0, 0, p.size * 0.6, 0, Math.PI * 2);
            ctx.stroke();
          } else if (pt === 'leaves') {
            ctx.fillStyle = p.phase > 4.2 ? c2 : c1;
            ctx.beginPath();
            ctx.ellipse(0, 0, p.size * 0.95, p.size * 0.42, 0, 0, Math.PI * 2);
            ctx.fill();
          } else if (pt === 'snow') {
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(0, 0, p.size * 0.36, 0, Math.PI * 2);
            ctx.fill();
          } else if (pt === 'dust') {
            ctx.fillStyle = c2;
            ctx.globalAlpha = p.alpha * (0.5 + 0.5 * Math.sin(tick * 2 + p.phase));
            ctx.beginPath();
            ctx.arc(0, 0, p.size * 0.32, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillStyle = '#ffffff';
            ctx.globalAlpha = p.alpha * (0.4 + 0.6 * Math.sin(tick * 2 + p.phase));
            ctx.beginPath();
            ctx.arc(0, 0, p.size * 0.25, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
        fxAnimId = requestAnimationFrame(step);
      }
      fxAnimId = requestAnimationFrame(step);
    }

    function applyTheme(theme) {
      const p = theme.palette;
      const root = document.documentElement;
      root.style.setProperty('--bg-main', p.bgMain);
      root.style.setProperty('--bg-panel', p.bgPanel);

      root.style.setProperty('--accent-2', p.accent2);
      root.style.setProperty('--text-main', p.textMain);

      const scenic = document.getElementById('scenicBackdrop');

      document.getElementById('cursorGlow').style.opacity = state.fxLevel === 'off' ? '0' : '0.55';
      document.getElementById('fxVhsOverlay').classList.toggle('active', state.fxLevel !== 'off' && theme.overlay === 'vhs');
      document.getElementById('fxGrainOverlay').classList.toggle('active', state.fxLevel !== 'off' && theme.overlay === 'grain');
      document.getElementById('fxGridOverlay').classList.toggle('active', state.fxLevel !== 'off' && theme.overlay === 'grid');

      const brandSlot = document.getElementById('brandIconSlot');
      if (brandSlot) brandSlot.innerHTML = getThemeFlagSVG(theme.flagIcon, p.accent, 22);
      startFxLoop(theme);

    /* =========================================================================
       5. HELPERS, TOASTS & MODALS
    ========================================================================= */
    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function formatTimer(sec) {
      const s = Math.max(0, Math.floor(sec || 0));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const r = s % 60;
      const pad = n => String(n).padStart(2, '0');
      return h > 0 ? `${pad(h)}:${pad(m)}:${pad(r)}` : `${pad(m)}:${pad(r)}`;
    }

    function showToast(message) {
      const root = document.getElementById('toastRoot');
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = message;
      root.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.25s ease';
        setTimeout(() => el.remove(), 260);
      }, 3000);
    }

    /* =========================================================================
       6. LIVE TIMER LOOP
    ========================================================================= */
    let timerInterval = null;
    function startGlobalTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        let changed = false;
        for (const folder of state.folders) {
          for (const task of folder.tasks) {
            if (task.running) {
              if (task.remainingSec > 0) {
                task.remainingSec -= 1;
                changed = true;
                const el = document.querySelector(`[data-timer-display="${task.id}"]`);
                if (el) el.textContent = formatTimer(task.remainingSec);
                const bar = document.querySelector(`[data-timer-bar="${task.id}"]`);
                if (bar && task.durationMin > 0) {
                  const total = task.durationMin * 60;
                  bar.style.width = Math.min(100, Math.max(0, ((total - task.remainingSec) / total) * 100)) + '%';
                }
              }
              if (task.remainingSec <= 0) {
                task.running = false;
                playChime();
                showToast(`${t('toastTimerDone')} ${task.title}`);
                changed = true;
                renderAll();
              }
            }
          }
        }
        if (changed) saveState();
      }, 1000);
    }

        box.style.background = th.palette.bgPanel;
        box.style.borderColor = th.palette.accent;
        box.innerHTML = `
          <div class="absolute inset-0 opacity-45 pointer-events-none">${getScenicBackdropSVG(th)}</div>
          <div class="relative z-10 flex items-center gap-3">
            <div class="w-11 h-11 rounded-xl flex items-center justify-center border shrink-0" style="background:${th.palette.accentSoft}; border-color:${th.palette.accent};">

            </div>
            <div class="min-w-0 flex-1">
              <div class="font-bold text-sm truncate" style="color:${th.palette.textMain}; font-family:${th.fontDisplay};">${escapeHtml(val)}</div>

              <span class="w-4 h-4 rounded-full border border-white/25" style="background:${th.palette.accent}"></span>

            </div>

      updatePreview();
      document.getElementById('wizTheme').addEventListener('input', updatePreview);
      document.querySelectorAll('[data-wiz-preset]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById('wizTheme').value = btn.dataset.wizPreset;
          if (!document.getElementById('wizName').value.trim()) document.getElementById('wizName').value = btn.dataset.wizPreset;
          updatePreview();
        });
      });

      document.getElementById('cancelWizBtn').addEventListener('click', closeModal);
      document.getElementById('folderWizardForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('wizName').value.trim();
        const themePrompt = document.getElementById('wizTheme').value.trim();
        const newFolder = {
          id: uid('folder'),
          name,
          theme: analyzeAndGenerateTheme(themePrompt),
          members: [],
          milestones: [
            { id: uid('ms'), title: state.lang === 'ru' ? 'Старт: Обсуждение идеи' : 'Kickoff: Idea', description: '', targetDate: '', completed: false },
            { id: uid('ms'), title: state.lang === 'ru' ? 'Первый прототип' : 'First Prototype', description: '', targetDate: '', completed: false },
            { id: uid('ms'), title: state.lang === 'ru' ? 'Финальный релиз' : 'Final Release', description: '', targetDate: '', completed: false }
          ],
          tasks: [],
          decisions: []
        };
        state.folders.unshift(newFolder);
        state.activeFolderId = newFolder.id;
        state.view = 'folder';
        state.activeTab = 'team';
        saveState(); closeModal(); renderAll();
        showToast(`${t('toastThemeApplied')} ${themePrompt}`);
      });
    }

    /* =========================================================================
       9. INSIDE FOLDER + TABS
    ========================================================================= */
    function renderFolderView(container, folder) {
      container.innerHTML = `
        <div class="space-y-4">
          <div class="panel rounded-2xl p-4 sm:p-5 relative overflow-hidden flex flex-wrap items-center justify-between gap-3">
            <div class="absolute inset-0 opacity-40 pointer-events-none">${getScenicBackdropSVG(folder.theme)}</div>
            <div class="relative z-10 flex items-center gap-3 min-w-0">
              <div class="w-12 h-12 rounded-xl flex items-center justify-center border shrink-0" style="background: var(--accent-soft); border-color: var(--accent); box-shadow: 0 0 18px var(--glow);">
                ${getThemeFlagSVG(folder.theme.flagIcon, folder.theme.palette.accent, 26)}
              </div>
              <div class="min-w-0">
                <div class="font-bold text-base sm:text-lg truncate display-font">${escapeHtml(folder.name)}</div>
                <div class="text-xs truncate" style="color: var(--text-muted);">
                  🎨 ${escapeHtml(folder.theme.prompt)} · ${state.lang === 'ru' ? folder.theme.moodLabelRu : folder.theme.moodLabelEn}
                </div>
              </div>
            </div>
            <div class="relative z-10 flex items-center gap-2">
              <button id="bannerEditThemeBtn" class="px-3.5 py-2 rounded-xl card text-xs font-semibold flex items-center gap-1.5">

                <span>${t('themeBtn')}</span>
              </button>
            </div>
          </div>
          <div id="tabBodyRoot"></div>
        </div>
      `;
      document.getElementById('bannerEditThemeBtn').addEventListener('click', openThemeModal);
      const body = document.getElementById('tabBodyRoot');
      if (state.activeTab === 'team') renderTeamTab(body, folder);
      else if (state.activeTab === 'tasks') renderTasksTab(body, folder);
      else if (state.activeTab === 'roadmap') renderRoadmapTab(body, folder);
      else renderDirectorTab(body, folder);
    }

    function renderTeamTab(container, folder) {
      const isDir = state.roleMode === 'director';
      const allRoles = Array.from(new Set([...PRESET_ROLES, ...folder.members.flatMap(m => m.roles || [])]));
      const filtered = [...folder.members].sort((a, b) => (a.order || 0) - (b.order || 0)).filter(m => {
        const q = memberSearchQuery.toLowerCase().trim();
        const matchQ = !q || (m.name || '').toLowerCase().includes(q) || (m.roles || []).some(r => r.toLowerCase().includes(q)) || (m.expText || '').toLowerCase().includes(q) || (m.phone || '').toLowerCase().includes(q);
        const matchRole = memberRoleFilter === 'all' || (m.roles || []).includes(memberRoleFilter);
        const matchLevel = memberLevelFilter === 'all' || m.level === memberLevelFilter;
        return matchQ && matchRole && matchLevel;
      });

      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-2 flex-1 min-w-[240px]">
              <div class="relative flex-1 min-w-[200px] max-w-sm">
