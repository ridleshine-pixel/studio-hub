<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio Command Hub — AI Art Director, Команда, Задачи и Дорожная карта</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-main: #0c0e14;
      --bg-panel: #131620;
      --bg-card: #1a1e2b;
      --bg-card-hover: #222838;
      --border-color: #2b3347;
      --accent: #6366f1;
      --accent-soft: rgba(99, 102, 241, 0.16);
      --accent-2: #06b6d4;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --glow: rgba(99, 102, 241, 0.35);
      --font-display: 'Inter', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      overflow-x: hidden;
      min-height: 100vh;
    }

    h1, h2, h3, .display-font { font-family: var(--font-display); }

    /* Full-screen Scenic Backdrop + Canvas FX + Interactive Cursor Glow */
    #scenicBackdrop {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      opacity: 0.55;
      transition: opacity 0.45s ease;
    }

    #fxCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.78;
      transition: opacity 0.3s ease;
    }

    #cursorGlow {
      position: fixed;
      width: 440px;
      height: 440px;
      border-radius: 999px;
      pointer-events: none;
      z-index: 1;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, var(--accent-soft) 0%, transparent 68%);
      opacity: 0.55;
      transition: opacity 0.3s ease;
    }

    .fx-overlay-vhs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background:
        repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 1px, transparent 1px, transparent 3px),
        radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.72) 100%);
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    .fx-overlay-vhs.active { opacity: 0.82; }

    .fx-overlay-grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background:
        radial-gradient(circle at 18% 15%, var(--accent-soft), transparent 46%),
        radial-gradient(circle at 82% 85%, rgba(255,255,255,0.03), transparent 48%),
        radial-gradient(circle at center, transparent 46%, rgba(0,0,0,0.68) 100%);
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    .fx-overlay-grain.active { opacity: 0.95; }

    .fx-overlay-grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 36px 36px;
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    .fx-overlay-grid.active { opacity: 1; }

    .app-shell {
      position: relative;
      z-index: 5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .panel {
      background-color: color-mix(in srgb, var(--bg-panel) 89%, transparent);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
    }

    .card {
      background-color: color-mix(in srgb, var(--bg-card) 91%, transparent);
      border: 1px solid var(--border-color);
      transition: border-color 0.2s ease, transform 0.15s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      background-color: var(--bg-card-hover);
      border-color: color-mix(in srgb, var(--accent) 55%, var(--border-color));
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.28);
    }

    .btn-accent {
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent-2) 45%, var(--accent)));
      color: #ffffff;
      box-shadow: 0 0 20px var(--glow);
      transition: filter 0.15s ease, transform 0.12s ease, box-shadow 0.2s ease;
    }
    .btn-accent:hover { filter: brightness(1.13); box-shadow: 0 0 28px var(--glow); }
    .btn-accent:active { transform: scale(0.96); }

    .tab-btn {
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      transition: color 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
    }
    .tab-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }
    .tab-btn.active {
      color: var(--text-main);
      border-bottom-color: var(--accent);
      background: var(--accent-soft);
    }

    .accent-pill {
      background: var(--accent-soft);
      color: var(--text-main);
      border: 1px solid color-mix(in srgb, var(--accent) 65%, transparent);
    }

    /* Click Ripple / Spark Burst */
    .click-ripple {
      position: fixed;
      border-radius: 999px;
      pointer-events: none;
      z-index: 70;
      border: 2px solid var(--accent);
      box-shadow: 0 0 14px var(--glow);
      transform: translate(-50%, -50%) scale(0.2);
      width: 36px;
      height: 36px;
      opacity: 0.9;
      animation: rippleOut 0.48s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes rippleOut {
      to { transform: translate(-50%, -50%) scale(2.4); opacity: 0; }
    }

    /* Designer Roadmap Styles */
    .roadmap-viewport {
      overflow-x: auto;
      overflow-y: visible;
      padding: 26px 16px 34px;
      position: relative;
    }
    .roadmap-track {
      display: inline-flex;
      align-items: center;
      position: relative;
      min-width: 100%;
      padding: 168px 36px;
      transform-origin: left center;
      transition: transform 0.2s ease;
    }
    .roadmap-spine {
      position: absolute;
      left: 36px;
      right: 36px;
      top: 50%;
      height: 6px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent));
      box-shadow: 0 0 22px var(--glow);
      transform: translateY(-50%);
      border-radius: 999px;
      z-index: 1;
      overflow: hidden;
    }
    .roadmap-spine.spine-hazard {
      height: 10px;
      background: repeating-linear-gradient(45deg, var(--accent) 0 12px, #111 12px 24px);
    }
    .roadmap-spine.spine-stone {
      height: 10px;
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 70%, #3a2f26), var(--accent-2), color-mix(in srgb, var(--accent) 70%, #3a2f26));
      border-top: 1px dashed rgba(255,255,255,0.28);
      border-bottom: 1px dashed rgba(0,0,0,0.5);
    }
    .roadmap-spine.spine-circuit {
      height: 4px;
      box-shadow: 0 0 12px var(--accent), 0 0 26px var(--accent-2);
    }
    .roadmap-spine::after {
      content: '';
      position: absolute;
      inset: 0;
      width: 28%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.75), transparent);
      animation: spinePulse 3.2s linear infinite;
    }
    @keyframes spinePulse {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(420%); }
    }

    .roadmap-node-col {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 270px;
      flex-shrink: 0;
    }
    .roadmap-branch-top,
    .roadmap-branch-bottom {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 9px;
      z-index: 3;
    }
    .roadmap-branch-top { bottom: calc(50% + 48px); align-items: flex-end; }
    .roadmap-branch-bottom { top: calc(50% + 58px); align-items: flex-start; }

    .branch-chip {
      position: relative;
      max-width: 168px;
      font-size: 11px;
      line-height: 1.25;
      padding: 7px 9px;
      border-radius: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.16s ease, box-shadow 0.18s ease;
      text-align: left;
    }
    .branch-chip:hover {
      transform: scale(1.12) translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 10px 26px rgba(0,0,0,0.55), 0 0 16px var(--glow);
      z-index: 15;
    }
    .branch-chip::after {
      content: '';
      position: absolute;
      left: 50%;
      width: 2px;
      height: 26px;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      transform: translateX(-50%);
    }
    .roadmap-branch-top .branch-chip::after { top: 100%; }
    .roadmap-branch-bottom .branch-chip::after { bottom: 100%; }

    .milestone-orb {
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s ease;
    }
    .milestone-orb:hover {
      transform: scale(1.14) rotate(3deg);
      box-shadow: 0 0 32px var(--glow) !important;
    }

    .drop-target-active {
      outline: 2px dashed var(--accent);
      background: var(--accent-soft) !important;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(7px);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 65;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      background: var(--bg-card);
      border: 1px solid var(--accent);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.55);
      animation: fadeSlideUp 0.22s ease;
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .ai-thinking-bar {
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent));
      background-size: 200% 100%;
      animation: shimmer 1.2s linear infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .view-animate {
      animation: viewEnter 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes viewEnter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #livingFxLayer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      overflow: hidden;
    }
    .roam-actor {
      position: absolute;
      pointer-events: none;
      will-change: transform;
      opacity: 0.55;
      filter: drop-shadow(0 0 8px var(--glow));
    }
    @keyframes roamRight {
      0% { transform: translateX(-12vw) translateY(0px); }
      25% { transform: translateX(22vw) translateY(-14px); }
      50% { transform: translateX(52vw) translateY(0px); }
      75% { transform: translateX(82vw) translateY(-16px); }
      100% { transform: translateX(112vw) translateY(0px); }
    }
    @keyframes flyAcross {
      0% { transform: translateX(-12vw) translateY(10px) scale(0.9); }
      50% { transform: translateX(50vw) translateY(-22px) scale(1.05); }
      100% { transform: translateX(112vw) translateY(8px) scale(0.95); }
    }
    @keyframes floatUp {
      0% { transform: translateY(105vh) translateX(0px); opacity: 0; }
      15% { opacity: 0.65; }
      85% { opacity: 0.55; }
      100% { transform: translateY(-15vh) translateX(28px); opacity: 0; }
    }
    @keyframes buildRise {
      0% { transform: scaleY(0.15); opacity: 0.12; }
      50% { transform: scaleY(1); opacity: 0.45; }
      100% { transform: scaleY(0.15); opacity: 0.12; }
    }
    @keyframes shootingStar {
      0% { transform: translate(-10vw, 5vh) rotate(22deg); opacity: 0; }
      10% { opacity: 0.9; }
      35% { transform: translate(110vw, 45vh) rotate(22deg); opacity: 0; }
      100% { transform: translate(110vw, 45vh) rotate(22deg); opacity: 0; }
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.35); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148,163,184,0.55); }

    input, select, textarea {
      background-color: rgba(0, 0, 0, 0.36);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    select option { background-color: #131620; color: #f1f5f9; }
  </style>
</head>
<body>
  <div id="scenicBackdrop"></div>
  <div id="cursorGlow"></div>
  <canvas id="fxCanvas"></canvas>
  <div id="livingFxLayer"></div>
  <div id="fxVhsOverlay" class="fx-overlay-vhs"></div>
  <div id="fxGrainOverlay" class="fx-overlay-grain"></div>
  <div id="fxGridOverlay" class="fx-overlay-grid"></div>

  <div class="app-shell">
    <!-- Top Global Bar -->
    <header class="panel sticky top-0 z-30 border-t-0 border-x-0 px-3 sm:px-5 py-2.5 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 min-w-0">
        <button id="backToHomeBtn" class="hidden px-2.5 py-1.5 rounded-lg card text-xs font-semibold flex items-center gap-1.5 shrink-0">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
          <span data-i18n="allFoldersBtn">Все папки</span>
        </button>

        <div id="brandBadge" class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0 border" style="background: var(--accent-soft); border-color: var(--accent);">
          <span id="brandIconSlot"></span>
        </div>

        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <h1 id="headerTitle" class="font-bold text-sm sm:text-base truncate">Studio Command Hub</h1>
            <span id="saveStatusBadge" class="hidden sm:inline-flex items-center gap-1 text-[11px] px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
              <span id="saveStatusText">Сохранено (БД)</span>
            </span>
          </div>
          <p id="headerSubtitle" class="text-xs truncate" style="color: var(--text-muted);"></p>
        </div>
      </div>

      <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap">
        <span id="accessModeBanner" class="hidden text-[11px] font-semibold px-2.5 py-1 rounded-full accent-pill"></span>

        <button id="shareFolderHeaderBtn" class="hidden px-2.5 py-1.5 rounded-lg text-xs font-medium card flex items-center gap-1.5" title="Поделиться папкой (ссылки)">
          <i data-lucide="link-2" class="w-3.5 h-3.5" style="color: var(--accent-2);"></i>
          <span class="hidden sm:inline" data-i18n="shareFolderBtn">Поделиться</span>
        </button>

        <button id="openThemeModalBtn" class="hidden px-2.5 py-1.5 rounded-lg text-xs font-medium card flex items-center gap-1.5">
          <i data-lucide="sparkles" class="w-3.5 h-3.5" style="color: var(--accent);"></i>
          <span class="hidden sm:inline" data-i18n="themeBtn">ИИ-Дизайн и FX</span>
        </button>

        <button id="toggleAmbientBtn" class="px-2.5 py-1.5 rounded-lg text-xs font-medium card flex items-center gap-1.5" title="Фоновая музыка под тему">
          <i id="ambientIcon" data-lucide="music" class="w-3.5 h-3.5"></i>
          <span id="ambientBtnText" class="hidden lg:inline">Фон: Выкл</span>
        </button>

        <select id="fxLevelSelect" class="py-1.5 px-2 text-xs hidden sm:inline-block" title="Уровень спецэффектов">
          <option value="high">FX: Макс</option>
          <option value="low">FX: Средн</option>
          <option value="off">FX: Выкл</option>
        </select>

        <button id="toggleRoleLockBtn" class="px-2.5 py-1.5 rounded-lg text-xs font-medium card flex items-center gap-1.5">
          <i id="roleLockIcon" data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-400"></i>
          <span id="roleLockText" class="hidden md:inline">Главный</span>
        </button>

        <button id="openShareModalBtn" class="px-2.5 py-1.5 rounded-lg text-xs font-medium card flex items-center gap-1.5">
          <i data-lucide="hard-drive" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline" data-i18n="shareBtn">Сейв / ИИ-ключ</span>
        </button>

        <button id="openGuideBtn" class="p-1.5 rounded-lg card" title="Инструкция по сайту">
          <i data-lucide="help-circle" class="w-4 h-4"></i>
        </button>

        <button id="toggleMuteBtn" class="p-1.5 rounded-lg card" title="Звуки и эффекты">
          <i id="muteIcon" data-lucide="volume-2" class="w-4 h-4"></i>
        </button>

        <button id="toggleLangBtn" class="px-2.5 py-1.5 rounded-lg text-xs font-bold accent-pill">RU</button>
      </div>
    </header>

    <!-- Folder Navigation Tabs -->
    <nav id="folderNavBar" class="hidden panel border-t-0 border-x-0 px-3 sm:px-6 flex items-center gap-1 overflow-x-auto">
      <button class="tab-btn px-3 sm:px-4 py-3 text-xs sm:text-sm font-medium flex items-center gap-2 whitespace-nowrap" data-tab="team">
        <i data-lucide="users" class="w-4 h-4"></i>
        <span data-i18n="tabTeam">Команда</span>
        <span id="badgeTeamCount" class="text-[11px] px-1.5 py-0.5 rounded-md bg-white/10">0</span>
      </button>
      <button class="tab-btn px-3 sm:px-4 py-3 text-xs sm:text-sm font-medium flex items-center gap-2 whitespace-nowrap" data-tab="tasks">
        <i data-lucide="list-checks" class="w-4 h-4"></i>
        <span data-i18n="tabTasks">Задачи и День</span>
        <span id="badgeTaskCount" class="text-[11px] px-1.5 py-0.5 rounded-md bg-white/10">0</span>
      </button>
      <button class="tab-btn px-3 sm:px-4 py-3 text-xs sm:text-sm font-medium flex items-center gap-2 whitespace-nowrap" data-tab="roadmap">
        <i data-lucide="map" class="w-4 h-4"></i>
        <span data-i18n="tabRoadmap">Дорожная карта</span>
        <span id="badgeMilestoneCount" class="text-[11px] px-1.5 py-0.5 rounded-md bg-white/10">0</span>
      </button>
      <button class="tab-btn px-3 sm:px-4 py-3 text-xs sm:text-sm font-medium flex items-center gap-2 whitespace-nowrap" data-tab="director">
        <i data-lucide="trophy" class="w-4 h-4"></i>
        <span data-i18n="tabDirector">Пульт и Награды</span>
      </button>
    </nav>

    <main id="mainContent" class="flex-1 p-3 sm:p-6 max-w-[1550px] w-full mx-auto"></main>
  </div>

  <div id="modalRoot" class="hidden"></div>
  <div id="toastRoot" class="toast-container"></div>

  <script>
    /* =========================================================================
       1. I18N DICTIONARY (RU / EN)
    ========================================================================= */
    const I18N = {
      ru: {
        hubTitle: 'Studio Command Hub',
        hubSubtitle: 'Свободный ИИ-дизайн для любых проектов, команд, задач и дорожных карт',
        allFoldersBtn: 'Все папки',
        saved: 'Сохранено (БД)',
        savedDisk: 'Синхр. с файлом',
        themeBtn: 'ИИ-Дизайн и FX',
        shareBtn: 'Сейв / ИИ-ключ',
        shareFolderBtn: 'Поделиться',
        ambientOn: 'Фон: Вкл',
        ambientOff: 'Фон: Выкл',
        viewOnlyBadge: '👁 Только просмотр (Подотчётность)',
        workerBadge: '🛠 Режим участника (Только выполнение)',
        folderShareTitle: 'Ссылки на эту папку',
        folderShareDesc: 'Создайте ссылку именно на эту папку с сохранением её темы, команды, задач и дорожной карты:',
        viewLinkTitle: '1. Ссылка подотчётности (Только просмотр)',
        viewLinkDesc: 'Получатель увидит весь прогресс, команду и карту в красивом оформлении, без лишних кнопок и без права редактирования.',
        copyViewLinkBtn: 'Скопировать ссылку просмотра',
        workLinkTitle: '2. Ссылка для участников (Только выполнение)',
        workLinkDesc: 'Участники смогут отмечать выполнение задач и запускать таймеры, но не смогут добавлять, изменять или удалять задачи, людей и вехи.',
        copyWorkLinkBtn: 'Скопировать ссылку для участников',
        copyBackReportBtn: 'Скопировать отчёт для Главного',

    function hashString(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
      }
      return Math.abs(h);
    }

    function hslToHex(h, s, l) {
      s /= 100; l /= 100;
      const a = s * Math.min(l, 1 - l);
      const f = n => {
        const k = (n + h / 30) % 12;
        const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
        return Math.round(255 * color).toString(16).padStart(2, '0');
      };
      return `#${f(0)}${f(8)}${f(4)}`;
    }

    function hexToRgba(hex, alpha) {
      const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '#6366f1');
      if (!m) return `rgba(99, 102, 241, ${alpha})`;
      return `rgba(${parseInt(m[1],16)}, ${parseInt(m[2],16)}, ${parseInt(m[3],16)}, ${alpha})`;
    }

    // Multi-axis semantic synthesizer: combines ANY words into unique layered SVG art + palette + roadmap style!
    function synthesizeProceduralTheme(promptText) {
      const raw = (promptText || '').trim() || 'Новый проект';
      const q = raw.toLowerCase();
      const seed = hashString(q);

      // Axis 1: Base Hue & Mood Palette
      let baseHue = seed % 360;
      let sat = 72;
      let accent2Hue = (baseHue + 42 + (seed % 50)) % 360;
      let bgSat = 22;
      let overlay = 'grain';
      let particleType = ['dust', 'embers', 'stars', 'sparks', 'smoke'][seed % 5];
      let spineStyle = 'energy';
      let fontDisplay = "'Inter', system-ui, sans-serif";
      let moodTagsRu = [];
      let moodTagsEn = [];

      // Detect color/atmosphere cues
      if (/красн|кров|алый|хоррор|ужас|демон|ад|вампир|ссср|совет|red|blood|horror|crimson|soviet|hell/.test(q)) {
        baseHue = 3; sat = 76; accent2Hue = 38; bgSat = 16;
        overlay = /vhs|хоррор|ужас|ссср|совет|horror/.test(q) ? 'vhs' : 'grain';
        moodTagsRu.push('Алый контраст'); moodTagsEn.push('Crimson Contrast');
      } else if (/до нашей эры|древн|пустын|егип|песок|бронз|пирамид|камен|золот|стимпанк|ancient|desert|egypt|sand|gold|steampunk|bc\b/.test(q)) {
        baseHue = 32; sat = 82; accent2Hue = 14; bgSat = 26;
        overlay = 'grain'; spineStyle = 'stone';
        fontDisplay = "Georgia, 'Times New Roman', serif";
        moodTagsRu.push('Песчаник и бронза'); moodTagsEn.push('Sandstone & Bronze');
      } else if (/апокалип|постапок|радиац|бункер|руин|ржав|выжж|apocal|wasteland|fallout|ruin/.test(q)) {
        baseHue = 22; sat = 86; accent2Hue = 48; bgSat = 24;
        overlay = 'grain'; spineStyle = 'hazard'; particleType = 'embers';
        moodTagsRu.push('Пепел и ржавчина'); moodTagsEn.push('Ash & Rust');
      } else if (/кибер|неон|хакер|синт|лазер|робот|техно|cyber|neon|synth|matrix|tech|robot/.test(q)) {
        baseHue = 190; sat = 90; accent2Hue = 320; bgSat = 38;
        overlay = 'grid'; spineStyle = 'circuit'; particleType = 'sparks';
        fontDisplay = "'Courier New', ui-monospace, monospace";
        moodTagsRu.push('Неон и микросхемы'); moodTagsEn.push('Neon Circuits');
      } else if (/сакур|япон|самура|токио|аниме|розов|цвет|sakura|japan|samurai|anime|pink/.test(q)) {
        baseHue = 345; sat = 84; accent2Hue = 355; bgSat = 24;
        particleType = 'sakura'; fontDisplay = "Georgia, serif";
        moodTagsRu.push('Сакура и тушь'); moodTagsEn.push('Sakura & Ink');
      } else if (/океан|подвод|мор|вод|глубин|атлант|пират|корабл|ocean|sea|water|underwater|pirate/.test(q)) {
        baseHue = 198; sat = 86; accent2Hue = 168; bgSat = 42;
        particleType = 'bubbles';
        moodTagsRu.push('Морская глубина'); moodTagsEn.push('Abyssal Blue');
      } else if (/лес|природ|джунгл|сад|магич|эльф|выжив|животн|кот|собак|forest|nature|jungle|elf|cozy|cat|dog/.test(q)) {
        baseHue = 152; sat = 76; accent2Hue = 48; bgSat = 30;
        particleType = 'leaves';
        moodTagsRu.push('Живая природа'); moodTagsEn.push('Living Nature');
      } else if (/снег|зим|лёд|лед|мороз|арктик|север|snow|winter|ice|frost|arctic/.test(q)) {
        baseHue = 202; sat = 85; accent2Hue = 185; bgSat = 34;
        particleType = 'snow';
        moodTagsRu.push('Ледяной север'); moodTagsEn.push('Frozen North');
      } else if (/космос|планет|звезд|галакт|луна|марс|sci-fi|space|star|galaxy|moon|mars/.test(q)) {
        baseHue = 238; sat = 82; accent2Hue = 196; bgSat = 42;
        overlay = 'grid'; particleType = 'stars'; spineStyle = 'circuit';
        moodTagsRu.push('Глубокий космос'); moodTagsEn.push('Deep Cosmos');
      } else if (/фэнтез|маг|дракон|замок|рыцар|средневек|колд|fantasy|magic|dragon|castle|medieval/.test(q)) {
        baseHue = 274; sat = 76; accent2Hue = 38; bgSat = 26;
        particleType = 'embers'; spineStyle = 'stone'; fontDisplay = "Georgia, serif";
        moodTagsRu.push('Аркан и золото'); moodTagsEn.push('Arcane Gold');
      } else if (/нуар|детектив|дожд|тень|1920|мафи|noir|detective|rain|mafia/.test(q)) {

        particleType = 'rain';

      }

      // Override particles & spine if specific words appear
      if (/дожд|ливень|шторм|rain|storm/.test(q)) particleType = 'rain';
      if (/птиц|ворон|голуб|пер|крыл|орнитоз|bird|crow|pigeon|wing/.test(q)) particleType = 'feathers';
      if (/огон|лава|вулкан|пожар|искра|fire|lava|volcano|ember/.test(q)) particleType = 'embers';
      if (/пар|дым|завод|дирижабл|стимпанк|steam|smoke|airship|factory/.test(q)) particleType = 'smoke';
      if (/сакур|лепест|sakura|petal/.test(q)) particleType = 'sakura';
      if (/снег|метел|snow/.test(q)) particleType = 'snow';

      if (/ссср|совет|до нашей эры|древн|камен/.test(q)) spineStyle = 'stone';
      if (/апокалип|опасн|радиац|шкаф/.test(q)) spineStyle = 'hazard';

      // Axis 2: Combinatorial Scenic Layers (Celestial + Terrain + Monument)
      let celestial = 'sun_halo';
      if (/луна|ноч|хоррор|вампир|волк|нуар|moon|night|horror/.test(q)) celestial = 'blood_moon';
      else if (/космос|планет|орбит|галакт|space|planet|orbit/.test(q)) celestial = 'ringed_planet';
      else if (/затмен|апокалип|мрак|eclipse|apocal/.test(q)) celestial = 'eclipse';
      else if (/дирижабл|небо|облак|воздух|airship|sky|float/.test(q)) celestial = 'airship';
      else celestial = ['sun_halo', 'ringed_planet', 'eclipse', 'blood_moon'][seed % 4];

      let terrain = 'mountains';
      if (/город|мегаполис|улиц|ссср|совет|кибер|нуар|city|urban|soviet|cyber/.test(q)) terrain = 'city_skyline';
      else if (/пустын|егип|пирамид|до нашей эры|древн|desert|pyramid|ancient/.test(q)) terrain = 'pyramids';
      else if (/замок|фэнтез|рыцар|средневек|castle|fantasy|gothic/.test(q)) terrain = 'castle';
      else if (/шкаф|комнат|дом|отел|wardrobe|closet|room|hotel/.test(q)) terrain = 'wardrobes';
      else if (/океан|подвод|мор|ocean|sea|underwater/.test(q)) terrain = 'waves';
      else if (/лес|природ|джунгл|forest|jungle/.test(q)) terrain = 'forest';
      else terrain = ['mountains', 'city_skyline', 'floating_islands', 'pyramids', 'castle'][seed % 5];

      let monument = 'none';
      if (/ссср|совет/.test(q) && /до нашей эры|древн|камен/.test(q)) monument = 'soviet_obelisk';
      else if (/птиц|ворон|голуб|орнитоз|bird|crow|pigeon/.test(q)) monument = 'giant_wings';
      else if (/сакур|япон|самура|torii|japan|samurai/.test(q)) monument = 'torii';
      else if (/стимпанк|шестер|механизм|steampunk|gear/.test(q)) monument = 'gears';
      else if (/ссср|совет/.test(q)) monument = 'soviet_obelisk';

      // Axis 3: Flag Icon
      let flagIcon = 'flag';
      if (/шкаф|двер|wardrobe|door/.test(q)) flagIcon = 'wardrobe';
      else if (/птиц|ворон|голуб|bird|crow|pigeon/.test(q)) flagIcon = 'bird';
      else if (/ссср|совет/.test(q)) flagIcon = 'soviet_stone';
      else if (/до нашей эры|древн|пирамид|егип|ancient|pyramid/.test(q)) flagIcon = 'obelisk';
      else if (/сакур|япон|самура|sakura|japan/.test(q)) flagIcon = 'torii';
      else if (/апокалип|радиац|опасн|apocal|hazard/.test(q)) flagIcon = 'hazard';
      else if (/кибер|неон|робот|cyber|neon|robot/.test(q)) flagIcon = 'cyber';
      else if (/фэнтез|замок|рыцар|маг|fantasy|castle/.test(q)) flagIcon = 'crest';
      else if (/космос|планет|space|star/.test(q)) flagIcon = 'radar';
      else if (/океан|подвод|мор|ocean|sea/.test(q)) flagIcon = 'wave';
      else if (/лес|природ|животн|forest|nature/.test(q)) flagIcon = 'leaf';
      else if (/стимпанк|механизм|steampunk|gear/.test(q)) flagIcon = 'gear';
      else if (/снег|гор|snow|mountain/.test(q)) flagIcon = 'mountain';
      else if (/город|city/.test(q)) flagIcon = 'city';
      else flagIcon = ['flag', 'crest', 'radar', 'obelisk', 'mountain'][seed % 5];

      const accent = hslToHex(baseHue, sat, 54);
      const accent2 = hslToHex(accent2Hue, Math.max(55, sat - 6), 56);
      const bgMain = hslToHex(baseHue, bgSat, 7);
      const bgPanel = hslToHex(baseHue, bgSat, 11);
      const bgCard = hslToHex(baseHue, Math.max(12, bgSat - 2), 15);
      const bgCardHover = hslToHex(baseHue, Math.max(12, bgSat - 2), 20);
      const border = hslToHex(baseHue, Math.max(14, bgSat), 28);

      const moodLabelRu = moodTagsRu.length ? `${moodTagsRu[0]} · Авторский синтез` : `Уникальный мир «${raw.slice(0, 26)}»`;
      const moodLabelEn = moodTagsEn.length ? `${moodTagsEn[0]} · Custom Synthesis` : `Custom World «${raw.slice(0, 26)}»`;

      // Axis 4: Per-Theme Sound Profile & Living Interface Animation
      let soundProfile = 'cyber_synth';
      let livingAnim = 'floating_lanterns';
      if (/хоррор|ужас|птиц|ворон|голуб|vhs|орнитоз|horror|bird|crow|pigeon/.test(q)) {

      } else if (/звер|животн|кот|собак|волк|лис|кинолог|лес|природ|animal|cat|dog|wolf|fox|forest|nature/.test(q)) {
        soundProfile = 'nature_breeze'; livingAnim = 'roaming_creatures';
      } else if (/до нашей эры|древн|ссср|совет|камен|егип|пирамид|ancient|soviet|stone|egypt/.test(q)) {
        soundProfile = 'ancient_monolith'; livingAnim = /город|ссср|совет|city|soviet/.test(q) ? 'living_city' : 'floating_lanterns';
      } else if (/апокалип|постапок|шкаф|огон|лава|руин|apocal|wardrobe|fire|ruin/.test(q)) {
        soundProfile = 'apoc_wind'; livingAnim = 'living_city';
      } else if (/кибер|неон|город|мегаполис|робот|cyber|neon|city|urban/.test(q)) {
        soundProfile = /дожд|нуар|rain|noir/.test(q) ? 'noir_rain' : 'cyber_synth'; livingAnim = 'living_city';
      } else if (/океан|подвод|мор|вод|рыб|ocean|sea|underwater|fish/.test(q)) {
        soundProfile = 'ocean_deep'; livingAnim = 'swimming_fish';
      } else if (/космос|планет|звезд|sci-fi|space|star|orbit/.test(q)) {
        soundProfile = 'cyber_synth'; livingAnim = 'orbiting_satellites';
      } else if (/фэнтез|замок|сакур|маг|япон|fantasy|castle|sakura|magic/.test(q)) {
        soundProfile = 'fantasy_harp'; livingAnim = 'floating_lanterns';
      } else if (/дожд|нуар|детектив|rain|noir/.test(q)) {
        soundProfile = 'noir_rain'; livingAnim = 'living_city';
      } else {
        const profiles = ['cyber_synth', 'fantasy_harp', 'nature_breeze', 'ancient_monolith', 'ocean_deep'];
        const anims = ['floating_lanterns', 'orbiting_satellites', 'roaming_creatures', 'flying_birds', 'living_city'];
        soundProfile = profiles[seed % profiles.length];
        livingAnim = anims[seed % anims.length];
      }

      return {
        prompt: raw,
        moodLabelRu,
        moodLabelEn,
        soundProfile,
        livingAnim,
        palette: {
          bgMain, bgPanel, bgCard, bgCardHover, border,
          accent, accentSoft: hexToRgba(accent, 0.21),
          accent2, textMain: '#f6f5f2', textMuted: '#a6aebd',
          glow: hexToRgba(accent, 0.46)
        },
        particleType,
        overlay,
        spineStyle,
        flagIcon,
        scenicLayers: { celestial, terrain, monument },
        customSvg: '',
        trophyNameRu: `Орден Покорителя «${raw.slice(0, 28)}»`,
        trophyNameEn: `Conqueror Trophy: «${raw.slice(0, 28)}»`,
        fontDisplay
      };
    }

    // Optional LIVE Gemini AI Theme Generator (when user provides their own API key)
    async function generateThemeWithOptionalAI(promptText) {
      const baseTheme = synthesizeProceduralTheme(promptText);
      const apiKey = (state && state.geminiApiKey || '').trim();
      if (!apiKey) return baseTheme;

      try {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`;
        const sysPrompt = `You are a master Game Art Director. Given a user project theme, return ONLY valid JSON (no markdown fences) with keys:
{
  "moodLabelRu": "short 3-5 word Russian artistic style description",
  "moodLabelEn": "short 3-5 word English artistic style description",
  "accent": "#hex bright readable accent",
  "accent2": "#hex secondary accent",
  "bgMain": "#hex very dark background (lightness 5-10%)",
  "bgPanel": "#hex dark panel (lightness 10-14%)",
  "bgCard": "#hex dark card (lightness 14-18%)",
  "border": "#hex subtle border (lightness 24-34%)",
  "particleType": "one of: embers, feathers, sakura, rain, dust, smoke, snow, bubbles, leaves, sparks, stars",
  "overlay": "one of: vhs, grain, grid, none",
  "spineStyle": "one of: energy, hazard, stone, circuit",
  "trophyNameRu": "creative Russian trophy/prize title matching the theme",
  "trophyNameEn": "creative English trophy/prize title matching the theme",
  "customSvg": "a single self-contained artistic panoramic <svg class=\\"w-full h-full\\" viewBox=\\"0 0 1440 800\\" preserveAspectRatio=\\"xMidYMax slice\\">...</svg> depicting the exact scene of the theme using clean vector silhouettes and glows (no scripts, no external urls, max 2500 chars)"
}`;
        const resp = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `${sysPrompt}\n\nProject theme: "${promptText}"` }] }],
            generationConfig: { temperature: 0.9, responseMimeType: 'application/json' }
          })
        });
        if (!resp.ok) throw new Error('API error');
        const data = await resp.json();
        const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
        const ai = JSON.parse(text.replace(/```json|```/g, '').trim());
        const accent = /^#[0-9a-f]{6}$/i.test(ai.accent) ? ai.accent : baseTheme.palette.accent;
        const accent2 = /^#[0-9a-f]{6}$/i.test(ai.accent2) ? ai.accent2 : baseTheme.palette.accent2;
        const safeSvg = (typeof ai.customSvg === 'string' && ai.customSvg.includes('<svg') && !/<script|on\w+=/i.test(ai.customSvg))
          ? ai.customSvg : '';
        return {
          ...baseTheme,
          moodLabelRu: ai.moodLabelRu || baseTheme.moodLabelRu,
          moodLabelEn: ai.moodLabelEn || baseTheme.moodLabelEn,
          palette: {
            ...baseTheme.palette,
            bgMain: /^#[0-9a-f]{6}$/i.test(ai.bgMain) ? ai.bgMain : baseTheme.palette.bgMain,
            bgPanel: /^#[0-9a-f]{6}$/i.test(ai.bgPanel) ? ai.bgPanel : baseTheme.palette.bgPanel,
            bgCard: /^#[0-9a-f]{6}$/i.test(ai.bgCard) ? ai.bgCard : baseTheme.palette.bgCard,
            border: /^#[0-9a-f]{6}$/i.test(ai.border) ? ai.border : baseTheme.palette.border,
            accent,
            accentSoft: hexToRgba(accent, 0.22),
            accent2,
            glow: hexToRgba(accent, 0.48)
          },
          particleType: ai.particleType || baseTheme.particleType,
          overlay: ai.overlay || baseTheme.overlay,
          spineStyle: ai.spineStyle || baseTheme.spineStyle,
          trophyNameRu: ai.trophyNameRu || baseTheme.trophyNameRu,
          trophyNameEn: ai.trophyNameEn || baseTheme.trophyNameEn,
          customSvg: safeSvg
        };
      } catch (e) {
        showToast(t('toastAiFallback'));
        return baseTheme;
      }
    }

    const STORAGE_KEY = 'studio_command_hub_v4';
    const IDB_NAME = 'StudioCommandHubDB';
    const IDB_STORE = 'workspace';
    let linkedFileHandle = null;

    function idbOpen() {
      return new Promise((resolve, reject) => {
        try {
          const req = indexedDB.open(IDB_NAME, 1);
          req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        } catch (e) { reject(e); }
      });
    }
    async function idbLoad() {
      try {
        const db = await idbOpen();
        return await new Promise((resolve) => {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const req = tx.objectStore(IDB_STORE).get('state');
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (e) { return null; }
    }
    async function idbSave(data) {
      try {
        const db = await idbOpen();
        await new Promise((resolve) => {
          const tx = db.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).put(data, 'state');
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      } catch (e) {}
    }
    async function writeToLinkedDiskFile(data) {
      if (!linkedFileHandle) return;
      try {
        const writable = await linkedFileHandle.createWritable();
        await writable.write(JSON.stringify(data, null, 2));
        await writable.close();
      } catch (e) {}
    }

    async function loadStateAsync() {
      try {
        const h = window.location.hash || '';
        if (h.startsWith('#view=') || h.startsWith('#work=')) {
          const isView = h.startsWith('#view=');
          const payload = JSON.parse(decodeURIComponent(escape(atob(h.slice(6)))));
          if (payload && payload.folder) {
            sessionAccessMode = isView ? 'view' : 'work';
            state = createDefaultState();
            state.lang = payload.lang || 'ru';
            state.folders = [payload.folder];
            state.activeFolderId = payload.folder.id;
            state.view = 'folder';
            state.activeTab = isView ? 'roadmap' : 'tasks';
            state.roleMode = 'member';
            ensureFolderDays(payload.folder);
            return;
          }
        }
        if (h.startsWith('#snap=')) {
          const parsed = JSON.parse(decodeURIComponent(escape(atob(h.slice(6)))));
          if (parsed && Array.isArray(parsed.folders)) { state = parsed; state.roleMode = 'member'; return; }
        }
      } catch (e) {}

      const idbData = await idbLoad();
      if (idbData && Array.isArray(idbData.folders)) {
        state = idbData;
        state.folders.forEach(f => {
          if (!f.trophies) f.trophies = [];
          ensureFolderDays(f);
          (f.tasks || []).forEach(tk => {
            if (tk.running && tk.runningSince) {
              const elapsed = Math.floor((Date.now() - tk.runningSince) / 1000);
              tk.remainingSec = Math.max(0, (tk.remainingSec || 0) - elapsed);
              tk.runningSince = Date.now();
              if (tk.remainingSec <= 0) { tk.running = false; tk.runningSince = null; }
            }
          });
        });
        return;
      }

      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('studio_command_hub_v3') || localStorage.getItem('studio_command_hub_v2');
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.folders)) {
            state = parsed;
            state.folders.forEach(f => {
              if (!f.trophies) f.trophies = [];
              ensureFolderDays(f);
              (f.tasks || []).forEach(tk => {

    let ambientNodes = [];

    function stopAmbientSound() {
      if (ambientStepTimer) { clearInterval(ambientStepTimer); ambientStepTimer = null; }

      ambientNodes = [];

    function playSynthVoice(ctx, dest, freq, type, duration, peakGain, attack = 0.04, cutoff = 1800) {
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const flt = ctx.createBiquadFilter();
      const g = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      flt.type = 'lowpass';
      flt.frequency.setValueAtTime(cutoff, now);
      flt.frequency.exponentialRampToValueAtTime(Math.max(200, cutoff * 0.45), now + duration);
      g.gain.setValueAtTime(0.0005, now);
      g.gain.linearRampToValueAtTime(peakGain, now + attack);
      g.gain.exponentialRampToValueAtTime(0.0005, now + duration);
      osc.connect(flt); flt.connect(g); g.connect(dest);
      osc.start(now); osc.stop(now + duration + 0.05);
    }

    function startAmbientSound(profile) {

        master.connect(ctx.destination);

    /* =========================================================================
       5. CANVAS PARTICLE ENGINE (11 TYPES)
    ========================================================================= */
    let fxAnimId = null;
    let fxParticles = [];

    function initParticles(type, level) {
      const canvas = document.getElementById('fxCanvas');
      if (!canvas) return;
      const w = canvas.width = window.innerWidth;
      const h = canvas.height = window.innerHeight;
      fxParticles = [];
      if (level === 'off') return;
      const count = level === 'high' ? 60 : 26;
      for (let i = 0; i < count; i++) {
        fxParticles.push({
          x: Math.random() * w, y: Math.random() * h, size: 3 + Math.random() * 8,
          vx: type === 'rain' ? -1.8 : (Math.random() - 0.5) * 0.9,
          vy: type === 'rain' ? (8 + Math.random() * 6)
            : (type === 'embers' || type === 'bubbles' || type === 'smoke') ? -(0.35 + Math.random() * 1.1)
            : (0.28 + Math.random() * 1.0),
          rot: Math.random() * Math.PI * 2, vrot: (Math.random() - 0.5) * 0.04,
          alpha: 0.22 + Math.random() * 0.55, phase: Math.random() * Math.PI * 2
        });
      }
    }

    function startFxLoop(theme) {
      if (fxAnimId) cancelAnimationFrame(fxAnimId);
      const canvas = document.getElementById('fxCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      initParticles(theme.particleType, state.fxLevel);
      let tick = 0;
      function step() {
        tick += 0.02;
        const w = canvas.width, h = canvas.height;
        ctx.clearRect(0, 0, w, h);
        if (state.fxLevel === 'off') return;
        const c1 = theme.palette.accent, c2 = theme.palette.accent2, pt = theme.particleType;
        for (const p of fxParticles) {
          p.x += p.vx + (pt === 'rain' ? 0 : Math.sin(tick + p.phase) * 0.42);
          p.y += p.vy;
          p.rot += p.vrot;
          if (p.y > h + 25) { p.y = -25; p.x = Math.random() * w; }
          if (p.y < -25) { p.y = h + 25; p.x = Math.random() * w; }
          if (p.x > w + 25) p.x = -25;
          if (p.x < -25) p.x = w + 25;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.globalAlpha = p.alpha;

          if (pt === 'feathers') {
            ctx.fillStyle = '#09090b'; ctx.strokeStyle = c1; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.ellipse(0, 0, p.size * 1.6, p.size * 0.45, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-p.size * 1.8, 0); ctx.lineTo(p.size * 1.6, 0); ctx.stroke();
          } else if (pt === 'sakura') {
            ctx.fillStyle = p.phase > 3 ? c1 : c2;
            ctx.beginPath(); ctx.ellipse(0, 0, p.size * 0.85, p.size * 0.48, 0.3, 0, Math.PI * 2); ctx.fill();
          } else if (pt === 'rain') {
            ctx.rotate(-p.rot); ctx.strokeStyle = c1; ctx.lineWidth = 1.25;
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-4, 18); ctx.stroke();
          } else if (pt === 'embers' || pt === 'sparks') {
            ctx.fillStyle = p.phase > 3 ? c1 : c2; ctx.shadowColor = c1; ctx.shadowBlur = 9;
            ctx.beginPath(); ctx.arc(0, 0, p.size * 0.33, 0, Math.PI * 2); ctx.fill();
          } else if (pt === 'smoke') {
            ctx.fillStyle = theme.palette.textMuted; ctx.globalAlpha = p.alpha * 0.25;
            ctx.beginPath(); ctx.arc(0, 0, p.size * 2.3, 0, Math.PI * 2); ctx.fill();
          } else if (pt === 'bubbles') {
            ctx.strokeStyle = c2; ctx.lineWidth = 1.2;
            ctx.beginPath(); ctx.arc(0, 0, p.size * 0.62, 0, Math.PI * 2); ctx.stroke();
          } else if (pt === 'leaves') {
            ctx.fillStyle = p.phase > 4.2 ? c2 : c1;
            ctx.beginPath(); ctx.ellipse(0, 0, p.size * 0.95, p.size * 0.42, 0, 0, Math.PI * 2); ctx.fill();
          } else if (pt === 'snow') {
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(0, 0, p.size * 0.36, 0, Math.PI * 2); ctx.fill();
          } else if (pt === 'dust') {
            ctx.fillStyle = c2; ctx.globalAlpha = p.alpha * (0.5 + 0.5 * Math.sin(tick * 2 + p.phase));
            ctx.beginPath(); ctx.arc(0, 0, p.size * 0.32, 0, Math.PI * 2); ctx.fill();
          } else {
            ctx.fillStyle = '#ffffff'; ctx.globalAlpha = p.alpha * (0.4 + 0.6 * Math.sin(tick * 2 + p.phase));
            ctx.beginPath(); ctx.arc(0, 0, p.size * 0.26, 0, Math.PI * 2); ctx.fill();
          }
          ctx.restore();
        }
        fxAnimId = requestAnimationFrame(step);
      }
      fxAnimId = requestAnimationFrame(step);
    }

    /* =========================================================================
       6. HELPERS, TOASTS & MODALS
    ========================================================================= */
    function escapeHtml(str) { return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
    function formatTimer(sec) {
      const s = Math.max(0, Math.floor(sec || 0));
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
      const pad = n => String(n).padStart(2, '0');
      return h > 0 ? `${pad(h)}:${pad(m)}:${pad(r)}` : `${pad(m)}:${pad(r)}`;
    }
    function showToast(message) {
      const root = document.getElementById('toastRoot');
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = message;
      root.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.25s ease'; setTimeout(() => el.remove(), 260); }, 3000);
    }
    function openModal(htmlContent) {
      const root = document.getElementById('modalRoot');
      root.className = 'modal-backdrop';
      root.innerHTML = `<div class="panel rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-5 shadow-2xl relative" onclick="event.stopPropagation()">${htmlContent}</div>`;
      root.onclick = closeModal;
      if (window.lucide) lucide.createIcons();
    }
    function closeModal() { const root = document.getElementById('modalRoot'); root.className = 'hidden'; root.innerHTML = ''; root.onclick = null; }

    /* =========================================================================
       7. LIVE TIMER LOOP
    ========================================================================= */
    let timerInterval = null;
    function startGlobalTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        let changed = false;
        for (const folder of state.folders) {
          for (const task of folder.tasks) {
            if (task.running) {
              if (task.remainingSec > 0) {
                task.remainingSec -= 1; task.runningSince = Date.now(); changed = true;
                const el = document.querySelector(`[data-timer-display="${task.id}"]`);
                if (el) el.textContent = formatTimer(task.remainingSec);
                const bar = document.querySelector(`[data-timer-bar="${task.id}"]`);
                if (bar && task.durationMin > 0) bar.style.width = Math.min(100, Math.max(0, ((task.durationMin * 60 - task.remainingSec) / (task.durationMin * 60)) * 100)) + '%';
              }
              if (task.remainingSec <= 0) {
                task.running = false; playChime(); showToast(`${t('toastTimerDone')} ${task.title}`); changed = true; renderAll();
              }
            }
          }
        }
        if (changed) saveState();
      }, 1000);
    }

        memberSearchQuery = e.target.value; renderTeamTab(container, folder);
        const inp = document.getElementById('memberSearchInput');
        if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
        if (window.lucide) lucide.createIcons();
      });
      document.getElementById('memberRoleFilterSel').addEventListener('change', (e) => { memberRoleFilter = e.target.value; renderTeamTab(container, folder); if (window.lucide) lucide.createIcons(); });
      document.getElementById('memberLevelFilterSel').addEventListener('change', (e) => { memberLevelFilter = e.target.value; renderTeamTab(container, folder); if (window.lucide) lucide.createIcons(); });
      const mcBtn = document.getElementById('manageColsBtn'); if (mcBtn) mcBtn.addEventListener('click', openCustomColumnsModal);
      const amBtn = document.getElementById('addMemberBtn'); if (amBtn) amBtn.addEventListener('click', () => openMemberModal(null));
      const ambBtn = document.getElementById('addMemberBottomBtn'); if (ambBtn) ambBtn.addEventListener('click', () => openMemberModal(null));
      container.querySelectorAll('[data-edit-member]').forEach(btn => btn.addEventListener('click', () => openMemberModal(btn.dataset.editMember)));
      container.querySelectorAll('[data-delete-member]').forEach(btn => {
        btn.addEventListener('click', () => {
          const m = folder.members.find(x => x.id === btn.dataset.deleteMember);
          if (!m) return;
          confirmDelete(`Удалить участника «${m.name}»?`, () => { folder.members = folder.members.filter(x => x.id !== m.id); folder.tasks.forEach(tk => { if (tk.assigneeId === m.id) tk.assigneeId = ''; }); saveState(); renderAll(); });
        });
      });
      container.querySelectorAll('[data-move-member]').forEach(btn => {
        btn.addEventListener('click', () => {
          const sorted = [...folder.members].sort((a, b) => a.order - b.order);
          const idx = sorted.findIndex(x => x.id === btn.dataset.moveMember);
          const swapIdx = idx + Number(btn.dataset.dir);
          if (swapIdx >= 0 && swapIdx < sorted.length) {
            const tmp = sorted[idx].order; sorted[idx].order = sorted[swapIdx].order; sorted[swapIdx].order = tmp;
            saveState(); renderTeamTab(container, folder); if (window.lucide) lucide.createIcons();
          }
        });
      });
      container.querySelectorAll('[data-zoom-photo]').forEach(img => {
        img.addEventListener('click', () => {
          const m = folder.members.find(x => x.id === img.dataset.zoomPhoto);
          if (!m || !m.photo) return;
          openModal(`<div class="space-y-3 text-center"><img src="${m.photo}" alt="${escapeHtml(m.name)}" class="max-h-[65vh] mx-auto rounded-xl object-contain" /><div class="font-bold text-base">${escapeHtml(m.name)}</div><button id="closeZoomBtn" class="px-4 py-1.5 rounded-lg card text-xs">${t('closeBtn')}</button></div>`);
          document.getElementById('closeZoomBtn').addEventListener('click', closeModal);
        });
      });
    }

    function openCustomColumnsModal() {
      const folder = getActiveFolder();
      const isDir = state.roleMode === 'director';
      openModal(`
        <div class="space-y-4">
          <h3 class="font-bold text-base">${t('colsModalTitle')}</h3>
          <p class="text-xs" style="color: var(--text-muted);">${t('colsModalDesc')}</p>
          <form id="addColForm" class="flex flex-wrap gap-2">
            <input id="newColLabel" required class="flex-1 min-w-[160px]" placeholder="${t('colNamePlaceholder')}" />
            <select id="newColType">
              <option value="link">🔗 ${t('colTypeLink')}</option>
              <option value="text">📝 ${t('colTypeText')}</option>
            </select>
            <button type="submit" class="btn-accent px-3.5 py-2 rounded-lg text-xs font-semibold">${t('addColBtn')}</button>
          </form>
          <div class="space-y-1.5 max-h-52 overflow-y-auto">
            ${(folder.customColumns || []).length === 0 ? `<div class="text-xs opacity-60 text-center py-4">—</div>` : folder.customColumns.map(col => `
              <div class="card px-3 py-2 rounded-xl flex items-center justify-between text-xs">
                <div><span class="font-semibold">${escapeHtml(col.label)}</span> <span class="opacity-60">(${col.type === 'link' ? t('colTypeLink') : t('colTypeText')})</span></div>
                ${isDir ? `<button type="button" data-del-col="${col.id}" class="text-red-400 hover:opacity-80"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>` : ''}
              </div>
            `).join('')}
          </div>
          <div class="flex justify-end"><button id="closeColsBtn" class="px-4 py-1.5 rounded-lg card text-xs">${t('closeBtn')}</button></div>
        </div>
      `);
      document.getElementById('closeColsBtn').addEventListener('click', closeModal);
      document.getElementById('addColForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const label = document.getElementById('newColLabel').value.trim();
        const type = document.getElementById('newColType').value;
        if (!label) return;
        folder.customColumns.push({ id: uid('col'), label, type });
        saveState(); renderAll(); openCustomColumnsModal();
      });
      document.querySelectorAll('[data-del-col]').forEach(btn => {
        btn.addEventListener('click', () => {
          const cid = btn.dataset.delCol;
          folder.customColumns = folder.customColumns.filter(c => c.id !== cid);
          saveState(); renderAll(); openCustomColumnsModal();
        });
      });
    }

    function openMemberModal(memberId) {
      const folder = getActiveFolder();
      const existing = memberId ? folder.members.find(m => m.id === memberId) : null;
      const nextOrder = folder.members.length ? Math.max(...folder.members.map(m => m.order || 0)) + 1 : 1;
      let selectedRoles = existing ? [...(existing.roles || [])] : ['Артовик'];
      let currentPhoto = existing ? (existing.photo || '') : '';

      function renderRoleChips() {
        const all = Array.from(new Set([...PRESET_ROLES, ...selectedRoles]));
        const box = document.getElementById('roleChipsBox');
        if (!box) return;
        box.innerHTML = all.map(r => {
          const on = selectedRoles.includes(r);
          return `<button type="button" data-toggle-role="${escapeHtml(r)}" class="px-2.5 py-1 rounded-lg text-xs border transition-all ${on ? 'accent-pill font-semibold' : 'card opacity-75'}">${on ? '✓ ' : '+ '}${escapeHtml(r)}</button>`;
        }).join('');
        box.querySelectorAll('[data-toggle-role]').forEach(b => b.addEventListener('click', () => {
          const r = b.dataset.toggleRole;
          if (selectedRoles.includes(r)) selectedRoles = selectedRoles.filter(x => x !== r); else selectedRoles.push(r);
          renderRoleChips();
        }));
      }

      openModal(`
        <form id="memberForm" class="space-y-3.5">
          <h3 class="font-bold text-base">${existing ? t('memberModalTitleEdit') : t('memberModalTitleAdd')}</h3>
          <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
            <div class="sm:col-span-3"><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('fullNameLabel')} *</label><input id="memName" required class="w-full" value="${escapeHtml(existing ? existing.name : '')}" placeholder="Фамилия Имя" /></div>
            <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('orderLabel')}</label><input id="memOrder" type="number" min="1" class="w-full" value="${existing ? existing.order : nextOrder}" /></div>
          </div>
          <div><label class="block text-xs mb-1.5" style="color: var(--text-muted);">${t('rolesLabel')}</label><div id="roleChipsBox" class="flex flex-wrap gap-1.5 mb-2"></div><div class="flex gap-2"><input id="customRoleInput" type="text" class="flex-1" placeholder="${t('customRolePlaceholder')}" /><button type="button" id="addCustomRoleBtn" class="px-3 py-1.5 rounded-lg card text-xs">+ OK</button></div></div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('levelLabel')}</label><select id="memLevel" class="w-full">${SKILL_LEVELS.map(lv => `<option value="${lv.id}" ${(existing ? existing.level : 'middle') === lv.id ? 'selected' : ''}>${state.lang === 'ru' ? lv.ru : lv.en}</option>`).join('')}</select></div>
            <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('phoneLabel')}</label><input id="memPhone" type="tel" class="w-full" value="${escapeHtml(existing ? existing.phone : '')}" placeholder="+996 ..." /></div>
          </div>
          <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('expYearsLabel')}</label><input id="memExp" class="w-full" value="${escapeHtml(existing ? existing.expText : '')}" placeholder="Например: 2 года, 3D / Программирование" /></div>
          ${(folder.customColumns || []).length > 0 ? `
            <div class="pt-2 border-t space-y-2.5" style="border-color: var(--border-color);">
              <div class="text-xs font-semibold" style="color: var(--text-muted);">${t('customFieldsHeader')}</div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                ${folder.customColumns.map(col => `
                  <div>
                    <label class="block text-[11px] mb-1" style="color: var(--text-muted);">${escapeHtml(col.label)}</label>
                    <input data-custom-col-input="${col.id}" type="${col.type === 'link' ? 'url' : 'text'}" class="w-full" value="${escapeHtml(existing && existing.customFields ? (existing.customFields[col.id] || '') : '')}" placeholder="${col.type === 'link' ? 'https://...' : ''}" />
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
          <div>
            <label class="block text-xs mb-1.5" style="color: var(--text-muted);">${t('photoLabel')}</label>
            <div class="flex items-center gap-3">
              <div id="photoPreviewBox" class="w-14 h-14 rounded-xl border flex items-center justify-center overflow-hidden shrink-0" style="border-color: var(--border-color); background: rgba(0,0,0,0.3);">${currentPhoto ? `<img src="${currentPhoto}" class="w-full h-full object-cover" />` : `<i data-lucide="camera" class="w-5 h-5 opacity-50"></i>`}</div>
              <div class="flex flex-wrap gap-2"><label class="px-3 py-1.5 rounded-lg card text-xs cursor-pointer">${t('uploadPhoto')}<input id="memPhotoInput" type="file" accept="image/*" class="hidden" /></label><button type="button" id="removePhotoBtn" class="px-3 py-1.5 rounded-lg card text-xs text-red-400">${t('removePhoto')}</button></div>
            </div>
          </div>
          <div class="flex justify-end gap-2 pt-3 border-t" style="border-color: var(--border-color);"><button type="button" id="cancelMemBtn" class="px-4 py-2 rounded-lg card text-xs">${t('cancelBtn')}</button><button type="submit" class="btn-accent px-4 py-2 rounded-lg text-xs font-semibold">${t('saveBtn')}</button></div>
        </form>
      `);
      renderRoleChips();
      const addCustom = () => { const inp = document.getElementById('customRoleInput'); const val = inp.value.trim(); if (val && !selectedRoles.includes(val)) { selectedRoles.push(val); inp.value = ''; renderRoleChips(); } };
      document.getElementById('addCustomRoleBtn').addEventListener('click', addCustom);
      document.getElementById('customRoleInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addCustom(); } });
      document.getElementById('memPhotoInput').addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const c = document.createElement('canvas'); const scale = Math.min(1, 240 / Math.max(img.width, img.height));
            c.width = img.width * scale; c.height = img.height * scale; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            currentPhoto = c.toDataURL('image/jpeg', 0.82); document.getElementById('photoPreviewBox').innerHTML = `<img src="${currentPhoto}" class="w-full h-full object-cover" />`;
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
      document.getElementById('removePhotoBtn').addEventListener('click', () => { currentPhoto = ''; document.getElementById('photoPreviewBox').innerHTML = `<i data-lucide="camera" class="w-5 h-5 opacity-50"></i>`; if (window.lucide) lucide.createIcons(); });
      document.getElementById('cancelMemBtn').addEventListener('click', closeModal);
      document.getElementById('memberForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const customFields = {};
        document.querySelectorAll('[data-custom-col-input]').forEach(inp => { customFields[inp.dataset.customColInput] = inp.value.trim(); });
        const data = { id: existing ? existing.id : uid('mem'), order: Math.max(1, Number(document.getElementById('memOrder').value) || nextOrder), name: document.getElementById('memName').value.trim(), roles: selectedRoles.length ? selectedRoles : ['Участник'], level: document.getElementById('memLevel').value, expText: document.getElementById('memExp').value.trim(), phone: document.getElementById('memPhone').value.trim(), photo: currentPhoto, customFields };
        if (existing) Object.assign(existing, data); else folder.members.push(data);
        saveState(); closeModal(); renderAll(); showToast(t('toastSaved'));
      });
    }

    /* =========================================================================
       11. TAB 2: TASKS & DAILY SCHEDULE (WITH VICTORY CELEBRATIONS)
    ========================================================================= */
    function renderTasksTab(container, folder) {
      ensureFolderDays(folder);
      const canManage = sessionAccessMode === 'director';
      const canExecute = sessionAccessMode === 'director' || sessionAccessMode === 'work';
      const isDir = canManage && state.roleMode === 'director';
      const sortedMembers = [...folder.members].sort((a, b) => a.order - b.order);
      const dayScoped = folder.activeDayId === 'all'
        ? folder.tasks
        : folder.tasks.filter(tk => tk.dayId === folder.activeDayId);
      const filtered = dayScoped.filter(tk => {
        if (state.taskFilterMemberId === 'all') return true;
        if (state.taskFilterMemberId === 'team') return tk.type === 'team';
        if (state.taskFilterMemberId === 'rest') return tk.type === 'rest';
        return tk.assigneeId === state.taskFilterMemberId;
      });

      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex flex-wrap items-center gap-1 panel p-1 rounded-xl">
              <button id="viewTodayBtn" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${state.taskViewMode === 'today' ? 'accent-pill' : ''}">🕒 ${t('viewToday')}</button>
              <button id="viewAssignBtn" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${state.taskViewMode === 'assign' ? 'accent-pill' : ''}">👥 ${t('viewAssign')}</button>
              <button id="viewMsBtn" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${state.taskViewMode === 'milestones' ? 'accent-pill' : ''}">🚩 ${t('viewByMilestone')}</button>
            </div>
            ${canManage ? `<div class="flex flex-wrap items-center gap-2">
              <button id="quickBreakBtn" class="px-3 py-2 rounded-xl text-xs font-semibold card text-emerald-300 border-emerald-500/30 flex items-center gap-1"><i data-lucide="coffee" class="w-3.5 h-3.5"></i> <span>${t('addBreak')}</span></button>
              <button id="addTaskBtn" class="btn-accent px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold flex items-center gap-1.5"><i data-lucide="plus" class="w-4 h-4"></i> <span>${t('addTask')}</span></button>
            </div>` : ''}
          </div>

          <!-- Day Switcher Bar (Day 1, Day 2, + New Day, Carry Over) -->
          <div class="panel rounded-2xl p-3 flex flex-wrap items-center justify-between gap-2">
            <div class="flex flex-wrap items-center gap-1.5">
              ${folder.days.map(d => {
                const dTasks = folder.tasks.filter(tk => tk.dayId === d.id);
                const dDone = dTasks.filter(tk => tk.status === 'done').length;
                const active = folder.activeDayId === d.id;
                return `<button type="button" data-select-day="${d.id}" class="px-3 py-1.5 rounded-xl text-xs font-semibold border transition-all flex items-center gap-1.5 ${active ? 'accent-pill' : 'card'}">
                  <span>📅 ${escapeHtml(d.title)}</span>
                  <span class="text-[10px] px-1.5 rounded bg-black/25">${dDone}/${dTasks.length}</span>
                </button>`;
              }).join('')}
              <button type="button" data-select-day="all" class="px-3 py-1.5 rounded-xl text-xs font-semibold border ${folder.activeDayId === 'all' ? 'accent-pill' : 'card'}">🗂 ${t('allDaysOption')}</button>
              ${canManage ? `<button type="button" id="addNewDayBtn" class="px-3 py-1.5 rounded-xl text-xs font-bold btn-accent">${t('newDayBtn')}</button>` : ''}
            </div>
            ${canManage && folder.activeDayId !== 'all' ? `
              <button type="button" id="carryOverDayBtn" class="px-3 py-1.5 rounded-xl text-xs font-semibold card flex items-center gap-1" title="Перенести невыполненные задачи в следующий день">
                <i data-lucide="corner-down-right" class="w-3.5 h-3.5" style="color: var(--accent);"></i>
                <span>${t('carryOverBtn')}</span>
              </button>
            ` : ''}
          </div>

          <div class="panel rounded-2xl p-3 space-y-2">
            <div class="text-[11px] font-semibold uppercase tracking-wider" style="color: var(--text-muted);">${t('membersStripTitle')}</div>
            <div class="flex flex-wrap gap-2">
              <button class="px-3 py-2 rounded-xl text-xs font-medium border ${state.taskFilterMemberId === 'all' ? 'accent-pill' : 'card'}" data-filter-target="all">📋 ${t('allTasksFilter')} (${folder.tasks.length})</button>
              <button class="px-3 py-2 rounded-xl text-xs font-medium border ${state.taskFilterMemberId === 'team' ? 'accent-pill' : 'card'}" data-filter-target="team" data-drop-type="team">🤝 ${t('teamTasksFilter')} (${folder.tasks.filter(x => x.type === 'team').length})</button>
              <button class="px-3 py-2 rounded-xl text-xs font-medium border ${state.taskFilterMemberId === 'rest' ? 'accent-pill' : 'card'}" data-filter-target="rest" data-drop-type="rest">☕ ${t('restTasksFilter')} (${folder.tasks.filter(x => x.type === 'rest').length})</button>
              ${sortedMembers.map(m => {
                const dayTasksForM = dayScoped.filter(x => x.assigneeId === m.id && x.status !== 'done');
                const count = dayTasksForM.length;
                const mins = dayTasksForM.reduce((s, x) => s + (Number(x.durationMin) || 30), 0);
                const cap = LEVEL_DAILY_CAP_MIN[m.level] || 300;
                const loadDot = mins > cap ? '🔴' : mins > cap * 0.7 ? '🟡' : '🟢';
                const active = state.taskFilterMemberId === m.id;
                return `<div class="px-3 py-1.5 rounded-xl cursor-pointer border transition-all ${active ? 'accent-pill' : 'card'}" data-filter-target="${m.id}" data-drop-member="${m.id}"><div class="text-xs font-semibold flex items-center gap-1.5"><span>${escapeHtml(m.name)}</span><span class="text-[10px] px-1.5 rounded bg-white/10">${loadDot} ${count} (${mins}${t('minUnit')})</span></div><div class="text-[10px] truncate max-w-[205px]" style="color: var(--text-muted);">${(m.roles || []).join(' • ')}</div></div>`;
              }).join('')}
            </div>
          </div>

          ${state.taskViewMode === 'today' ? renderTodayTimelineHTML(folder, filtered, isDir) : state.taskViewMode === 'milestones' ? renderByMilestoneHTML(folder, filtered, sortedMembers, isDir) : renderTaskCardsHTML(folder, filtered, sortedMembers, isDir)}
        </div>
      `;

      document.getElementById('viewTodayBtn').addEventListener('click', () => { state.taskViewMode = 'today'; saveState(); renderTasksTab(container, folder); if (window.lucide) lucide.createIcons(); });
      document.getElementById('viewAssignBtn').addEventListener('click', () => { state.taskViewMode = 'assign'; saveState(); renderTasksTab(container, folder); if (window.lucide) lucide.createIcons(); });
      document.getElementById('viewMsBtn').addEventListener('click', () => { state.taskViewMode = 'milestones'; saveState(); renderTasksTab(container, folder); if (window.lucide) lucide.createIcons(); });
      const atBtn = document.getElementById('addTaskBtn'); if (atBtn) atBtn.addEventListener('click', () => openTaskModal(null, null));
      container.querySelectorAll('[data-select-day]').forEach(btn => {
        btn.addEventListener('click', () => {
          folder.activeDayId = btn.dataset.selectDay;
          saveState(); renderTasksTab(container, folder); if (window.lucide) lucide.createIcons();
        });
      });
      const andBtn = document.getElementById('addNewDayBtn'); if (andBtn) andBtn.addEventListener('click', () => {
        const nextNum = folder.days.length ? Math.max(...folder.days.map(d => d.num || 0)) + 1 : 1;
        const newDay = { id: uid('day'), num: nextNum, title: `${t('dayLabel')} ${nextNum}`, date: new Date().toISOString().slice(0, 10) };
        folder.days.push(newDay);
        folder.activeDayId = newDay.id;
        saveState(); renderAll(); showToast(`📅 ${newDay.title}`);
      });
      const carryBtn = document.getElementById('carryOverDayBtn');
      if (carryBtn) {
        carryBtn.addEventListener('click', () => {
          const unfinished = folder.tasks.filter(tk => tk.dayId === folder.activeDayId && tk.status !== 'done' && tk.type !== 'rest');
          if (unfinished.length === 0) { showToast(t('carryOverNone')); return; }
          const curIdx = folder.days.findIndex(d => d.id === folder.activeDayId);
          let targetDay = folder.days[curIdx + 1];
          if (!targetDay) {
            const nextNum = Math.max(...folder.days.map(d => d.num || 0)) + 1;
            targetDay = { id: uid('day'), num: nextNum, title: `${t('dayLabel')} ${nextNum}`, date: new Date().toISOString().slice(0, 10) };
            folder.days.push(targetDay);
          }
          unfinished.forEach(tk => { tk.dayId = targetDay.id; });
          folder.activeDayId = targetDay.id;
          saveState(); renderAll();
          showToast(`${t('carryOverDone')} ${targetDay.title} (${unfinished.length})`);
        });
      }
      const qbBtn = document.getElementById('quickBreakBtn'); if (qbBtn) qbBtn.addEventListener('click', () => {
        const targetDayId = folder.activeDayId === 'all' ? folder.days[folder.days.length - 1].id : folder.activeDayId;
        folder.tasks.push({ id: uid('t'), title: state.lang === 'ru' ? 'Перерыв / Отдых 30 минут' : 'Team Break / 30m Rest', description: state.lang === 'ru' ? 'Отдых от экрана и восстановление сил.' : 'Rest away from screens.', type: 'rest', assigneeId: '', status: 'todo', durationMin: 30, remainingSec: 1800, running: false, timeSlot: '15:00 - 15:30', milestoneId: '', dayId: targetDayId, onRoadmap: false, isToday: true });
        saveState(); renderAll(); showToast(t('toastSaved'));
      });
      bindTaskInteractions(container, folder);
    }

    function renderTodayTimelineHTML(folder, tasks, isDir) {
      const todayTasks = tasks.filter(tk => tk.isToday !== false).sort((a, b) => (a.timeSlot || '99:99').localeCompare(b.timeSlot || '99:99'));
      if (todayTasks.length === 0) return `<div class="panel rounded-2xl p-10 text-center text-sm" style="color: var(--text-muted);">${t('todayEmpty')}</div>`;
      return `<div class="panel rounded-2xl p-4 space-y-2.5">${todayTasks.map(tk => {
        const mem = folder.members.find(m => m.id === tk.assigneeId);
        const ms = folder.milestones.find(m => m.id === tk.milestoneId);
        const borderCol = tk.type === 'rest' ? '#10b981' : tk.type === 'team' ? '#6366f1' : 'var(--accent)';
        return `<div draggable="true" data-drag-task="${tk.id}" class="card rounded-xl p-3.5 flex flex-wrap items-center justify-between gap-3 border-l-4 cursor-grab" style="border-left-color:${borderCol};">
          <div class="flex items-center gap-3 min-w-0 flex-1">
            <div class="font-mono text-xs font-bold px-2.5 py-1.5 rounded-lg bg-black/30 shrink-0 min-w-[110px] text-center">${escapeHtml(tk.timeSlot || 'Весь день')}</div>
            <div class="min-w-0 flex-1">

    function renderByMilestoneHTML(folder, tasks, sortedMembers, isDir) {
      const groups = [
        ...folder.milestones.map(ms => ({ id: ms.id, title: '🚩 ' + ms.title, items: tasks.filter(tk => tk.milestoneId === ms.id) })),
        { id: '', title: '📌 ' + t('noMilestone'), items: tasks.filter(tk => !tk.milestoneId) }
      ];
      return `<div class="space-y-4">${groups.map(g => `<div class="panel rounded-2xl p-4 space-y-3"><div class="flex items-center justify-between gap-2"><div class="font-bold text-sm flex items-center gap-2"><span>${escapeHtml(g.title)}</span><span class="text-xs px-2 py-0.5 rounded bg-white/10">${g.items.length}</span></div>${g.id ? `<button data-add-task-ms="${g.id}" class="px-2.5 py-1 rounded-lg card text-xs font-semibold">${t('addTaskToStage')}</button>` : ''}</div>${g.items.length === 0 ? `<div class="text-xs opacity-60">${t('noTasksYet')}</div>` : renderTaskCardsHTML(folder, g.items, sortedMembers, isDir)}</div>`).join('')}</div>`;
    }

    function renderTaskCardsHTML(folder, tasks, sortedMembers, isDir) {

        const totalSec = Math.max(1, (tk.durationMin || 30) * 60);
        const pct = Math.min(100, Math.max(0, ((totalSec - (tk.remainingSec || 0)) / totalSec) * 100));
        const stMap = { todo: { label: t('statusTodo'), cls: 'bg-slate-500/20 text-slate-300 border-slate-500/30' }, in_progress: { label: t('statusProgress'), cls: 'bg-amber-500/20 text-amber-300 border-amber-500/30' }, done: { label: t('statusDone'), cls: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30' } };
        const st = stMap[tk.status] || stMap.todo;

        return `<div draggable="true" data-drag-task="${tk.id}" class="card rounded-2xl p-4 flex flex-col justify-between gap-3 cursor-grab ${tk.status === 'done' ? 'opacity-75' : ''}">
