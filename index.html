                <input id="memberSearchInput" type="text" value="${escapeHtml(memberSearchQuery)}" placeholder="${t('searchMemberPlaceholder')}" class="w-full pl-9" />
              </div>
              <select id="memberRoleFilterSel">
                <option value="all">${t('allRoles')}</option>
                ${allRoles.map(r => `<option value="${escapeHtml(r)}" ${memberRoleFilter === r ? 'selected' : ''}>${escapeHtml(r)}</option>`).join('')}
              </select>
              <select id="memberLevelFilterSel">
                <option value="all">${t('allLevels')}</option>
                ${SKILL_LEVELS.map(lv => `<option value="${lv.id}" ${memberLevelFilter === lv.id ? 'selected' : ''}>${state.lang === 'ru' ? lv.ru : lv.en}</option>`).join('')}
              </select>
            </div>
            <button id="addMemberBtn" class="btn-accent px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold flex items-center gap-1.5">
              <i data-lucide="user-plus" class="w-4 h-4"></i> <span>${t('addMember')}</span>
            </button>
          </div>

          <div class="panel rounded-2xl overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse min-w-[720px]">
                <thead>
                  <tr class="text-[11px] uppercase tracking-wider border-b" style="border-color: var(--border-color); color: var(--text-muted); background: rgba(0,0,0,0.24);">
                    <th class="py-3 px-3 w-16">${t('orderCol')}</th>
                    <th class="py-3 px-3 w-16">${t('photoCol')}</th>
                    <th class="py-3 px-3">${t('nameCol')}</th>
                    <th class="py-3 px-3">${t('rolesCol')}</th>
                    <th class="py-3 px-3">${t('skillCol')}</th>
                    <th class="py-3 px-3">${t('phoneCol')}</th>
                    <th class="py-3 px-3 text-right">${t('actionsCol')}</th>
                  </tr>
                </thead>
                <tbody class="divide-y" style="border-color: var(--border-color);">
                  ${filtered.length === 0 ? `<tr><td colspan="7" class="py-10 text-center text-sm" style="color: var(--text-muted);">${t('noMembers')}</td></tr>` : filtered.map(m => {
                    const lv = SKILL_LEVELS.find(x => x.id === m.level) || SKILL_LEVELS[2];
                    const stars = '★'.repeat(lv.stars) + '☆'.repeat(5 - lv.stars);
                    const initials = (m.name || '?').split(' ').map(s => s[0]).join('').slice(0, 2).toUpperCase();
                    return `
                      <tr class="hover:bg-white/[0.03] transition-colors">
                        <td class="py-3 px-3 font-mono font-bold text-sm">
                          <div class="flex items-center gap-1">
                            <span>#${m.order}</span>
                            <div class="flex flex-col">
                              <button class="opacity-60 hover:opacity-100 leading-none" data-move-member="${m.id}" data-dir="-1">▲</button>
                              <button class="opacity-60 hover:opacity-100 leading-none" data-move-member="${m.id}" data-dir="1">▼</button>
                            </div>
                          </div>
                        </td>
                        <td class="py-3 px-3">
                          ${m.photo ? `<img src="${m.photo}" alt="${escapeHtml(m.name)}" class="w-11 h-11 rounded-xl object-cover border cursor-pointer" style="border-color: var(--accent);" data-zoom-photo="${m.id}" />` : `<div class="w-11 h-11 rounded-xl flex items-center justify-center font-bold text-sm border" style="background: var(--accent-soft); border-color: var(--border-color);">${escapeHtml(initials)}</div>`}
                        </td>
                        <td class="py-3 px-3">
                          <div class="font-semibold text-sm">${escapeHtml(m.name)}</div>
                          <div class="text-[11px]" style="color: var(--text-muted);">${folder.tasks.filter(tk => tk.assigneeId === m.id && tk.status !== 'done').length} активн.</div>
                        </td>
                        <td class="py-3 px-3"><div class="flex flex-wrap gap-1">${(m.roles || []).map(r => `<span class="text-[11px] px-2 py-0.5 rounded-md accent-pill">${escapeHtml(r)}</span>`).join('')}</div></td>
                        <td class="py-3 px-3">
                          <div class="text-xs font-semibold" style="color:${lv.color}">${state.lang === 'ru' ? lv.ru : lv.en}</div>
                          <div class="text-[11px]" style="color:${lv.color}">${stars}</div>
                          ${m.expText ? `<div class="text-[11px] mt-0.5" style="color: var(--text-muted);">${escapeHtml(m.expText)}</div>` : ''}
                        </td>
                        <td class="py-3 px-3">${m.phone ? `<a href="tel:${escapeHtml(m.phone.replace(/\s+/g,''))}" class="text-xs font-mono hover:underline flex items-center gap-1 text-emerald-300"><i data-lucide="phone" class="w-3.5 h-3.5"></i> ${escapeHtml(m.phone)}</a>` : '<span class="text-xs opacity-40">—</span>'}</td>
                        <td class="py-3 px-3 text-right">
                          <div class="inline-flex items-center gap-1">
                            <button class="p-1.5 rounded-lg card" data-edit-member="${m.id}" title="${t('edit')}"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
                            ${isDir ? `<button class="p-1.5 rounded-lg card text-red-400 hover:bg-red-500/20" data-delete-member="${m.id}" title="${t('del')}"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>` : ''}
                          </div>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
            <div class="p-3 border-t flex flex-wrap items-center justify-between gap-2" style="border-color: var(--border-color); background: rgba(0,0,0,0.18);">
              <span class="text-xs" style="color: var(--text-muted);">👥 ${folder.members.length} · ${t('quickAddMemberHint')}</span>
              <button id="addMemberBottomBtn" class="px-3 py-1.5 rounded-lg card text-xs font-semibold flex items-center gap-1"><i data-lucide="plus" class="w-3.5 h-3.5" style="color: var(--accent);"></i> ${t('addMember')}</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('memberSearchInput').addEventListener('input', (e) => {
        memberSearchQuery = e.target.value; renderTeamTab(container, folder);
        const inp = document.getElementById('memberSearchInput');
        if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
        if (window.lucide) lucide.createIcons();
      });
      document.getElementById('memberRoleFilterSel').addEventListener('change', (e) => { memberRoleFilter = e.target.value; renderTeamTab(container, folder); if (window.lucide) lucide.createIcons(); });
      document.getElementById('memberLevelFilterSel').addEventListener('change', (e) => { memberLevelFilter = e.target.value; renderTeamTab(container, folder); if (window.lucide) lucide.createIcons(); });
      document.getElementById('addMemberBtn').addEventListener('click', () => openMemberModal(null));
      document.getElementById('addMemberBottomBtn').addEventListener('click', () => openMemberModal(null));
      container.querySelectorAll('[data-edit-member]').forEach(btn => btn.addEventListener('click', () => openMemberModal(btn.dataset.editMember)));
      container.querySelectorAll('[data-delete-member]').forEach(btn => {
        btn.addEventListener('click', () => {
          const m = folder.members.find(x => x.id === btn.dataset.deleteMember);
          if (!m) return;
          confirmDelete(`Удалить участника «${m.name}»?`, () => {
            folder.members = folder.members.filter(x => x.id !== m.id);
            folder.tasks.forEach(tk => { if (tk.assigneeId === m.id) tk.assigneeId = ''; });
            saveState(); renderAll();
          });
        });
      });
      container.querySelectorAll('[data-move-member]').forEach(btn => {
        btn.addEventListener('click', () => {
          const sorted = [...folder.members].sort((a, b) => a.order - b.order);
          const idx = sorted.findIndex(x => x.id === btn.dataset.moveMember);
          const swapIdx = idx + Number(btn.dataset.dir);
          if (swapIdx >= 0 && swapIdx < sorted.length) {
            const tmp = sorted[idx].order; sorted[idx].order = sorted[swapIdx].order; sorted[swapIdx].order = tmp;
            saveState(); renderTeamTab(container, folder); if (window.lucide) lucide.createIcons();
          }
        });
      });
      container.querySelectorAll('[data-zoom-photo]').forEach(img => {
        img.addEventListener('click', () => {
          const m = folder.members.find(x => x.id === img.dataset.zoomPhoto);
          if (!m || !m.photo) return;
          openModal(`<div class="space-y-3 text-center"><img src="${m.photo}" alt="${escapeHtml(m.name)}" class="max-h-[65vh] mx-auto rounded-xl object-contain" /><div class="font-bold text-base">${escapeHtml(m.name)}</div><button id="closeZoomBtn" class="px-4 py-1.5 rounded-lg card text-xs">${t('closeBtn')}</button></div>`);
          document.getElementById('closeZoomBtn').addEventListener('click', closeModal);
        });
      });
    }

    function openMemberModal(memberId) {
      const folder = getActiveFolder();
      const existing = memberId ? folder.members.find(m => m.id === memberId) : null;
      const nextOrder = folder.members.length ? Math.max(...folder.members.map(m => m.order || 0)) + 1 : 1;
      let selectedRoles = existing ? [...(existing.roles || [])] : ['Артовик'];
      let currentPhoto = existing ? (existing.photo || '') : '';

      function renderRoleChips() {
        const all = Array.from(new Set([...PRESET_ROLES, ...selectedRoles]));
        const box = document.getElementById('roleChipsBox');
        if (!box) return;
        box.innerHTML = all.map(r => {
          const on = selectedRoles.includes(r);
          return `<button type="button" data-toggle-role="${escapeHtml(r)}" class="px-2.5 py-1 rounded-lg text-xs border transition-all ${on ? 'accent-pill font-semibold' : 'card opacity-75'}">${on ? '✓ ' : '+ '}${escapeHtml(r)}</button>`;
        }).join('');
        box.querySelectorAll('[data-toggle-role]').forEach(b => {
          b.addEventListener('click', () => {
            const r = b.dataset.toggleRole;
            if (selectedRoles.includes(r)) selectedRoles = selectedRoles.filter(x => x !== r);
            else selectedRoles.push(r);
            renderRoleChips();
          });
        });
      }

      openModal(`
        <form id="memberForm" class="space-y-3.5">
          <h3 class="font-bold text-base">${existing ? t('memberModalTitleEdit') : t('memberModalTitleAdd')}</h3>
          <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
            <div class="sm:col-span-3"><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('fullNameLabel')} *</label><input id="memName" required class="w-full" value="${escapeHtml(existing ? existing.name : '')}" placeholder="Фамилия Имя" /></div>
            <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('orderLabel')}</label><input id="memOrder" type="number" min="1" class="w-full" value="${existing ? existing.order : nextOrder}" /></div>
          </div>
          <div>
            <label class="block text-xs mb-1.5" style="color: var(--text-muted);">${t('rolesLabel')}</label>
            <div id="roleChipsBox" class="flex flex-wrap gap-1.5 mb-2"></div>
            <div class="flex gap-2"><input id="customRoleInput" type="text" class="flex-1" placeholder="${t('customRolePlaceholder')}" /><button type="button" id="addCustomRoleBtn" class="px-3 py-1.5 rounded-lg card text-xs">+ OK</button></div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('levelLabel')}</label><select id="memLevel" class="w-full">${SKILL_LEVELS.map(lv => `<option value="${lv.id}" ${(existing ? existing.level : 'middle') === lv.id ? 'selected' : ''}>${state.lang === 'ru' ? lv.ru : lv.en}</option>`).join('')}</select></div>
            <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('phoneLabel')}</label><input id="memPhone" type="tel" class="w-full" value="${escapeHtml(existing ? existing.phone : '')}" placeholder="+996 ..." /></div>
          </div>
          <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('expYearsLabel')}</label><input id="memExp" class="w-full" value="${escapeHtml(existing ? existing.expText : '')}" placeholder="Например: 2 года, 3D / Программирование" /></div>
          <div>
            <label class="block text-xs mb-1.5" style="color: var(--text-muted);">${t('photoLabel')}</label>
            <div class="flex items-center gap-3">
              <div id="photoPreviewBox" class="w-14 h-14 rounded-xl border flex items-center justify-center overflow-hidden shrink-0" style="border-color: var(--border-color); background: rgba(0,0,0,0.3);">${currentPhoto ? `<img src="${currentPhoto}" class="w-full h-full object-cover" />` : `<i data-lucide="camera" class="w-5 h-5 opacity-50"></i>`}</div>
              <div class="flex flex-wrap gap-2">
                <label class="px-3 py-1.5 rounded-lg card text-xs cursor-pointer">${t('uploadPhoto')}<input id="memPhotoInput" type="file" accept="image/*" class="hidden" /></label>
                <button type="button" id="removePhotoBtn" class="px-3 py-1.5 rounded-lg card text-xs text-red-400">${t('removePhoto')}</button>
              </div>
            </div>
          </div>
          <div class="flex justify-end gap-2 pt-3 border-t" style="border-color: var(--border-color);">
            <button type="button" id="cancelMemBtn" class="px-4 py-2 rounded-lg card text-xs">${t('cancelBtn')}</button>
            <button type="submit" class="btn-accent px-4 py-2 rounded-lg text-xs font-semibold">${t('saveBtn')}</button>
          </div>
        </form>
      `);
      renderRoleChips();
      const addCustom = () => {
        const inp = document.getElementById('customRoleInput');
        const val = inp.value.trim();
        if (val && !selectedRoles.includes(val)) { selectedRoles.push(val); inp.value = ''; renderRoleChips(); }
      };
      document.getElementById('addCustomRoleBtn').addEventListener('click', addCustom);
      document.getElementById('customRoleInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addCustom(); } });
      document.getElementById('memPhotoInput').addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const c = document.createElement('canvas');
            const scale = Math.min(1, 240 / Math.max(img.width, img.height));
            c.width = img.width * scale; c.height = img.height * scale;
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            currentPhoto = c.toDataURL('image/jpeg', 0.82);
            document.getElementById('photoPreviewBox').innerHTML = `<img src="${currentPhoto}" class="w-full h-full object-cover" />`;
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
      document.getElementById('removePhotoBtn').addEventListener('click', () => {
        currentPhoto = '';
        document.getElementById('photoPreviewBox').innerHTML = `<i data-lucide="camera" class="w-5 h-5 opacity-50"></i>`;
        if (window.lucide) lucide.createIcons();
      });
      document.getElementById('cancelMemBtn').addEventListener('click', closeModal);
      document.getElementById('memberForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const data = {
          id: existing ? existing.id : uid('mem'),
          order: Math.max(1, Number(document.getElementById('memOrder').value) || nextOrder),
          name: document.getElementById('memName').value.trim(),
          roles: selectedRoles.length ? selectedRoles : ['Участник'],
          level: document.getElementById('memLevel').value,
          expText: document.getElementById('memExp').value.trim(),
          phone: document.getElementById('memPhone').value.trim(),
          photo: currentPhoto
        };
        if (existing) Object.assign(existing, data);
        else folder.members.push(data);
        saveState(); closeModal(); renderAll(); showToast(t('toastSaved'));
      });
    }

    /* =========================================================================
       10. TAB 2: TASKS & DAILY SCHEDULE
    ========================================================================= */
    function renderTasksTab(container, folder) {
      const isDir = state.roleMode === 'director';
      const sortedMembers = [...folder.members].sort((a, b) => a.order - b.order);
      const filtered = folder.tasks.filter(tk => {
        if (state.taskFilterMemberId === 'all') return true;
        if (state.taskFilterMemberId === 'team') return tk.type === 'team';
        if (state.taskFilterMemberId === 'rest') return tk.type === 'rest';
        return tk.assigneeId === state.taskFilterMemberId;
      });

      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex flex-wrap items-center gap-1 panel p-1 rounded-xl">
              <button id="viewTodayBtn" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${state.taskViewMode === 'today' ? 'accent-pill' : ''}">🕒 ${t('viewToday')}</button>
              <button id="viewAssignBtn" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${state.taskViewMode === 'assign' ? 'accent-pill' : ''}">👥 ${t('viewAssign')}</button>
              <button id="viewMsBtn" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${state.taskViewMode === 'milestones' ? 'accent-pill' : ''}">🚩 ${t('viewByMilestone')}</button>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button id="quickBreakBtn" class="px-3 py-2 rounded-xl text-xs font-semibold card text-emerald-300 border-emerald-500/30 flex items-center gap-1"><i data-lucide="coffee" class="w-3.5 h-3.5"></i> <span>${t('addBreak')}</span></button>
              <button id="addTaskBtn" class="btn-accent px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold flex items-center gap-1.5"><i data-lucide="plus" class="w-4 h-4"></i> <span>${t('addTask')}</span></button>
            </div>
          </div>

          <div class="panel rounded-2xl p-3 space-y-2">
            <div class="text-[11px] font-semibold uppercase tracking-wider" style="color: var(--text-muted);">${t('membersStripTitle')}</div>
            <div class="flex flex-wrap gap-2">
              <button class="px-3 py-2 rounded-xl text-xs font-medium border ${state.taskFilterMemberId === 'all' ? 'accent-pill' : 'card'}" data-filter-target="all">📋 ${t('allTasksFilter')} (${folder.tasks.length})</button>
              <button class="px-3 py-2 rounded-xl text-xs font-medium border ${state.taskFilterMemberId === 'team' ? 'accent-pill' : 'card'}" data-filter-target="team" data-drop-type="team">🤝 ${t('teamTasksFilter')} (${folder.tasks.filter(x => x.type === 'team').length})</button>
              <button class="px-3 py-2 rounded-xl text-xs font-medium border ${state.taskFilterMemberId === 'rest' ? 'accent-pill' : 'card'}" data-filter-target="rest" data-drop-type="rest">☕ ${t('restTasksFilter')} (${folder.tasks.filter(x => x.type === 'rest').length})</button>
              ${sortedMembers.map(m => {
                const count = folder.tasks.filter(x => x.assigneeId === m.id && x.status !== 'done').length;
                const active = state.taskFilterMemberId === m.id;
                return `<div class="px-3 py-1.5 rounded-xl cursor-pointer border transition-all ${active ? 'accent-pill' : 'card'}" data-filter-target="${m.id}" data-drop-member="${m.id}"><div class="text-xs font-semibold flex items-center gap-1.5"><span>${escapeHtml(m.name)}</span><span class="text-[10px] px-1.5 rounded bg-white/10">${count}</span></div><div class="text-[10px] truncate max-w-[190px]" style="color: var(--text-muted);">${(m.roles || []).join(' • ')}</div></div>`;
              }).join('')}
            </div>
          </div>

          ${state.taskViewMode === 'today' ? renderTodayTimelineHTML(folder, filtered, isDir) : state.taskViewMode === 'milestones' ? renderByMilestoneHTML(folder, filtered, sortedMembers, isDir) : renderTaskCardsHTML(folder, filtered, sortedMembers, isDir)}
        </div>
      `;

      document.getElementById('viewTodayBtn').addEventListener('click', () => { state.taskViewMode = 'today'; saveState(); renderTasksTab(container, folder); if (window.lucide) lucide.createIcons(); });
      document.getElementById('viewAssignBtn').addEventListener('click', () => { state.taskViewMode = 'assign'; saveState(); renderTasksTab(container, folder); if (window.lucide) lucide.createIcons(); });
      document.getElementById('viewMsBtn').addEventListener('click', () => { state.taskViewMode = 'milestones'; saveState(); renderTasksTab(container, folder); if (window.lucide) lucide.createIcons(); });
      document.getElementById('addTaskBtn').addEventListener('click', () => openTaskModal(null, null));
      document.getElementById('quickBreakBtn').addEventListener('click', () => {
        folder.tasks.push({
          id: uid('t'), title: state.lang === 'ru' ? 'Перерыв / Отдых 30 минут' : 'Team Break / 30m Rest',
          description: state.lang === 'ru' ? 'Отдых от экрана и восстановление сил.' : 'Rest away from screens.',
          type: 'rest', assigneeId: '', status: 'todo', durationMin: 30, remainingSec: 1800,
          running: false, timeSlot: '15:00 - 15:30', milestoneId: '', onRoadmap: false, isToday: true
        });
        saveState(); renderAll(); showToast(t('toastSaved'));
      });
      bindTaskInteractions(container, folder);
    }

    function renderTodayTimelineHTML(folder, tasks, isDir) {
      const todayTasks = tasks.filter(tk => tk.isToday !== false).sort((a, b) => (a.timeSlot || '99:99').localeCompare(b.timeSlot || '99:99'));
      if (todayTasks.length === 0) return `<div class="panel rounded-2xl p-10 text-center text-sm" style="color: var(--text-muted);">${t('todayEmpty')}</div>`;
      return `<div class="panel rounded-2xl p-4 space-y-2.5">${todayTasks.map(tk => {
        const mem = folder.members.find(m => m.id === tk.assigneeId);
        const ms = folder.milestones.find(m => m.id === tk.milestoneId);
        const borderCol = tk.type === 'rest' ? '#10b981' : tk.type === 'team' ? '#6366f1' : 'var(--accent)';
        return `
          <div draggable="true" data-drag-task="${tk.id}" class="card rounded-xl p-3.5 flex flex-wrap items-center justify-between gap-3 border-l-4 cursor-grab" style="border-left-color:${borderCol};">
            <div class="flex items-center gap-3 min-w-0 flex-1">
              <div class="font-mono text-xs font-bold px-2.5 py-1.5 rounded-lg bg-black/30 shrink-0 min-w-[110px] text-center">${escapeHtml(tk.timeSlot || 'Весь день')}</div>
              <div class="min-w-0 flex-1">
                <div class="font-semibold text-sm flex items-center gap-2 flex-wrap ${tk.status === 'done' ? 'line-through opacity-70' : ''}">
                  <span>${escapeHtml(tk.title)}</span>
                  <span class="text-[10px] font-normal px-2 py-0.5 rounded bg-white/10">${tk.type === 'rest' ? `☕ ${t('typeRest')}` : tk.type === 'team' ? `🤝 ${t('typeTeam')}` : (mem ? mem.name : t('unassigned'))}</span>
                  ${ms && tk.onRoadmap ? `<span class="text-[10px] px-2 py-0.5 rounded accent-pill">🚩 ${escapeHtml(ms.title)}</span>` : ''}
                </div>
                ${tk.description ? `<div class="text-xs mt-0.5 truncate" style="color: var(--text-muted);">${escapeHtml(tk.description)}</div>` : ''}
              </div>
            </div>
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="font-mono text-xs px-2 py-1 rounded bg-black/30 ${tk.running ? 'text-amber-300 font-bold' : ''}" data-timer-display="${tk.id}">${formatTimer(tk.remainingSec)}</span>
              <button data-timer-toggle="${tk.id}" class="px-2.5 py-1 rounded-lg text-xs font-semibold ${tk.running ? 'bg-amber-500/25 text-amber-200' : 'accent-pill'}">${tk.running ? t('timerPause') : t('timerStart')}</button>
              <button data-timer-reset="${tk.id}" class="p-1.5 rounded-lg card"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i></button>
              <button data-cycle-status="${tk.id}" class="px-2.5 py-1 rounded-lg text-xs card">${tk.status === 'done' ? '✅' : tk.status === 'in_progress' ? '⏳' : '⬜'}</button>
              <button data-edit-task="${tk.id}" class="p-1.5 rounded-lg card"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
              ${isDir ? `<button data-delete-task="${tk.id}" class="p-1.5 rounded-lg card text-red-400"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>` : ''}
            </div>
          </div>
        `;
      }).join('')}</div>`;
    }

    function renderByMilestoneHTML(folder, tasks, sortedMembers, isDir) {
      const groups = [
        ...folder.milestones.map(ms => ({ id: ms.id, title: '🚩 ' + ms.title, items: tasks.filter(tk => tk.milestoneId === ms.id) })),
        { id: '', title: '📌 ' + t('noMilestone'), items: tasks.filter(tk => !tk.milestoneId) }
      ];
      return `<div class="space-y-4">${groups.map(g => `
        <div class="panel rounded-2xl p-4 space-y-3">
          <div class="flex items-center justify-between gap-2">
            <div class="font-bold text-sm flex items-center gap-2"><span>${escapeHtml(g.title)}</span><span class="text-xs px-2 py-0.5 rounded bg-white/10">${g.items.length}</span></div>
            ${g.id ? `<button data-add-task-ms="${g.id}" class="px-2.5 py-1 rounded-lg card text-xs font-semibold">${t('addTaskToStage')}</button>` : ''}
          </div>
          ${g.items.length === 0 ? `<div class="text-xs opacity-60">${t('noTasksYet')}</div>` : renderTaskCardsHTML(folder, g.items, sortedMembers, isDir)}
        </div>
      `).join('')}</div>`;
    }

    function renderTaskCardsHTML(folder, tasks, sortedMembers, isDir) {
      if (tasks.length === 0) return `<div class="panel rounded-2xl p-10 text-center text-sm" style="color: var(--text-muted);">${t('noTasksYet')}</div>`;
      return `<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">${tasks.map(tk => {
        const totalSec = Math.max(1, (tk.durationMin || 30) * 60);
        const pct = Math.min(100, Math.max(0, ((totalSec - (tk.remainingSec || 0)) / totalSec) * 100));
        const stMap = { todo: { label: t('statusTodo'), cls: 'bg-slate-500/20 text-slate-300 border-slate-500/30' }, in_progress: { label: t('statusProgress'), cls: 'bg-amber-500/20 text-amber-300 border-amber-500/30' }, done: { label: t('statusDone'), cls: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30' } };
        const st = stMap[tk.status] || stMap.todo;
        const assignVal = tk.type === 'team' ? '__team' : tk.type === 'rest' ? '__rest' : (tk.assigneeId || '');
        return `
          <div draggable="true" data-drag-task="${tk.id}" class="card rounded-2xl p-4 flex flex-col justify-between gap-3 cursor-grab ${tk.status === 'done' ? 'opacity-75' : ''}">
            <div class="space-y-2">
              <div class="flex items-start justify-between gap-2">
                <div class="flex flex-wrap items-center gap-1">
                  <span class="text-[10px] px-2 py-0.5 rounded accent-pill">${tk.type === 'team' ? '🤝 ' + t('typeTeam') : tk.type === 'rest' ? '☕ ' + t('typeRest') : '👤 ' + t('typePersonal')}</span>
                  ${tk.onRoadmap ? `<span class="text-[10px] px-1.5 py-0.5 rounded bg-white/10">🗺️ ${t('onRoadmap')}</span>` : ''}
                  ${tk.isToday !== false ? `<span class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-300">🕒 ${t('inToday')}</span>` : ''}
                </div>
                <button data-cycle-status="${tk.id}" class="text-[11px] px-2 py-0.5 rounded-lg border font-medium shrink-0 ${st.cls}">${st.label}</button>
              </div>
              <div>
                <h4 class="font-bold text-sm ${tk.status === 'done' ? 'line-through opacity-75' : ''}">${escapeHtml(tk.title)}</h4>
                ${tk.description ? `<p class="text-xs mt-1 line-clamp-2" style="color: var(--text-muted);">${escapeHtml(tk.description)}</p>` : ''}
              </div>
            </div>
            <div class="space-y-2.5 pt-2 border-t" style="border-color: var(--border-color);">
              <div class="flex items-center gap-2 text-xs">
                <span class="shrink-0" style="color: var(--text-muted);">${t('assignQuick')}</span>
                <select data-quick-assign="${tk.id}" class="flex-1 py-1 text-xs">
                  <option value="">${t('unassigned')}</option>
                  <option value="__team" ${assignVal === '__team' ? 'selected' : ''}>🤝 ${t('typeTeam')}</option>
                  <option value="__rest" ${assignVal === '__rest' ? 'selected' : ''}>☕ ${t('typeRest')}</option>
                  ${sortedMembers.map(m => `<option value="${m.id}" ${assignVal === m.id ? 'selected' : ''}>${escapeHtml(m.name)}</option>`).join('')}
                </select>
              </div>
              <div class="rounded-xl p-2.5 bg-black/25 space-y-1.5">
                <div class="flex items-center justify-between gap-2">
                  <div class="font-mono text-sm font-bold flex items-center gap-1.5 ${tk.running ? 'text-amber-300' : ''}">
                    <i data-lucide="timer" class="w-4 h-4" style="color: var(--accent);"></i>
                    <span data-timer-display="${tk.id}">${formatTimer(tk.remainingSec)}</span>
                    <span class="text-[10px] font-normal opacity-60">/ ${tk.durationMin} ${t('minUnit')}</span>
                  </div>
                  <div class="flex items-center gap-1">
                    <button data-timer-toggle="${tk.id}" class="px-2 py-1 rounded-lg text-[11px] font-semibold ${tk.running ? 'bg-amber-500/25 text-amber-200' : 'accent-pill'}">${tk.running ? t('timerPause') : t('timerStart')}</button>
                    <button data-timer-reset="${tk.id}" class="p-1 rounded-lg card"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i></button>
                  </div>
                </div>
                <div class="h-1.5 rounded-full bg-white/10 overflow-hidden"><div data-timer-bar="${tk.id}" class="h-full transition-all duration-300" style="width:${pct}%; background: var(--accent);"></div></div>
              </div>
              <div class="flex items-center justify-between text-[11px]">
                <span class="font-mono opacity-75">${tk.timeSlot ? '🕒 ' + escapeHtml(tk.timeSlot) : ''}</span>
                <div class="flex items-center gap-1">
                  <button data-edit-task="${tk.id}" class="px-2.5 py-1 rounded-lg card flex items-center gap-1"><i data-lucide="pencil" class="w-3 h-3"></i> ${t('edit')}</button>
                  ${isDir ? `<button data-delete-task="${tk.id}" class="px-2 py-1 rounded-lg card text-red-400 hover:bg-red-500/20"><i data-lucide="trash-2" class="w-3 h-3"></i></button>` : ''}
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('')}</div>`;
    }

    function bindTaskInteractions(container, folder) {
      container.querySelectorAll('[data-filter-target]').forEach(el => {
        el.addEventListener('click', () => { state.taskFilterMemberId = el.dataset.filterTarget; renderTasksTab(container, folder); if (window.lucide) lucide.createIcons(); });
        if (el.dataset.dropMember || el.dataset.dropType) {
          el.addEventListener('dragover', (e) => { e.preventDefault(); el.classList.add('drop-target-active'); });
          el.addEventListener('dragleave', () => el.classList.remove('drop-target-active'));
          el.addEventListener('drop', (e) => {
            e.preventDefault(); el.classList.remove('drop-target-active');
            const tid = e.dataTransfer.getData('text/plain') || dragTaskId;
            const tk = folder.tasks.find(x => x.id === tid);
            if (!tk) return;
            if (el.dataset.dropMember) { tk.type = 'personal'; tk.assigneeId = el.dataset.dropMember; }
            else if (el.dataset.dropType === 'team') { tk.type = 'team'; tk.assigneeId = ''; }
            else if (el.dataset.dropType === 'rest') { tk.type = 'rest'; tk.assigneeId = ''; }
            saveState(); renderAll(); showToast(t('toastSaved'));
          });
        }
      });
      container.querySelectorAll('[data-drag-task]').forEach(card => card.addEventListener('dragstart', (e) => { dragTaskId = card.dataset.dragTask; e.dataTransfer.setData('text/plain', dragTaskId); }));
      container.querySelectorAll('[data-add-task-ms]').forEach(btn => btn.addEventListener('click', () => openTaskModal(null, btn.dataset.addTaskMs)));
      container.querySelectorAll('[data-cycle-status]').forEach(btn => {
        btn.addEventListener('click', () => {
          const tk = folder.tasks.find(x => x.id === btn.dataset.cycleStatus);
          if (!tk) return;
          const order = ['todo', 'in_progress', 'done'];
          tk.status = order[(order.indexOf(tk.status) + 1) % order.length];
          if (tk.status === 'done') tk.running = false;
          saveState(); renderAll();
        });
      });
      container.querySelectorAll('[data-quick-assign]').forEach(sel => {
        sel.addEventListener('change', () => {
          const tk = folder.tasks.find(x => x.id === sel.dataset.quickAssign);
          if (!tk) return;
          const val = sel.value;
          if (val === '__team') { tk.type = 'team'; tk.assigneeId = ''; }
          else if (val === '__rest') { tk.type = 'rest'; tk.assigneeId = ''; }
          else { tk.type = 'personal'; tk.assigneeId = val; }
          saveState(); renderAll();
        });
      });
      container.querySelectorAll('[data-timer-toggle]').forEach(btn => {
        btn.addEventListener('click', () => {
          const tk = folder.tasks.find(x => x.id === btn.dataset.timerToggle);
          if (!tk) return;
          if (!tk.running && tk.remainingSec <= 0) tk.remainingSec = (tk.durationMin || 30) * 60;
          tk.running = !tk.running;
          if (tk.running && tk.status === 'todo') tk.status = 'in_progress';
          saveState(); renderTasksTab(container, folder); if (window.lucide) lucide.createIcons();
        });
      });
      container.querySelectorAll('[data-timer-reset]').forEach(btn => {
        btn.addEventListener('click', () => {
          const tk = folder.tasks.find(x => x.id === btn.dataset.timerReset);
          if (!tk) return;
          tk.running = false; tk.remainingSec = (tk.durationMin || 30) * 60;
          saveState(); renderTasksTab(container, folder); if (window.lucide) lucide.createIcons();
        });
      });
      container.querySelectorAll('[data-edit-task]').forEach(btn => btn.addEventListener('click', () => openTaskModal(btn.dataset.editTask, null)));
      container.querySelectorAll('[data-delete-task]').forEach(btn => {
        btn.addEventListener('click', () => {
          const tk = folder.tasks.find(x => x.id === btn.dataset.deleteTask);
          if (!tk) return;
          confirmDelete(`Удалить задачу «${tk.title}»?`, () => { folder.tasks = folder.tasks.filter(x => x.id !== tk.id); saveState(); renderAll(); });
        });
      });
    }

    function openTaskModal(taskId, presetMilestoneId) {
      const folder = getActiveFolder();
      const existing = taskId ? folder.tasks.find(x => x.id === taskId) : null;
      const sortedMembers = [...folder.members].sort((a, b) => a.order - b.order);
      const activeMsId = existing ? existing.milestoneId : (presetMilestoneId || '');

      openModal(`
        <form id="taskForm" class="space-y-3.5">
          <h3 class="font-bold text-base">${existing ? t('taskModalTitleEdit') : t('taskModalTitleAdd')}</h3>
          <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('taskTitleLabel')} *</label><input id="tkTitle" required class="w-full" value="${escapeHtml(existing ? existing.title : '')}" /></div>
          <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('taskDescLabel')}</label><textarea id="tkDesc" rows="3" class="w-full">${escapeHtml(existing ? existing.description : '')}</textarea></div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('taskTypeLabel')}</label><select id="tkType" class="w-full"><option value="personal" ${(existing ? existing.type : 'personal') === 'personal' ? 'selected' : ''}>👤 ${t('typePersonal')}</option><option value="team" ${existing && existing.type === 'team' ? 'selected' : ''}>🤝 ${t('typeTeam')}</option><option value="rest" ${existing && existing.type === 'rest' ? 'selected' : ''}>☕ ${t('typeRest')}</option></select></div>
            <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('taskAssigneeLabel')}</label><select id="tkAssignee" class="w-full"><option value="">${t('unassigned')}</option>${sortedMembers.map(m => `<option value="${m.id}" ${existing && existing.assigneeId === m.id ? 'selected' : ''}>${escapeHtml(m.name)}</option>`).join('')}</select></div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('taskStatusLabel')}</label><select id="tkStatus" class="w-full"><option value="todo" ${(existing ? existing.status : 'todo') === 'todo' ? 'selected' : ''}>${t('statusTodo')}</option><option value="in_progress" ${existing && existing.status === 'in_progress' ? 'selected' : ''}>${t('statusProgress')}</option><option value="done" ${existing && existing.status === 'done' ? 'selected' : ''}>${t('statusDone')}</option></select></div>
            <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('taskDurationLabel')}</label><input id="tkDuration" type="number" min="1" max="1440" class="w-full" value="${existing ? existing.durationMin : 45}" /></div>
            <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('taskTimeSlotLabel')}</label><input id="tkSlot" class="w-full" value="${escapeHtml(existing ? existing.timeSlot : '')}" placeholder="10:00 - 11:00" /></div>
          </div>
          <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('taskMilestoneLabel')}</label><select id="tkMilestone" class="w-full"><option value="">${t('noMilestone')}</option>${folder.milestones.map(ms => `<option value="${ms.id}" ${activeMsId === ms.id ? 'selected' : ''}>🚩 ${escapeHtml(ms.title)}</option>`).join('')}</select></div>
          <div class="space-y-1.5 pt-1">
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input id="tkInToday" type="checkbox" ${(existing ? existing.isToday !== false : true) ? 'checked' : ''} /><span>${t('taskInTodayLabel')}</span></label>
            <label class="flex items-center gap-2 text-xs cursor-pointer"><input id="tkOnRoadmap" type="checkbox" ${(existing ? existing.onRoadmap : true) ? 'checked' : ''} /><span>${t('taskShowRoadmapLabel')}</span></label>
          </div>
          <div class="flex justify-end gap-2 pt-3 border-t" style="border-color: var(--border-color);"><button type="button" id="cancelTaskBtn" class="px-4 py-2 rounded-lg card text-xs">${t('cancelBtn')}</button><button type="submit" class="btn-accent px-4 py-2 rounded-lg text-xs font-semibold">${t('saveBtn')}</button></div>
        </form>
      `);
      document.getElementById('cancelTaskBtn').addEventListener('click', closeModal);
      document.getElementById('taskForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const dur = Math.max(1, Number(document.getElementById('tkDuration').value) || 30);
        const type = document.getElementById('tkType').value;
        const data = {
          id: existing ? existing.id : uid('t'),
          title: document.getElementById('tkTitle').value.trim(),
          description: document.getElementById('tkDesc').value.trim(),
          type, assigneeId: type === 'personal' ? document.getElementById('tkAssignee').value : '',
          status: document.getElementById('tkStatus').value, durationMin: dur,
          remainingSec: existing && existing.durationMin === dur ? existing.remainingSec : dur * 60,
          running: existing ? existing.running : false, timeSlot: document.getElementById('tkSlot').value.trim(),
          milestoneId: document.getElementById('tkMilestone').value, onRoadmap: document.getElementById('tkOnRoadmap').checked,
          isToday: document.getElementById('tkInToday').checked
        };
        if (existing) Object.assign(existing, data);
        else folder.tasks.push(data);
        saveState(); closeModal(); renderAll(); showToast(t('toastSaved'));
      });
    }

    /* =========================================================================
       11. TAB 3: ROADMAP
    ========================================================================= */
    function renderRoadmapTab(container, folder) {
      const theme = folder.theme;
      const isDir = state.roleMode === 'director';
      const roadmapTasks = folder.tasks.filter(tk => tk.onRoadmap);
      const completedMs = folder.milestones.filter(m => m.completed).length;
      const totalMs = folder.milestones.length;
      const msPct = totalMs ? Math.round((completedMs / totalMs) * 100) : 0;
      const fallbackMsId = (folder.milestones.find(m => !m.completed) || folder.milestones[0] || {}).id || '';

      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div><h2 class="font-bold text-base sm:text-lg">${t('roadmapTitle')}</h2><p class="text-xs" style="color: var(--text-muted);">${t('clickHint')}</p></div>
            <div class="flex flex-wrap items-center gap-2">
              <div class="flex items-center gap-2 panel px-3 py-1.5 rounded-xl text-xs"><span style="color: var(--text-muted);">${t('zoomLabel')}:</span><input id="roadmapZoomRange" type="range" min="0.75" max="1.35" step="0.05" value="${state.roadmapZoom}" class="w-24 p-0 border-0" /><span class="font-mono w-10">${Math.round(state.roadmapZoom * 100)}%</span></div>
              <button id="addTaskFromMapBtn" class="px-3.5 py-2 rounded-xl card text-xs font-semibold flex items-center gap-1.5"><i data-lucide="plus-circle" class="w-4 h-4" style="color: var(--accent);"></i><span>${t('addTaskOnMap')}</span></button>
              <button id="addMilestoneBtn" class="btn-accent px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold flex items-center gap-1.5"><i data-lucide="flag" class="w-4 h-4"></i><span>${t('addMilestone')}</span></button>
            </div>
          </div>

          <div class="panel rounded-2xl p-3.5 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3 flex-1 min-w-[220px]">
              <span class="text-xs font-semibold whitespace-nowrap">🚩 ${completedMs} / ${totalMs} (${msPct}%)</span>
              <div class="flex-1 h-2.5 rounded-full bg-white/10 overflow-hidden"><div class="h-full rounded-full transition-all duration-300" style="width:${msPct}%; background: linear-gradient(90deg, var(--accent), var(--accent-2));"></div></div>
            </div>
            <span class="text-xs" style="color: var(--text-muted);">🗺️ ${roadmapTasks.length} ${t('tasksShort')}</span>
          </div>

          <div class="panel rounded-2xl roadmap-viewport">
            <div class="roadmap-track" style="transform: scale(${state.roadmapZoom});">
              <div class="roadmap-spine"></div>
              <div class="roadmap-node-col" style="min-width: 135px;">
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center border-2 shadow-lg" style="background: var(--bg-card); border-color: var(--accent); box-shadow: 0 0 18px var(--glow);">${getThemeFlagSVG(theme.flagIcon, theme.palette.accent, 24)}</div>
                <div class="mt-2 text-xs font-black tracking-widest uppercase">${t('startFlag')}</div>
              </div>
              ${folder.milestones.map((ms, idx) => {
                const linkedTasks = roadmapTasks.filter(tk => (tk.milestoneId || fallbackMsId) === ms.id);
                const topTasks = linkedTasks.filter((_, i) => i % 2 === 0);
                const bottomTasks = linkedTasks.filter((_, i) => i % 2 === 1);
                return `
                  <div class="roadmap-node-col" style="min-width: ${Math.max(260, Math.max(topTasks.length, bottomTasks.length) * 168)}px;">
                    ${topTasks.length ? `<div class="roadmap-branch-top">${topTasks.map(tk => renderBranchChip(tk, folder)).join('')}</div>` : ''}
                    <div class="flex flex-col items-center">
                      <div class="w-14 h-14 rounded-2xl flex items-center justify-center border-2 transition-transform hover:scale-110 relative cursor-pointer" data-inspect-milestone="${ms.id}" style="background: ${ms.completed ? 'var(--accent)' : 'var(--bg-card)'}; border-color: var(--accent); box-shadow: 0 0 20px var(--glow);">
                        ${getThemeFlagSVG(theme.flagIcon, ms.completed ? '#ffffff' : theme.palette.accent, 26)}
                        <span class="absolute -top-2 -right-2 w-5 h-5 rounded-full text-[10px] font-bold flex items-center justify-center bg-black border" style="border-color: var(--accent);">${idx + 1}</span>
                      </div>
                      <div class="mt-2 text-center max-w-[200px]">
                        <div class="text-xs font-bold leading-tight cursor-pointer hover:underline" data-inspect-milestone="${ms.id}">${escapeHtml(ms.title)}</div>
                        ${ms.targetDate ? `<div class="text-[10px] font-mono mt-0.5" style="color: var(--text-muted);">${escapeHtml(ms.targetDate)}</div>` : ''}
                        <button type="button" data-quick-ms-task="${ms.id}" class="mt-1 text-[10px] px-2 py-0.5 rounded-md card opacity-85 hover:opacity-100">${t('addTaskToStage')}</button>
                      </div>
                    </div>
                    ${bottomTasks.length ? `<div class="roadmap-branch-bottom">${bottomTasks.map(tk => renderBranchChip(tk, folder)).join('')}</div>` : ''}
                  </div>
                `;
              }).join('')}
              <div class="roadmap-node-col" style="min-width: 135px;">
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center border-2 shadow-lg" style="background: var(--bg-card); border-color: var(--accent-2);"><i data-lucide="trophy" class="w-6 h-6" style="color: var(--accent-2);"></i></div>
                <div class="mt-2 text-xs font-black tracking-widest uppercase">${t('finishFlag')}</div>
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById('roadmapZoomRange').addEventListener('input', (e) => { state.roadmapZoom = Number(e.target.value); renderRoadmapTab(container, folder); if (window.lucide) lucide.createIcons(); });
      document.getElementById('addMilestoneBtn').addEventListener('click', () => openMilestoneModal(null));
      document.getElementById('addTaskFromMapBtn').addEventListener('click', () => openTaskModal(null, fallbackMsId));
      container.querySelectorAll('[data-quick-ms-task]').forEach(btn => btn.addEventListener('click', () => openTaskModal(null, btn.dataset.quickMsTask)));
      container.querySelectorAll('[data-inspect-task]').forEach(chip => chip.addEventListener('click', () => openTaskZoomModal(chip.dataset.inspectTask)));
      container.querySelectorAll('[data-inspect-milestone]').forEach(node => node.addEventListener('click', () => openMilestoneInspectModal(node.dataset.inspectMilestone, isDir)));
    }

    function renderBranchChip(tk, folder) {
      const mem = folder.members.find(m => m.id === tk.assigneeId);
      const dot = tk.status === 'done' ? '#10b981' : tk.status === 'in_progress' ? '#f59e0b' : '#94a3b8';
      return `<button type="button" class="branch-chip" data-inspect-task="${tk.id}"><div class="flex items-center gap-1 mb-0.5"><span class="w-2 h-2 rounded-full shrink-0" style="background:${dot}"></span><span class="font-semibold truncate">${escapeHtml(tk.title)}</span></div><div class="text-[10px] truncate" style="color: var(--text-muted);">${tk.type === 'team' ? `🤝 ${t('typeTeam')}` : (mem ? mem.name : t('unassigned'))}</div></button>`;
    }

    function openTaskZoomModal(taskId) {
      const folder = getActiveFolder();
      const tk = folder.tasks.find(x => x.id === taskId);
      if (!tk) return;
      const mem = folder.members.find(m => m.id === tk.assigneeId);
      const ms = folder.milestones.find(m => m.id === tk.milestoneId);
      openModal(`
        <div class="space-y-4">
          <div class="flex items-start justify-between gap-3">
            <div><span class="text-[11px] uppercase tracking-wider px-2 py-0.5 rounded accent-pill">${tk.type === 'team' ? t('typeTeam') : tk.type === 'rest' ? t('typeRest') : t('typePersonal')}</span><h3 class="font-bold text-lg mt-2">${escapeHtml(tk.title)}</h3></div>
            <button id="zoomEditTaskBtn" class="px-3 py-1.5 rounded-lg card text-xs flex items-center gap-1"><i data-lucide="pencil" class="w-3.5 h-3.5"></i> ${t('edit')}</button>
          </div>
          <p class="text-sm leading-relaxed p-3 rounded-xl bg-black/25">${escapeHtml(tk.description || '—')}</p>
          <div class="grid grid-cols-2 gap-2.5 text-xs">
            <div class="card p-2.5 rounded-xl"><div style="color: var(--text-muted);">${t('taskAssigneeLabel')}</div><div class="font-semibold mt-0.5">${mem ? escapeHtml(mem.name) : (tk.type === 'team' ? t('typeTeam') : t('unassigned'))}</div></div>
            <div class="card p-2.5 rounded-xl"><div style="color: var(--text-muted);">${t('taskMilestoneLabel')}</div><div class="font-semibold mt-0.5">${ms ? '🚩 ' + escapeHtml(ms.title) : '—'}</div></div>
          </div>
          <div class="flex items-center justify-between gap-2 pt-2 border-t" style="border-color: var(--border-color);">
            <button id="zoomToggleDoneBtn" class="btn-accent px-4 py-2 rounded-xl text-xs font-semibold">${tk.status === 'done' ? '↩ ' + t('statusProgress') : '✓ ' + t('statusDone')}</button>
            <button id="zoomCloseBtn" class="px-4 py-2 rounded-xl card text-xs">${t('closeBtn')}</button>
          </div>
        </div>
      `);
      document.getElementById('zoomCloseBtn').addEventListener('click', closeModal);
      document.getElementById('zoomEditTaskBtn').addEventListener('click', () => openTaskModal(tk.id, null));
      document.getElementById('zoomToggleDoneBtn').addEventListener('click', () => {
        tk.status = tk.status === 'done' ? 'in_progress' : 'done';
        if (tk.status === 'done') tk.running = false;
        saveState(); closeModal(); renderAll();
      });
    }

    function openMilestoneInspectModal(msId, isDir) {
      const folder = getActiveFolder();
      const ms = folder.milestones.find(x => x.id === msId);
      if (!ms) return;
      const linked = folder.tasks.filter(tk => tk.milestoneId === ms.id);
      openModal(`
        <div class="space-y-4">
          <div class="flex items-start justify-between gap-3">
            <div><span class="text-[11px] px-2 py-0.5 rounded ${ms.completed ? 'bg-emerald-500/20 text-emerald-300' : 'accent-pill'}">${ms.completed ? '✅ ' + t('milestoneDoneLabel') : '🚩 В работе'}</span><h3 class="font-bold text-lg mt-2">${escapeHtml(ms.title)}</h3>${ms.targetDate ? `<div class="text-xs font-mono mt-0.5" style="color: var(--text-muted);">${escapeHtml(ms.targetDate)}</div>` : ''}</div>
            <div class="flex gap-1.5">
              <button id="addMsTaskInsideBtn" class="px-2.5 py-1.5 rounded-lg card text-xs font-semibold">${t('addTaskToStage')}</button>
              <button id="editMsBtn" class="p-2 rounded-lg card"><i data-lucide="pencil" class="w-4 h-4"></i></button>
              ${isDir ? `<button id="delMsBtn" class="p-2 rounded-lg card text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}
            </div>
          </div>
          <p class="text-sm p-3 rounded-xl bg-black/25">${escapeHtml(ms.description || '—')}</p>
          <div class="space-y-1.5"><div class="text-xs font-semibold" style="color: var(--text-muted);">Связанные задачи (${linked.length}):</div>${linked.length === 0 ? `<div class="text-xs opacity-60">—</div>` : linked.map(tk => `<div class="card px-3 py-2 rounded-lg text-xs">${tk.status === 'done' ? '✅' : '⏳'} ${escapeHtml(tk.title)}</div>`).join('')}</div>
          <div class="flex items-center justify-between pt-2 border-t" style="border-color: var(--border-color);">
            <button id="toggleMsDoneBtn" class="btn-accent px-4 py-2 rounded-xl text-xs font-semibold">${ms.completed ? 'Снять отметку' : '✓ ' + t('milestoneDoneLabel')}</button>
            <button id="closeMsInspectBtn" class="px-4 py-2 rounded-xl card text-xs">${t('closeBtn')}</button>
          </div>
        </div>
      `);
      document.getElementById('closeMsInspectBtn').addEventListener('click', closeModal);
      document.getElementById('addMsTaskInsideBtn').addEventListener('click', () => openTaskModal(null, ms.id));
      document.getElementById('editMsBtn').addEventListener('click', () => openMilestoneModal(ms.id));
      document.getElementById('toggleMsDoneBtn').addEventListener('click', () => { ms.completed = !ms.completed; saveState(); closeModal(); renderAll(); });
      const delBtn = document.getElementById('delMsBtn');
      if (delBtn) delBtn.addEventListener('click', () => confirmDelete(`Удалить веху «${ms.title}»?`, () => { folder.milestones = folder.milestones.filter(x => x.id !== ms.id); folder.tasks.forEach(tk => { if (tk.milestoneId === ms.id) tk.milestoneId = ''; }); saveState(); renderAll(); }));
    }

    function openMilestoneModal(msId) {
      const folder = getActiveFolder();
      const existing = msId ? folder.milestones.find(x => x.id === msId) : null;
      openModal(`
        <form id="msForm" class="space-y-3.5">
          <h3 class="font-bold text-base">${existing ? t('milestoneModalTitleEdit') : t('milestoneModalTitleAdd')}</h3>
          <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('milestoneTitleLabel')} *</label><input id="msTitle" required class="w-full" value="${escapeHtml(existing ? existing.title : '')}" /></div>
          <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('milestoneDescLabel')}</label><textarea id="msDesc" rows="3" class="w-full">${escapeHtml(existing ? existing.description : '')}</textarea></div>
          <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('milestoneDateLabel')}</label><input id="msDate" type="date" class="w-full" value="${escapeHtml(existing ? existing.targetDate : '')}" /></div>
          <label class="flex items-center gap-2 text-xs cursor-pointer"><input id="msDone" type="checkbox" ${existing && existing.completed ? 'checked' : ''} /><span>${t('milestoneDoneLabel')}</span></label>
          <div class="flex justify-end gap-2 pt-3 border-t" style="border-color: var(--border-color);"><button type="button" id="cancelMsBtn" class="px-4 py-2 rounded-lg card text-xs">${t('cancelBtn')}</button><button type="submit" class="btn-accent px-4 py-2 rounded-lg text-xs font-semibold">${t('saveBtn')}</button></div>
        </form>
      `);
      document.getElementById('cancelMsBtn').addEventListener('click', closeModal);
      document.getElementById('msForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const data = { id: existing ? existing.id : uid('ms'), title: document.getElementById('msTitle').value.trim(), description: document.getElementById('msDesc').value.trim(), targetDate: document.getElementById('msDate').value, completed: document.getElementById('msDone').checked };
        if (existing) Object.assign(existing, data); else folder.milestones.push(data);
        saveState(); closeModal(); renderAll(); showToast(t('toastSaved'));
      });
    }

    /* =========================================================================
       12. TAB 4: DIRECTOR HUB
    ========================================================================= */
    function renderDirectorTab(container, folder) {
      const isDir = state.roleMode === 'director';
      const totalTasks = folder.tasks.length;
      const doneTasks = folder.tasks.filter(x => x.status === 'done').length;
      const todayCount = folder.tasks.filter(x => x.isToday !== false).length;
      const pct = totalTasks ? Math.round((doneTasks / totalTasks) * 100) : 0;
      const activeTimers = folder.tasks.filter(x => x.running).length;
      const doneMs = folder.milestones.filter(x => x.completed).length;

      container.innerHTML = `
        <div class="space-y-5">
          <h2 class="font-bold text-base sm:text-lg">${t('directorTitle')}</h2>
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
            <div class="panel rounded-2xl p-4"><div class="text-xs" style="color: var(--text-muted);">${t('kpiProgress')}</div><div class="text-2xl font-black mt-1">${pct}%</div><div class="text-[11px] mt-1" style="color: var(--text-muted);">${doneTasks} / ${totalTasks}</div></div>
            <div class="panel rounded-2xl p-4"><div class="text-xs" style="color: var(--text-muted);">${t('kpiToday')}</div><div class="text-2xl font-black mt-1">${todayCount}</div><div class="text-[11px] mt-1" style="color: var(--text-muted);">🕒 В расписании</div></div>
            <div class="panel rounded-2xl p-4"><div class="text-xs" style="color: var(--text-muted);">${t('kpiMilestones')}</div><div class="text-2xl font-black mt-1">${doneMs} / ${folder.milestones.length}</div><div class="text-[11px] mt-1" style="color: var(--text-muted);">🚩 Вехи</div></div>
            <div class="panel rounded-2xl p-4"><div class="text-xs" style="color: var(--text-muted);">${t('kpiActiveTimers')}</div><div class="text-2xl font-black mt-1 ${activeTimers > 0 ? 'text-amber-400' : ''}">${activeTimers}</div><div class="text-[11px] mt-1" style="color: var(--text-muted);">⏱ Активны</div></div>
          </div>
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div class="panel rounded-2xl p-4 space-y-3">
              <h3 class="font-bold text-sm">${t('workloadTitle')}</h3>
              <div class="space-y-2.5">${folder.members.length === 0 ? `<div class="text-xs opacity-60">${t('noMembers')}</div>` : folder.members.map(m => {
                const mTasks = folder.tasks.filter(x => x.assigneeId === m.id);
                const mDone = mTasks.filter(x => x.status === 'done').length;
                const mPct = mTasks.length ? Math.round((mDone / mTasks.length) * 100) : 0;
                return `<div class="card rounded-xl p-3 space-y-1.5"><div class="flex items-center justify-between text-xs"><span class="font-semibold">${escapeHtml(m.name)}</span><span class="font-mono">${mDone}/${mTasks.length} (${mPct}%)</span></div><div class="h-1.5 rounded-full bg-white/10 overflow-hidden"><div class="h-full rounded-full" style="width:${mPct}%; background: var(--accent);"></div></div></div>`;
              }).join('')}</div>
            </div>
            <div class="panel rounded-2xl p-4 space-y-3">
              <div class="flex items-center justify-between"><h3 class="font-bold text-sm">${t('decisionsTitle')}</h3><button id="addDecisionBtn" class="btn-accent px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1"><i data-lucide="plus" class="w-3.5 h-3.5"></i> ${t('addDecision')}</button></div>
              <div class="space-y-2">${(folder.decisions || []).length === 0 ? `<div class="text-xs py-6 text-center" style="color: var(--text-muted);">${t('noDecisions')}</div>` : (folder.decisions || []).map(d => {
                const stMap = { approved: { label: t('decApproved'), cls: 'bg-emerald-500/20 text-emerald-300' }, review: { label: t('decReview'), cls: 'bg-amber-500/20 text-amber-300' }, risk: { label: t('decRisk'), cls: 'bg-red-500/20 text-red-300' } };
                const st = stMap[d.status] || stMap.approved;
                return `<div class="card rounded-xl p-3 space-y-1"><div class="flex items-start justify-between gap-2"><div class="font-semibold text-xs">${escapeHtml(d.title)}</div><div class="flex items-center gap-1.5 shrink-0"><span class="text-[10px] px-2 py-0.5 rounded ${st.cls}">${st.label}</span>${isDir ? `<button data-del-decision="${d.id}" class="text-red-400"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>` : ''}</div></div><div class="text-xs" style="color: var(--text-muted);">${escapeHtml(d.choice)}</div></div>`;
              }).join('')}</div>
            </div>
          </div>
        </div>
      `;
      document.getElementById('addDecisionBtn').addEventListener('click', openDecisionModal);
      container.querySelectorAll('[data-del-decision]').forEach(btn => btn.addEventListener('click', () => confirmDelete('Удалить запись решения?', () => { folder.decisions = (folder.decisions || []).filter(x => x.id !== btn.dataset.delDecision); saveState(); renderAll(); })));
    }

    function openDecisionModal() {
      const folder = getActiveFolder();
      openModal(`
        <form id="decForm" class="space-y-3.5">
          <h3 class="font-bold text-base">${t('addDecision')}</h3>
          <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('decisionTitleLabel')} *</label><input id="decTitle" required class="w-full" /></div>
          <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('decisionChoiceLabel')} *</label><textarea id="decChoice" required rows="3" class="w-full"></textarea></div>
          <div><label class="block text-xs mb-1" style="color: var(--text-muted);">${t('decisionStatusLabel')}</label><select id="decStatus" class="w-full"><option value="approved">${t('decApproved')}</option><option value="review">${t('decReview')}</option><option value="risk">${t('decRisk')}</option></select></div>
          <div class="flex justify-end gap-2 pt-2"><button type="button" id="cancelDecBtn" class="px-4 py-2 rounded-lg card text-xs">${t('cancelBtn')}</button><button type="submit" class="btn-accent px-4 py-2 rounded-lg text-xs font-semibold">${t('saveBtn')}</button></div>
        </form>
      `);
      document.getElementById('cancelDecBtn').addEventListener('click', closeModal);
      document.getElementById('decForm').addEventListener('submit', (e) => {
        e.preventDefault();
        if (!folder.decisions) folder.decisions = [];
        folder.decisions.unshift({ id: uid('dec'), title: document.getElementById('decTitle').value.trim(), choice: document.getElementById('decChoice').value.trim(), status: document.getElementById('decStatus').value, date: new Date().toISOString().slice(0, 10) });
        saveState(); closeModal(); renderAll(); showToast(t('toastSaved'));
      });
    }

    /* =========================================================================
       13. THEME STUDIO MODAL (AI PROMPT + MANUAL FINE-TUNING)
    ========================================================================= */
    function openThemeModal() {
      const folder = getActiveFolder();
      if (!folder) return;
      const th = folder.theme;
      openModal(`
        <form id="themeForm" class="space-y-4">
          <h3 class="font-bold text-base">${t('themeModalTitle')}</h3>
          <div>
            <label class="block text-xs mb-1" style="color: var(--text-muted);">${t('themePromptLabel')}</label>
            <input id="themePromptInput" required class="w-full" value="${escapeHtml(th.prompt)}" placeholder="${t('folderThemePlaceholder')}" />
          </div>
          <div>
            <div class="text-xs mb-1.5" style="color: var(--text-muted);">${t('presetsLabel')}</div>
            <div class="flex flex-wrap gap-1.5">
              ${THEME_PRESETS.map(p => {
                const label = state.lang === 'ru' ? p.ru : p.en;
                const prev = analyzeAndGenerateTheme(label);
                return `<button type="button" data-theme-preset="${escapeHtml(label)}" class="px-2.5 py-1 rounded-lg card text-[11px] flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full" style="background:${prev.palette.accent}"></span>${escapeHtml(label)}</button>`;
              }).join('')}
            </div>
          </div>

          <div class="pt-3 border-t space-y-2.5" style="border-color: var(--border-color);">
            <div class="text-xs font-semibold" style="color: var(--text-muted);">${t('manualTuneLabel')}</div>
            <div class="grid grid-cols-2 gap-2.5 text-xs">
              <div>
                <label class="block text-[11px] mb-1" style="color: var(--text-muted);">${t('particlesLabel')}</label>
                <select id="tuneParticles" class="w-full">
                  <option value="auto">Авто по теме</option>
                  <option value="embers">Искры / Пепел</option>
                  <option value="feathers">Тёмные перья</option>
                  <option value="sakura">Лепестки сакуры</option>
                  <option value="rain">Дождь</option>
                  <option value="dust">Древняя пыль</option>
                  <option value="smoke">Дым / Пар</option>
                  <option value="snow">Снег</option>
                  <option value="bubbles">Пузыри</option>
                  <option value="leaves">Листья</option>
                  <option value="stars">Звёзды</option>
                </select>
              </div>
              <div>
                <label class="block text-[11px] mb-1" style="color: var(--text-muted);">${t('filterLabel')}</label>
                <select id="tuneFilter" class="w-full">
                  <option value="auto">Авто по теме</option>
                  <option value="vhs">VHS плёнка</option>
                  <option value="grain">Кино-виньетка</option>
                  <option value="grid">Техно-сетка</option>
                  <option value="none">Без фильтра</option>
                </select>
              </div>
            </div>
          </div>

          <div class="flex justify-end gap-2 pt-2 border-t" style="border-color: var(--border-color);">
            <button type="button" id="cancelThemeBtn" class="px-4 py-2 rounded-lg card text-xs">${t('cancelBtn')}</button>
            <button type="submit" class="btn-accent px-4 py-2 rounded-lg text-xs font-semibold">${t('applyThemeBtn')}</button>
          </div>
        </form>
      `);
      document.querySelectorAll('[data-theme-preset]').forEach(b => b.addEventListener('click', () => { document.getElementById('themePromptInput').value = b.dataset.themePreset; }));
      document.getElementById('cancelThemeBtn').addEventListener('click', closeModal);
      document.getElementById('themeForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const prompt = document.getElementById('themePromptInput').value.trim();
        const gen = analyzeAndGenerateTheme(prompt);
        const pOverride = document.getElementById('tuneParticles').value;
        const fOverride = document.getElementById('tuneFilter').value;
        if (pOverride !== 'auto') gen.particleType = pOverride;
        if (fOverride !== 'auto') gen.overlay = fOverride;
        folder.theme = gen;
        saveState(); closeModal(); renderAll();
        showToast(`${t('toastThemeApplied')} ${prompt}`);
      });
    }

    /* =========================================================================
       14. SHARE / BACKUP / LOCAL AUTO-FILE SYNC / GUIDE MODAL
    ========================================================================= */
    function openShareModal() {
      const isDir = state.roleMode === 'director';
      openModal(`
        <div class="space-y-4">
          <h3 class="font-bold text-base">${t('shareModalTitle')}</h3>
          <p class="text-xs leading-relaxed" style="color: var(--text-muted);">${t('shareIntro')}</p>
          <div class="flex flex-wrap gap-2">
            <button id="linkDiskBtn" class="btn-accent px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5">
              <i data-lucide="hard-drive" class="w-3.5 h-3.5"></i> ${t('linkDiskBtn')}
            </button>
            <button id="exportJsonBtn" class="px-3.5 py-2 rounded-xl card text-xs font-semibold flex items-center gap-1.5">
              <i data-lucide="download" class="w-3.5 h-3.5"></i> ${t('exportJsonBtn')}
            </button>
            <label class="px-3.5 py-2 rounded-xl card text-xs font-semibold flex items-center gap-1.5 cursor-pointer">
              <i data-lucide="upload" class="w-3.5 h-3.5"></i> ${t('importJsonBtn')}
              <input id="importJsonInput" type="file" accept=".json,application/json" class="hidden" />
            </label>
            <button id="copySnapLinkBtn" class="px-3.5 py-2 rounded-xl card text-xs font-semibold flex items-center gap-1.5">
              <i data-lucide="link" class="w-3.5 h-3.5"></i> ${t('copyLinkBtn')}
            </button>
          </div>
          <div class="pt-3 border-t space-y-2.5" style="border-color: var(--border-color);">
            <div class="font-bold text-xs">${t('pinSectionTitle')}</div>
            <p class="text-[11px]" style="color: var(--text-muted);">${t('pinDesc')}</p>
            ${isDir ? `
              <div class="flex gap-2">
                <input id="pinSetInput" type="password" maxlength="8" class="flex-1" value="${escapeHtml(state.directorPin)}" placeholder="${t('pinPlaceholder')}" />
                <button id="savePinBtn" class="px-3 py-1.5 rounded-lg card text-xs font-semibold">${t('setPinBtn')}</button>
              </div>
              <button id="switchModeBtn" class="w-full py-2 rounded-xl card text-xs font-semibold text-amber-300">🔒 ${t('switchToMember')}</button>
            ` : `
              <button id="switchModeBtn" class="w-full py-2 rounded-xl btn-accent text-xs font-semibold">🔓 ${t('switchToDirector')}</button>
            `}
          </div>
          <div class="flex justify-end pt-1"><button id="closeShareBtn" class="px-4 py-1.5 rounded-lg card text-xs">${t('closeBtn')}</button></div>
        </div>
      `);

      document.getElementById('closeShareBtn').addEventListener('click', closeModal);
      document.getElementById('linkDiskBtn').addEventListener('click', async () => {
        if (!window.showSaveFilePicker) { showToast(t('toastDiskUnsupported')); return; }
        try {
          linkedFileHandle = await window.showSaveFilePicker({
            suggestedName: 'studio-command-hub-save.json',
            types: [{ description: 'JSON Save', accept: { 'application/json': ['.json'] } }]
          });
          await writeToLinkedDiskFile(state);
          saveState();
          showToast(t('toastDiskLinked'));
        } catch (e) {}
      });

      document.getElementById('copySnapLinkBtn').addEventListener('click', () => {
        try {
          const clone = JSON.parse(JSON.stringify(state));
          clone.folders.forEach(f => f.members.forEach(m => { if (m.photo && m.photo.length > 2000) m.photo = ''; }));
          const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(clone))));
          if (encoded.length > 12000) { showToast(t('toastLinkTooLarge')); return; }
          const url = window.location.href.split('#')[0] + '#snap=' + encoded;
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(() => showToast(t('toastLinkCopied'))).catch(() => fallbackCopy(url));
          else fallbackCopy(url);
        } catch (e) { showToast(t('toastLinkTooLarge')); }
      });

      document.getElementById('exportJsonBtn').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `studio-command-hub-backup-${new Date().toISOString().slice(0,10)}.json`;
        a.click(); URL.revokeObjectURL(a.href);
      });

      document.getElementById('importJsonInput').addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            if (parsed && Array.isArray(parsed.folders)) { state = parsed; saveState(); closeModal(); renderAll(); showToast(t('toastImported')); }
          } catch (err) {}
        };
        reader.readAsText(file);
      });

      const savePinBtn = document.getElementById('savePinBtn');
      if (savePinBtn) savePinBtn.addEventListener('click', () => { state.directorPin = document.getElementById('pinSetInput').value.trim(); saveState(); showToast(t('toastSaved')); });
      document.getElementById('switchModeBtn').addEventListener('click', () => { closeModal(); toggleRoleMode(); });
    }

    function openGuideModal() {
      openModal(`
        <div class="space-y-3 text-xs leading-relaxed">
          <h3 class="font-bold text-base">${t('guideTitle')}</h3>
          <div class="card p-3 rounded-xl space-y-1">
            <div class="font-bold">1. Папки и ИИ-оформление тем</div>
            <p style="color: var(--text-muted);">На главном экране нажимайте «+», чтобы создавать отдельные папки для разных команд и игр. Впишите любую тему (например: «СССР город до нашей эры», «Апокалипсис в шкафах», «Самураи и сакура») — сайт создаст панораму на фоне, палитру, флаги и спецэффекты.</p>
          </div>
          <div class="card p-3 rounded-xl space-y-1">
            <div class="font-bold">2. Команда (без ограничений)</div>
            <p style="color: var(--text-muted);">Добавляйте сколько угодно участников: фото, очерёдность, сразу несколько ролей, уровень опыта и экстренный телефон. Ищите и фильтруйте по любым полям.</p>
          </div>
          <div class="card p-3 rounded-xl space-y-1">
            <div class="font-bold">3. Задачи, Расписание дня и Дорожная карта</div>
            <p style="color: var(--text-muted);">Перетаскивайте задачи прямо на карточки участников, запускайте таймеры со звуком, добавляйте «Отдых 30 мин». Задачи с галочкой «На карте» автоматически появляются на Линии прогресса, а клик по ветке увеличивает описание.</p>
          </div>
          <div class="card p-3 rounded-xl space-y-1">
            <div class="font-bold">4. Вечное сохранение</div>
            <p style="color: var(--text-muted);">Все данные пишутся в IndexedDB + localStorage. Если используете Chrome/Edge, нажмите «Сейв / Доступ → Привязать авто-файл на ПК», чтобы каждое изменение сохранялось прямо в файл на диске.</p>
          </div>
          <div class="flex justify-end pt-1"><button id="closeGuideBtn" class="btn-accent px-4 py-1.5 rounded-lg text-xs font-semibold">${t('closeBtn')}</button></div>
        </div>
      `);
      document.getElementById('closeGuideBtn').addEventListener('click', closeModal);
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); showToast(t('toastLinkCopied')); } catch (e) {}
      ta.remove();
    }

    function toggleRoleMode() {
      if (state.roleMode === 'director') { state.roleMode = 'member'; saveState(); renderAll(); return; }
      if (!state.directorPin) { state.roleMode = 'director'; saveState(); renderAll(); return; }
      openModal(`
        <form id="pinUnlockForm" class="space-y-3.5">
          <h3 class="font-bold text-base">${t('enterPinPrompt')}</h3>
          <input id="pinUnlockInput" type="password" required class="w-full" placeholder="****" />
          <div class="flex justify-end gap-2"><button type="button" id="cancelPinBtn" class="px-4 py-2 rounded-lg card text-xs">${t('cancelBtn')}</button><button type="submit" class="btn-accent px-4 py-2 rounded-lg text-xs font-semibold">${t('switchToDirector')}</button></div>
        </form>
      `);
      document.getElementById('cancelPinBtn').addEventListener('click', closeModal);
      document.getElementById('pinUnlockForm').addEventListener('submit', (e) => {
        e.preventDefault();
        if (document.getElementById('pinUnlockInput').value.trim() === state.directorPin) { state.roleMode = 'director'; saveState(); closeModal(); renderAll(); }
        else showToast(t('wrongPin'));
      });
    }

    /* =========================================================================
       15. BOOTSTRAP
    ========================================================================= */
    async function initApp() {
      await loadStateAsync();

      document.getElementById('backToHomeBtn').addEventListener('click', () => { state.view = 'home'; saveState(); renderAll(); });
      document.getElementById('openThemeModalBtn').addEventListener('click', openThemeModal);
      document.getElementById('openShareModalBtn').addEventListener('click', openShareModal);
      document.getElementById('openGuideBtn').addEventListener('click', openGuideModal);
      document.getElementById('toggleRoleLockBtn').addEventListener('click', toggleRoleMode);
      document.getElementById('toggleMuteBtn').addEventListener('click', () => { state.muted = !state.muted; saveState(); renderAll(); });
      document.getElementById('toggleLangBtn').addEventListener('click', () => { state.lang = state.lang === 'ru' ? 'en' : 'ru'; saveState(); renderAll(); });
      document.getElementById('fxLevelSelect').addEventListener('change', (e) => { state.fxLevel = e.target.value; saveState(); renderAll(); });
      document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => { state.activeTab = btn.dataset.tab; saveState(); renderAll(); }));

      window.addEventListener('mousemove', (e) => {
        const glow = document.getElementById('cursorGlow');
        if (glow && state && state.fxLevel !== 'off') {
          glow.style.left = e.clientX + 'px';
          glow.style.top = e.clientY + 'px';
        }
      });

      window.addEventListener('resize', () => {
        const folder = state.view === 'folder' ? getActiveFolder() : null;
        initParticles((folder ? folder.theme : HUB_NEUTRAL_THEME).particleType, state.fxLevel);
      });

      renderAll();
      startGlobalTimer();
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
